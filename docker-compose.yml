version: "3.7"
services:
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
  rabbitmq:
    image: rabbitmq:3.9-management
    ports:
      - "5672:5672"
      - "15672:15672"
  redis:
    image: redis:6
    ports:
      - "6379:6379"
  mail:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
