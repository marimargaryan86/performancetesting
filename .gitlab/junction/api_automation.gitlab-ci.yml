integration:api_automation-tests:
  extends: .pants
  stage: test
  allow_failure: true
  variables:
    TEST_E2E_DEPARTURE_AFTER: "${DEPARTURE_AFTER}"
    TEST_E2E_ORIGIN: "${ORIGIN}"
    TEST_E2E_DESTINATION: "${DESTINATION}"
    TEST_E2E_HOSTNAME: "${HOSTNAME}"
    API_TOKEN: "${API_TOKEN}"
    ALLURE_PROJECT_ID: "${ALLURE_PROJECT_ID}"
    PROJECT_NAME: "${PROJECT_NAME}"
    PROJECT_DIR: "${PROJECT_DIR}"
  script:
    - TEST_E2E_TOKEN=$(eval "echo \$${API_TOKEN}")
    - ./bash/run-integration-tests.sh $PROJECT_DIR $TEST_E2E_HOSTNAME $TEST_E2E_TOKEN $ALLURE_PROJECT_ID
  after_script:
    - !reference [.pants, after_script]
    - ./bash/send-allure-reports.sh $ALLURE_PROJECT_ID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PROJECT_NAME == "api_automation"'
