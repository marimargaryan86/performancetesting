integration:api_automation-tests:
  extends: .pants
  stage: test
  allow_failure: true
  variables:
    TEST_E2E_DEPARTURE_AFTER: "${DEPARTURE_AFTER}"
    TEST_E2E_HOSTNAME: "${HOSTNAME}"
    API_TOKEN: "${API_TOKEN}"
    ALLURE_PROJECT_ID: "${ALLURE_PROJECT_ID}"
    PROJECT_NAME: "${PROJECT_NAME}"
    PROJECT_DIR: "${PROJECT_DIR}"
    SLACK_NOTIFICATION_CHANNEL: "${SLACK_NOTIFICATION_CHANNEL}"
    SLACK_NOTIFICATION_TOKEN: "${SLACK_NOTIFICATION_TOKEN}"
    TESTING_SUITE: "${TESTING_SUITE}"
  before_script:
    - SLACK_THREAD_NUMBER=$(./bash/slack-start-notification.sh $SLACK_NOTIFICATION_TOKEN $SLACK_NOTIFICATION_CHANNEL $ALLURE_PROJECT_ID)
    - echo $SLACK_THREAD_NUMBER > slack.txt
  script:
    - ./bash/run-integration-tests.sh $PROJECT_DIR $TEST_E2E_HOSTNAME $API_TOKEN $ALLURE_PROJECT_ID $TESTING_SUITE
  after_script:
    - SLACK_THREAD_NUMBER=$(cat slack.txt)
    - JOB_LINK=$(./bash/send-allure-reports.sh $ALLURE_PROJECT_ID)
    - ./bash/slack-end-notification.sh $SLACK_THREAD_NUMBER $JOB_LINK
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PROJECT_NAME == "api_automation"'

