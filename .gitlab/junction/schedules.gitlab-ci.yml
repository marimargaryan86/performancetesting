stages:
  - download
  - dev-export
  - dev-deploy
  - prod-export
  - prod-deploy
services:
  - name: docker:dind
    alias: dockerdaemon
image: "git.snowfall.se:4567/junction/junction/pants:main"
variables:
  ARTIFACT_COMPRESSION_LEVEL: fastest
  CACHE_COMPRESSION_LEVEL: fastest
  FF_NETWORK_PER_BUILD: "true"
  GIT_STRATEGY: clone
  DOCKER_HOST: tcp://dockerdaemon:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

oag:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - mkdir -p ~/.ssh
    - ssh-keyscan ftp.oag.com >> ~/.ssh/known_hosts
    - curl -u "${OAG_USERNAME}:${OAG_PASSWORD}" 'sftp://ftp.oag.com/SIMSFL.DAT.gz' | gunzip > SIMSFL.DAT
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/ssim-convert:latest
    - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/ssim-convert:latest convert /data/SIMSFL.DAT /data/data-input/

feeds:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/data_pipeline:latest
    - docker run -u "${UID}" $(env | grep '^PIPELINE_' | cut -f1 -d= | sed 's/^/-e /') --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/data_pipeline:latest download --path /data/data-input/

directferries:
  stage: download
  artifacts:
    expire_in: 1 day
    paths:
      - data-input/
  script:
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/direct_ferries:latest
    - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e CLIENT_ID="${DF_CLIENT_ID}" -e CLIENT_SECRET="${DF_CLIENT_SECRET}" git.snowfall.se:4567/junction/junction/service/direct_ferries:latest export --api-url 'https://sandbox-api.test.directferriesconnect.com' --affiliate-api-url 'https://tf-test-affiliate-api-sandbox.auth.eu-west-1.amazoncognito.com' --partner-code 'F5152' --output-path /data/data-input/

.import:
  timeout: 6h
  script:
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - if [ "$DOCKERPULL" ]; then docker pull git.snowfall.se:4567/junction/junction/service/gtfs-import:latest; fi
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/gtfs-import:latest /data/data-input/ /data/data-import/ $IMPORTDAYS
  - echo "${CI_PIPELINE_ID}" > data-import/pipeline-id
  - tar -czf data-import.tar.gz data-import/*
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp /data/data-import.tar.gz  "s3://junction-schedules-export/PipelineData/$PREFIX-data-import.tar.gz" --no-progress
  tags:
    - autoscaler-XL

.export:
  timeout: 6h
  artifacts:
    expire_in: 6 days
    paths:
    - data-export/
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp "s3://junction-schedules-export/PipelineData/$PREFIX-data-import.tar.gz" /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - if [ "$DOCKERPULL" ]; then docker pull git.snowfall.se:4567/junction/junction/service/schedules-export:latest; fi
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/schedules-export:latest --input-dir=/data/data-import/ --output-dir=/data/data-export/
  tags:
    - autoscaler-XL

.validate:
  timeout: 6h
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp "s3://junction-schedules-export/PipelineData/$PREFIX-data-import.tar.gz" /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - if [ "$DOCKERPULL" ]; then docker pull git.snowfall.se:4567/junction/junction/service/validate-dataset:latest; fi
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/validate-dataset:latest /data/data-export/ /data/data-import/schedules.bson /data/data-import/locations.bson
  tags:
    - autoscaler-XL

.import-to-server:
  timeout: 12h
  retry: 2
  services:
  - name: docker:dind
    alias: dockerdaemon
  - name: mongo:latest
  variables:
    MONGODSN: $MONGODSN_IMPORT
    IMPORT_PREFIX: $PREFIX
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp "s3://junction-schedules-export/PipelineData/$IMPORT_PREFIX-data-import.tar.gz" /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - if [ "$(cat data-import/pipeline-id)" != "${CI_PIPELINE_ID}" ]; then exit 1; fi
  - curl https://fastdl.mongodb.org/tools/db/mongodb-database-tools-debian11-x86_64-100.6.1.deb --output mongodb.deb
  - curl https://pgp.mongodb.com/server-6.0.asc | apt-key add -
  - echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
  - apt update && apt install ./mongodb.deb dnsutils mongodb-mongosh -y
  # Don't stop on error as duplicates sometimes happen. These are checked in validate step, so won't cause an issue.
  - mongorestore --db=places --collection=locations --drop --numInsertionWorkersPerCollection=20 'mongodb://mongo:27017' data-import/locations.bson
  - export GEODATA_ADDR="$(dig +short grpc.geodata-development.service.consul @172.16.110.215 -p 8600):$(dig +short SRV grpc.geodata-development.service.consul @172.16.110.215 -p 8600 | awk '{print $3}')"
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - if [ "$DOCKERPULL" ]; then docker pull git.snowfall.se:4567/junction/junction/service/places:latest; fi
  # We reuse the DEV DB as our places cache for all envs.
  - mongodump --db=places --collection=places --out="-" "$DEV_MONGODSN_IMPORT" > places-cache.bson
  - docker run -u "${UID}" --network=host --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/places:latest generate-cities --geodata-address="${GEODATA_ADDR}" --mongo-dsn='mongodb://mongo:27017' --places-dump='/data/places-cache.bson'
  - mongodump --db=places --collection=places --out="-" 'mongodb://mongo:27017' > data-import/places.bson
  - |
    mongosh "${MONGODSN}/places" --eval '
      try {db.places_import.drop();} catch (e) {}
      db.createCollection("places_import");
      db.places_import.createIndex({"location.coordinates": "2dsphere"});
      try {db.locations_import.drop();} catch (e) {}
      db.createCollection("locations_import");
      db.locations_import.createIndex({"coordinates": "2dsphere"});
      db = db.getMongo().getDB("schedules");
      try {db.schedules_import.drop();} catch (e) {}
      db.createCollection("schedules_import");
      db.schedules_import.createIndex({"legs._id": 1}, {unique: true});
      db.schedules_import.createIndex({"updated_at": 1});'
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp /data/data-import/pipeline-id "s3://junction-schedules-export/PipelineData/$PREFIX-last-pipeline-id" --no-progress
  - mongorestore --db=places --collection=places_import --stopOnError --numInsertionWorkersPerCollection=10 "${MONGODSN}" data-import/places.bson
  - mongorestore --db=places --collection=locations_import --numInsertionWorkersPerCollection=10 "${MONGODSN}" data-import/locations.bson
  - mongorestore --db=schedules --collection=schedules_import --stopOnError --numInsertionWorkersPerCollection=10 "${MONGODSN}" data-import/schedules.bson
  tags:
    - autoscaler-XL

.deploy-in-server:
  environment:
    name: $PREFIX
  resource_group: planner
  services:
  - name: docker:dind
    alias: dockerdaemon
  - name: mongo:latest
  variables:  # EFS_IP, MONGODSN_DEPLOY and NOMAD_ADDR must be defined in protected env.
    MONGODSN: $MONGODSN_DEPLOY
    NOMAD_NAMESPACE: $PREFIX
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp "s3://junction-schedules-export/PipelineData/$PREFIX-last-pipeline-id" /data/pipeline-id --no-progress
  - if [ "$(cat pipeline-id)" != "${CI_PIPELINE_ID}" ]; then exit 1; fi
  - curl https://pgp.mongodb.com/server-6.0.asc | apt-key add -
  - echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
  - apt update && apt install nfs-common mongodb-mongosh -y
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - if [ "$DOCKERPULL" ]; then docker pull git.snowfall.se:4567/junction/junction/service/mobile_api:latest; fi
  - mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,X-mount.mkdir ${EFS_IP}:/ /planner-efs
  - mkdir "/planner-efs/$PREFIX-$CI_PIPELINE_ID"
  - cp /planner-efs/$PREFIX/*.bin "/planner-efs/$PREFIX-$CI_PIPELINE_ID/"
  - cp data-export/*.bin "/planner-efs/$PREFIX/"
  - |
    for n in $(ls /planner-efs/ | sed -nr "s/${PREFIX}-([0-9]+)\$/\1/p" | sort -nr | tail -n '+3'); do
        rm -r "/planner-efs/${PREFIX}-${n}"
    done
  # Get existing allocs
  - mapfile -t allocation_ids < <(nomad job status planner-grpc | awk '/Allocations/{flag=1; next} flag && $6=="running" && !/^ID/{print $1}')
  # Get job spec and increase count by one
  - nomad job inspect planner-grpc > job.json
  - cat job.json | jq '.Job.TaskGroups[0].Count += 1' > newjob.json
  - nomad job run -json newjob.json
  - |
    mongosh "${MONGODSN}/places" --eval "
      try {db.places.renameCollection('places_backup_${CI_PIPELINE_ID}');} catch (e) {}
      db.places_import.renameCollection('places');
      try {db.locations.renameCollection('locations_backup_${CI_PIPELINE_ID}');} catch (e) {}
      db.locations_import.renameCollection('locations');
      let names = db.getCollectionNames();
      let toDelete = names.filter((c) => /^places_backup_\d+\$/.test(c)).map((c) => parseInt(c.split('_').at(-1))).sort((a, b) => a - b).slice(0, -2);
      for (let num of toDelete)
          db[\`places_backup_\${num}\`].drop();
      toDelete = names.filter((c) => /^locations_backup_\d+\$/.test(c)).map((c) => parseInt(c.split('_').at(-1))).sort((a, b) => a - b).slice(0, -2);
      for (let num of toDelete)
          db[\`locations_backup_\${num}\`].drop();
      db = db.getMongo().getDB('schedules');
      try {db.schedules.renameCollection('schedules_backup_${CI_PIPELINE_ID}');} catch (e) {}
      db.schedules_import.renameCollection('schedules');
      names = db.getCollectionNames();
      toDelete = names.filter((c) => /^schedules_backup_\d+\$/.test(c)).map((c) => parseInt(c.split('_').at(-1))).sort((a, b) => a - b).slice(0, -2);
      for (let num of toDelete)
          db[\`schedules_backup_\${num}\`].drop();"
  - |
    for element in "${allocation_ids[@]}"; do
        nomad alloc restart "${element}"
    done
  - |
    while [[ -n $(curl -s ${NOMAD_ADDR%:*}:8500/v1/health/checks/planner-development | jq '.[] | select(.Status != "passing")') ]]; do
        echo "Waiting for restarted service to become healthy. Checking health in 60 seconds"
        sleep 60
    done
  - nomad job run -json job.json
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='mobile-api' --mongo-dsn="${MONGODSN}/?retryWrites=false"
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='res-se-mobile-api' --mongo-dsn="${MONGODSN}/?retryWrites=false"
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='booking-hub-mobile-api' --mongo-dsn="${MONGODSN}/?retryWrites=false"
  - if [ "$PREFIX" == "development" ]; then docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='qa-mobile-api' --mongo-dsn="${MONGODSN}/?retryWrites=false"; fi

  tags:
    - docker

.dev:
  variables:
    DOCKERPULL: 1  # Only first job should pull, so other jobs use the same code even if a deployment happens.
    IMPORTDAYS: 28
    MONGODSN_IMPORT: $DEV_MONGODSN_IMPORT
    PREFIX: "development"

.prod:
  variables:
    MONGODSN_IMPORT: $PROD_MONGODSN_IMPORT
    PREFIX: "production"

.sandbox:
  variables:
    MONGODSN_IMPORT: $SANDBOX_MONGODSN_IMPORT
    PREFIX: "sandbox"

dev-import:
  extends: [".import", ".dev"]
  stage: dev-export
  needs: ["directferries", "feeds", "oag"]

dev-export:
  extends: [".export", ".dev"]
  stage: dev-export
  needs: ["dev-import"]

dev-validate:
  extends: [".validate", ".dev"]
  stage: dev-export
  needs: ["dev-import", "dev-export"]

import-to-dev:
  extends: [".import-to-server", ".dev"]
  stage: dev-deploy
  needs: ["dev-import"]

deploy-in-dev:
  extends: [".deploy-in-server", ".dev"]
  stage: dev-deploy
  needs: ["dev-export", "import-to-dev", "dev-validate"]

import-to-sandbox:
  extends: [".import-to-server", ".sandbox"]
  stage: dev-deploy
  needs: ["dev-import"]
  variables:
    IMPORT_PREFIX: "development"  # Use import artifact from dev job.

deploy-in-sandbox:
  extends: [".deploy-in-server", ".sandbox"]
  stage: dev-deploy
  needs: ["dev-export", "import-to-sandbox", "deploy-in-dev"]

prod-import:
  extends: [".import", ".prod"]
  stage: prod-export
  needs: ["directferries", "feeds", "oag", "dev-validate"]

prod-export:
  extends: [".export", ".prod"]
  stage: prod-export
  needs: ["prod-import"]

prod-validate:
  extends: [".validate", ".prod"]
  stage: prod-export
  needs: ["prod-import", "prod-export"]

import-to-prod:
  extends: [".import-to-server", ".prod"]
  stage: prod-deploy
  needs: ["prod-import"]

deploy-in-prod:
  extends: [".deploy-in-server", ".prod"]
  stage: prod-deploy
  needs: ["prod-export", "import-to-prod", "prod-validate"]
