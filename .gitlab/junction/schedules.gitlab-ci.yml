stages:
  - download
  - export
services:
  - name: docker:dind
    alias: dockerdaemon
image: 'git.snowfall.se:4567/junction/junction/pants:main'
variables:
  ARTIFACT_COMPRESSION_LEVEL: fastest
  CACHE_COMPRESSION_LEVEL: fastest
  GIT_STRATEGY: clone
  DOCKER_HOST: tcp://dockerdaemon:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

oag:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - mkdir -p ~/.ssh
    - ssh-keyscan ftp.oag.com >> ~/.ssh/known_hosts
    - curl -u "${OAG_USERNAME}:${OAG_PASSWORD}" 'sftp://ftp.oag.com/SIMSFL.DAT.gz' | gunzip > SIMSFL.DAT
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/ssim-convert:latest
    - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/ssim-convert:latest convert /data/SIMSFL.DAT /data/data-input/
  tags:
    - autoscaler-XL

feeds:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/data_pipeline:latest
    - docker run -u "${UID}" $(env | grep '^PIPELINE_' | cut -f1 -d= | sed 's/^/-e /') --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/data_pipeline:latest download --path /data/data-input/
  tags:
    - autoscaler-XL

import:
  stage: export
  needs: ["oag", "feeds"]
  timeout: 6h
  script:
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/gtfs-import:latest
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/gtfs-import:latest /data/data-input/ /data/data-import/ 28
  - tar -czf data-import.tar.gz data-import/*
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp /data/data-import.tar.gz  s3://junction-schedules-export/PipelineData/data-import.tar.gz --no-progress
  tags:
    - autoscaler-XL

export:
  stage: export
  needs: ["import"]
  timeout: 6h
  artifacts:
    expire_in: 1 day
    paths:
    - data-export/
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp s3://junction-schedules-export/PipelineData/data-import.tar.gz /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/schedules-export:latest
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/schedules-export:latest --input-dir=/data/data-import/ --output-dir=/data/data-export/
  tags:
    - autoscaler-XL
