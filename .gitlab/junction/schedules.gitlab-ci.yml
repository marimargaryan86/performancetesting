stages:
  - download
  - export
  - deploy
services:
  - name: docker:dind
    alias: dockerdaemon
image: "git.snowfall.se:4567/junction/junction/pants:main"
variables:
  ARTIFACT_COMPRESSION_LEVEL: fastest
  CACHE_COMPRESSION_LEVEL: fastest
  FF_NETWORK_PER_BUILD: "true"
  GIT_STRATEGY: clone
  DOCKER_HOST: tcp://dockerdaemon:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

oag:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - mkdir -p ~/.ssh
    - ssh-keyscan ftp.oag.com >> ~/.ssh/known_hosts
    - curl -u "${OAG_USERNAME}:${OAG_PASSWORD}" 'sftp://ftp.oag.com/SIMSFL.DAT.gz' | gunzip > SIMSFL.DAT
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/ssim-convert:latest
    - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/ssim-convert:latest convert /data/SIMSFL.DAT /data/data-input/

feeds:
  stage: download
  retry: 1
  artifacts:
    expire_in: 1 day
    paths:
    - data-input/
  script:
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/data_pipeline:latest
    - docker run -u "${UID}" $(env | grep '^PIPELINE_' | cut -f1 -d= | sed 's/^/-e /') --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/data_pipeline:latest download --path /data/data-input/

directferries:
  stage: download
  artifacts:
    expire_in: 1 day
    paths:
      - data-input/
  script:
    - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
    - docker pull git.snowfall.se:4567/junction/junction/service/direct_ferries:latest
    - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e CLIENT_ID="${DF_CLIENT_ID}" -e CLIENT_SECRET="${DF_CLIENT_SECRET}" git.snowfall.se:4567/junction/junction/service/direct_ferries:latest export --api-url 'https://sandbox-api.test.directferriesconnect.com' --affiliate-api-url 'https://tf-test-affiliate-api-sandbox.auth.eu-west-1.amazoncognito.com' --partner-code 'F5152' --output-path /data/data-input/

import:
  stage: export
  needs: ["directferries", "feeds", "oag"]
  timeout: 6h
  script:
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/gtfs-import:latest
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/gtfs-import:latest /data/data-input/ /data/data-import/ 28
  - tar -czf data-import.tar.gz data-import/*
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp /data/data-import.tar.gz  s3://junction-schedules-export/PipelineData/data-import.tar.gz --no-progress
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 rm s3://junction-schedules-export/PipelineData/final/ --recursive
  tags:
    - autoscaler-XL

export:
  stage: export
  needs: ["import"]
  timeout: 6h
  artifacts:
    expire_in: 1 day
    paths:
    - data-export/
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp s3://junction-schedules-export/PipelineData/data-import.tar.gz /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/schedules-export:latest
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/schedules-export:latest --input-dir=/data/data-import/ --output-dir=/data/data-export/
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp /data/data-export/ s3://junction-schedules-export/PipelineData/final/ --recursive --exclude '*' --include '*.bin' --no-progress
  tags:
    - autoscaler-XL

validate:
  stage: export
  needs: ["import", "export"]
  timeout: 6h
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp s3://junction-schedules-export/PipelineData/data-import.tar.gz /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/validate-dataset:latest
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/validate-dataset:latest /data/data-export/ /data/data-import/schedules.bson /data/data-import/locations.bson
  tags:
    - autoscaler-XL

import-to-dev:
  stage: deploy
  needs: ["import"]
  timeout: 12h
  retry: 2
  services:
  - name: docker:dind
    alias: dockerdaemon
  - name: mongo:latest
  script:
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" amazon/aws-cli s3 cp s3://junction-schedules-export/PipelineData/data-import.tar.gz /data/data-import.tar.gz --no-progress
  - tar -xzf data-import.tar.gz
  - curl https://fastdl.mongodb.org/tools/db/mongodb-database-tools-debian11-x86_64-100.6.1.deb --output mongodb.deb
  - curl https://pgp.mongodb.com/server-6.0.asc | apt-key add -
  - echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
  - apt update && apt install ./mongodb.deb dnsutils mongodb-mongosh -y
  - mongorestore --db=places --collection=locations --stopOnError --numInsertionWorkersPerCollection=20 'mongodb://mongo:27017' data-import/locations.bson
  - export GEODATA_ADDR="$(dig +short grpc.geodata-development.service.consul @172.16.110.215 -p 8600):$(dig +short SRV grpc.geodata-development.service.consul @172.16.110.215 -p 8600 | awk '{print $3}')"
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/places:latest
  - docker run -u "${UID}" --network=host --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/places:latest generate-cities --geodata-address="${GEODATA_ADDR}" --mongo-dsn='mongodb://mongo:27017'
  - mongodump --db=places --collection=places --out="-" 'mongodb://mongo:27017' > data-import/places.bson
  - |
    mongosh "${DEV_MONGODSN}/places" --eval '
      try {db.places_import.drop();} catch (e) {}
      db.createCollection("places_import");
      db.places_import.createIndex({"location.coordinates": "2dsphere"});
      try {db.locations_import.drop();} catch (e) {}
      db.createCollection("locations_import");
      db.locations_import.createIndex({"coordinates": "2dsphere"});
      db = db.getMongo().getDB("schedules");
      try {db.schedules_import.drop();} catch (e) {}
      db.createCollection("schedules_import");
      db.schedules_import.createIndex({"legs._id": 1}, {unique: true});
      db.schedules_import.createIndex({"updated_at": 1});'
  - mongorestore --db=places --collection=places_import --stopOnError --numInsertionWorkersPerCollection=10 "${DEV_MONGODSN}" data-import/places.bson
  - mongorestore --db=places --collection=locations_import --stopOnError --numInsertionWorkersPerCollection=10 "${DEV_MONGODSN}" data-import/locations.bson
  - mongorestore --db=schedules --collection=schedules_import --stopOnError --numInsertionWorkersPerCollection=10 "${DEV_MONGODSN}" data-import/schedules.bson
  tags:
    - autoscaler-XL

deploy-in-dev:
  stage: deploy
  needs: ["export", "import-to-dev", "validate"]
  resource_group: planner
  services:
  - name: docker:dind
    alias: dockerdaemon
  - name: mongo:latest
  script:
  - curl https://pgp.mongodb.com/server-6.0.asc | apt-key add -
  - echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse" | tee /etc/apt/sources.list.d/mongodb-org-6.0.list
  - apt update && apt install nfs-common mongodb-mongosh -y
  - docker login git.snowfall.se:4567 -u "${REGISTRY_USERNAME}" -p "${REGISTRY_PASSWORD}"
  - docker pull git.snowfall.se:4567/junction/junction/service/mobile_api:latest
  - mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,X-mount.mkdir ${EFS_IP}:/ /planner-efs
  - cp data-export/*.bin /planner-efs/development/
  - |
    export NOMAD_ADDR="${DEV_NOMAD_ADDR}"
    export NOMAD_NAMESPACE="development"
    # Get existing allocs
    mapfile -t allocation_ids < <(nomad job status planner-grpc | awk '/Allocations/{flag=1; next} flag && $6=="running" && !/^ID/{print $1}')

    # Get job spec and increase count by one
    nomad job inspect planner-grpc > job.json
    json_data=$(cat job.json)
    echo "$json_data" | jq '.Job.TaskGroups[0].Count += 1' > newjob.json

    nomad job run -json newjob.json
    for element in "${allocation_ids[@]}"; do
        nomad alloc restart "${element}"
    done

    while [[ -n $(curl -s ${NOMAD_ADDR%:*}:8500/v1/health/checks/planner-development | jq '.[] | select(.Status != \"passing\")') ]]
    do
        echo "Waiting for restarted service to become healthy. Checking health in 60 seconds"
        sleep 60
    done
    nomad job run -json job.json
  - |
    mongosh "${DEV_MONGODSN}/places" --eval '
      let now = new Date().toISOString().replaceAll("-", "").replaceAll(":", "").split(".")[0];
      try {db.places.renameCollection("places_backup_" + now);} catch (e) {}
      db.places_import.renameCollection("places");
      try {db.locations.renameCollection("locations_backup_" + now);} catch (e) {}
      db.locations_import.renameCollection("locations");
      db = db.getMongo().getDB("schedules");
      try {db.schedules.renameCollection("schedules_backup_" + now);} catch (e) {}
      db.schedules_import.renameCollection("schedules");'
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='mobile-api' --mongo-dsn="${DEV_MONGODSN}"
  - docker run -u "${UID}" --rm -v "$(pwd)/:/data" git.snowfall.se:4567/junction/junction/service/mobile_api:latest migrate --mongo-db='res-se-mobile-api' --mongo-dsn="${DEV_MONGODSN}"
  tags:
    - docker
