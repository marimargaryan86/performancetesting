nomad:validate:
  stage: test
  interruptible: true
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  script:
    - find . -name '*.nomad' -exec nomad validate {} \;
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - "**/*.nomad"
  needs:
    - "pants:setup"
  tags:
    - docker

nomad:deploy:
  stage: deploy
  interruptible: false
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  before_script:
    - mkdir -p ~/.ssh/
    - mv "${NOMAD_SSH_KEY}" ~/.ssh/id_ed25519
    - mv "${NOMAD_SSH_KNOWN_HOSTS}" ~/.ssh/known_hosts
    - chmod 700 ~/.ssh/
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ./bash/push-deployables.sh junction.dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - "pants:package"
  tags:
    - docker
