markdown:validate:
  stage: test
  interruptible: true
  script:
    - "find . -name '*.md' -print0 | xargs -0 -t -n1 -I \"{}\" sh -c 'sed -n 2,1p {} | grep -q \"^internal:\" || (echo \"--> FAIL: you need to specify internal true or false in this file!\" && exit 1)'"
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - "**/*.md"
  needs:
    - "pants:setup"
  tags:
    - shell
