pants:setup:
  stage: setup
  interruptible: true
  script:
    - docker login -u "${CI_DEPENDENCY_PROXY_USER}" -p "${CI_DEPENDENCY_PROXY_PASSWORD}" "${CI_DEPENDENCY_PROXY_SERVER}"
    - DOCKER_BUILDKIT=1 docker build --pull --compress -f ".gitlab/pants.Dockerfile" -t "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}" --build-arg "REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" --build-arg BUILDKIT_INLINE_CACHE=1 .gitlab/
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker push "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - shell

.pants:
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  before_script:
    - eval "$(pyenv init -)"
    - ./pants --version
  after_script:
    - ./bash/nuke-if-too-big.sh .cache 384
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    PANTS_CONFIG_FILES: ./pants.ci.toml
    PANTS_DOCKER_DEFAULT_REPOSITORY: "${CI_PROJECT_PATH}/service/{directory}"
    PANTS_DOCKER_REGISTRIES: "{'${CI_REGISTRY}': {'address': '${CI_REGISTRY}', 'default': True}}"
    PANTS_SETUP_CACHE: .cache
  cache:
    key: "pants-setup"
    paths:
      - .cache/
    when: always
  needs:
    - "pants:setup"
  tags:
    - docker

pants:test:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - ./bash/lint-pants.sh
  artifacts:
    reports:
      junit: dist/test_results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: dist/coverage/python/coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'

pants:package:
  extends: .pants
  stage: package
  script:
    - ./bash/package-pants.sh
  variables:
    DOCKER_HOST: tcp://dockerdaemon:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    PANTS_PUBLISH_OUTPUT: dist/deliverables.json
  services:
    - name: docker:dind
      alias: dockerdaemon
  resource_group: package # needed due to Docker images disappearing :(
  artifacts:
    paths:
      - dist/
  needs:
    - job: "pants:test"
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
