variables:
  BAZEL_REMOTE_S3_ACCESS_KEY_ID: $PANTS_CACHE_S3_ACCESS_KEY_ID
  BAZEL_REMOTE_S3_SECRET_ACCESS_KEY: $PANTS_CACHE_S3_SECRET_ACCESS_KEY

pants:setup:
  stage: setup
  interruptible: true
  script:
    - docker login -u "${CI_DEPENDENCY_PROXY_USER}" -p "${CI_DEPENDENCY_PROXY_PASSWORD}" "${CI_DEPENDENCY_PROXY_SERVER}"
    - DOCKER_BUILDKIT=1 docker build --pull --compress -f ".gitlab/pants.Dockerfile" -t "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}" --build-arg "REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" --build-arg BUILDKIT_INLINE_CACHE=1 .gitlab/
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker push "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_IID || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $E2E == "true"  # Needed to run the planner-test.gitlab-ci.yml tests
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PROJECT_NAME == "api_automation"'
  tags:
    - shell

.pants:
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  before_script:
    - pants --version
  after_script:
    - ./bash/nuke-if-too-big.sh "${SCIE_BASE}" 512
  artifacts:
    paths:
      - .pants.d/pants.log
    when: always
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    PANTS_CONFIG_FILES: "+['pants.ci.toml','pants.go.toml']"
    PANTS_DOCKER_DEFAULT_REPOSITORY: "${CI_PROJECT_PATH}/service/{directory}"
    PANTS_DOCKER_REGISTRIES: "{'${CI_REGISTRY}': {'address': '${CI_REGISTRY}', 'default': True}}"
    SCIE_BASE: "${CI_PROJECT_DIR}/.cache/scie"
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/buchgr/bazel-remote-cache:v2.4.1"
      alias: bazel-remote
      variables:
        BAZEL_REMOTE_MAX_SIZE: 30
        BAZEL_REMOTE_S3_AUTH_METHOD: access_key
        BAZEL_REMOTE_S3_BUCKET: snowfall-gitlab-bazel-remote-cache
        BAZEL_REMOTE_S3_ENDPOINT: s3.eu-west-2.amazonaws.com
  cache:
    key: "python-3.11.4-go-1.19.10-scie-0.8.2-pants-2.16.0-0"
    when: always
    policy: pull
    paths:
      - "${SCIE_BASE}"
  needs:
    - "pants:setup"
  tags:
    - docker

pants:lint-check:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - "pants lint check ::"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'

pants:test:
  extends: .pants
  stage: test
  interruptible: true
  parallel: 3
  script:
    - 'pants test --shard="$((${CI_NODE_INDEX}-1))/${CI_NODE_TOTAL}" --pytest-args="--disable-socket --allow-unix-socket" ::'
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: dist/test_results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: dist/coverage/python/coverage.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'

pants:tailor-update-build-files:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - "pants tailor --check update-build-files --check ::"
  cache:
    policy: pull-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'

pants:package:
  extends: .pants
  stage: package
  script:
    - ./bash/package-pants.sh
  variables:
    DOCKER_HOST: tcp://dockerdaemon:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    PANTS_PUBLISH_OUTPUT: dist/deliverables.json
  services:
    - !reference [.pants, services]
    - name: "docker@sha256:ed6220b0de0f309f0844cf8cf1a6b861e981fb7f5c28bec6acc97abc910bd0a8"
      alias: dockerdaemon
  resource_group: pants-package
  artifacts:
    paths:
      - dist/
  needs:
    - job: "pants:test"
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pants:release:
  stage: deploy
  resource_group: pants-release
  interruptible: false
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  services:
    - name: docker:dind
      alias: dockerdaemon
  before_script:
    - mkdir -p ~/.ssh/
    - mv "${NOMAD_SSH_KEY}" ~/.ssh/id_ed25519
    - mv "${NOMAD_SSH_KNOWN_HOSTS}" ~/.ssh/known_hosts
    - chmod 700 ~/.ssh/
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "${NOMAD_GIT_EMAIL}"
    - git config --global user.name "${NOMAD_GIT_NAME}"
  script:
    - ./bash/push-deployables.sh
  variables:
    DOCKER_HOST: tcp://dockerdaemon:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  retry: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - "pants:package"
  tags:
    - docker
