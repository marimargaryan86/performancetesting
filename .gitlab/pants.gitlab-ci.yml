variables:
  BAZEL_REMOTE_S3_ACCESS_KEY_ID: $PANTS_CACHE_S3_ACCESS_KEY_ID
  BAZEL_REMOTE_S3_SECRET_ACCESS_KEY: $PANTS_CACHE_S3_SECRET_ACCESS_KEY

pants:setup:
  stage: setup
  interruptible: true
  script:
    - docker login -u "${CI_DEPENDENCY_PROXY_USER}" -p "${CI_DEPENDENCY_PROXY_PASSWORD}" "${CI_DEPENDENCY_PROXY_SERVER}"
    - docker login -u "${PIPELINE_REGISTRY_USER}" -p "${PIPELINE_REGISTRY_USER_PASSWORD}" "${CI_REGISTRY}"
    - docker buildx build --cache-to type=inline --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG} --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}/pants:${CI_DEFAULT_BRANCH} --pull --push --compress -f ".gitlab/pants.Dockerfile" -t "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}" --build-arg "REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" --build-arg "PANTS_VERSION=$(grep pants_version pants.toml | cut -d'"' -f 2)" .gitlab/
  needs: []
  retry: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $E2E == "true"  # Needed to run the planner-test.gitlab-ci.yml tests
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PROJECT_NAME == "api_automation"'
  tags:
    - shell

.pants:
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  after_script:
    - |
      function nuke_if_too_big() {
        path=$1
        limit_mb=$2
        size_mb=$(du -m -d0 "${path}" | cut -f 1)
        if (( size_mb > limit_mb )); then
          echo "${path} is too large (${size_mb}mb), nuking it."
          nuke_prefix="$(dirname "${path}")/$(basename "${path}").nuke"
          nuke_path=$(mktemp -d "${nuke_prefix}.XXXXXX")
          mv "${path}" "${nuke_path}/"
          rm -rf "${nuke_prefix}.*"
        fi
        mkdir -p "${path}"
      }

      nuke_if_too_big "${PANTS_NAMED_CACHES_DIR}" 4098
  artifacts:
    paths:
      - .pants.d/pants.log
    when: always
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    PANTS_CONFIG_FILES: "+['pants.ci.toml', 'pants.go.toml']"
    PANTS_DOCKER_DEFAULT_REPOSITORY: "${CI_PROJECT_PATH}/service/{directory}"
    PANTS_DOCKER_REGISTRIES: "{'${CI_REGISTRY}': {'address': '${CI_REGISTRY}', 'default': True}}"
    PANTS_NAMED_CACHES_DIR: "${CI_PROJECT_DIR}/.cache/named_caches"
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/buchgr/bazel-remote-cache:v2.4.3"
      alias: bazel-remote
      variables:
        BAZEL_REMOTE_MAX_SIZE: 30
        BAZEL_REMOTE_S3_AUTH_METHOD: access_key
        BAZEL_REMOTE_S3_BUCKET: snowfall-gitlab-bazel-remote-cache
        BAZEL_REMOTE_S3_ENDPOINT: s3.eu-west-2.amazonaws.com
  cache:
    - key:
        prefix: "${CI_JOB_NAME}"
        files:
          - golang/go.sum
          - vendor/constraints.txt
      when: always
      paths:
        - "${PANTS_NAMED_CACHES_DIR}"
  needs:
    - "pants:setup"
  tags:
    - docker-mr-pants

pants:lint-check:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - "pants lint check ::"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pants:test:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - 'pants test --pytest-args="--disable-socket --allow-unix-socket" ::'
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: dist/test_results/*.xml
      coverage_report:
        coverage_format: cobertura
        path: dist/coverage/python/coverage.xml
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pants:tailor-update-build-files:
  extends: .pants
  stage: test
  interruptible: true
  script:
    - "pants tailor --check update-build-files --check ::"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pants:package:
  extends: .pants
  stage: package
  script:
    - ./bash/package-pants.sh
  variables:
    DOCKER_HOST: tcp://dockerdaemon:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    PANTS_PUBLISH_OUTPUT: dist/deliverables.json
  services:
    - !reference [.pants, services]
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker@sha256:862b11fdc8eec08b4641c4c18b3b684ae5cc42f60a93b661884edb9f9ba2cbb5"
      alias: dockerdaemon
  resource_group: "pants-package-${CI_COMMIT_REF_SLUG}"
  artifacts:
    paths:
      - dist/
  needs:
    - job: "pants:setup"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pants:release:
  stage: deploy
  resource_group: pants-release
  interruptible: false
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  services:
    - name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker@sha256:862b11fdc8eec08b4641c4c18b3b684ae5cc42f60a93b661884edb9f9ba2cbb5"
      alias: dockerdaemon
  before_script:
    - mkdir -p ~/.ssh/
    - mv "${NOMAD_SSH_KEY}" ~/.ssh/id_ed25519
    - mv "${NOMAD_SSH_KNOWN_HOSTS}" ~/.ssh/known_hosts
    - chmod 700 ~/.ssh/
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "${NOMAD_GIT_EMAIL}"
    - git config --global user.name "${NOMAD_GIT_NAME}"
  script:
    - ./bash/push-deployables.sh
  variables:
    DOCKER_HOST: tcp://dockerdaemon:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  retry: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - "pants:package"
  tags:
    - docker
