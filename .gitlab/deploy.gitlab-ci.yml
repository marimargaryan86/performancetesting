stages:
  - generate
  - deploy

.generate:
  stage: generate
  script:
    - ./${ENVIRONMENT_NAME}/generate-deploy-pipeline.sh "${ENVIRONMENT_NAME}" > "${ENVIRONMENT_NAME}.yml"
  needs: []
  tags:
    - shell

generate-dev:
  extends: .generate
  variables:
    ENVIRONMENT_NAME: development
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - development/**/*

deploy-dev:
  stage: deploy
  needs:
    - job: generate-dev
      artifacts: true
  trigger:
    include:
      - artifact: development.yml
        job: generate-dev
