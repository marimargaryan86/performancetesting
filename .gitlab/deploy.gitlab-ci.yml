stages:
  - generate
  - deploy

generate:
  stage: generate
  script:
    - mkdir dist
    - ./generate-deploy-pipeline.sh "${CI_COMMIT_BRANCH}" > "dist/${CI_COMMIT_BRANCH}.yml"
  needs: []
  artifacts:
    paths:
      - dist/
  tags:
    - shell

deploy:
  stage: deploy
  needs:
    - job: generate
      artifacts: true
  trigger:
    include:
      - artifact: dist/${CI_COMMIT_BRANCH}.yml
        job: generate
