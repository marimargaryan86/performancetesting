stages:
  - generate
  - deploy

.generate:
  stage: generate
  script:
    - mkdir dist
    - ./${ENVIRONMENT_NAME}/generate-deploy-pipeline.sh "${ENVIRONMENT_NAME}" "${NOMAD_ADDR}" "${DATACENTER}" > "dist/${ENVIRONMENT_NAME}.yml"
  needs: []
  artifacts:
    paths:
      - dist/
  tags:
    - shell

generate-dev:
  extends: .generate
  variables:
    DATACENTER: junction-dev-dc1
    NOMAD_ADDR: "${NOMAD_DEVELOPMENT_ADDR}"
    ENVIRONMENT_NAME: development
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - development/**/*

generate-prod:
  extends: .generate
  variables:
    DATACENTER: junction-prod-dc1
    NOMAD_ADDR: "${NOMAD_PRODUCTION_ADDR}"
    ENVIRONMENT_NAME: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - production/**/*

generate-sandbox:
  extends: .generate
  variables:
    DATACENTER: junction-sandbox-dc1
    NOMAD_ADDR: "${NOMAD_SANDBOX_ADDR}"
    ENVIRONMENT_NAME: sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - sandbox/**/*

deploy-dev:
  stage: deploy
  needs:
    - job: generate-dev
      artifacts: true
  trigger:
    include:
      - artifact: dist/development.yml
        job: generate-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - development/**/*

deploy-prod:
  stage: deploy
  needs:
    - job: generate-prod
      artifacts: true
  trigger:
    include:
      - artifact: dist/production.yml
        job: generate-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - production/**/*


deploy-sandbox:
  stage: deploy
  needs:
    - job: generate-sandbox
      artifacts: true
  trigger:
    include:
      - artifact: dist/sandbox.yml
        job: generate-sandbox
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - sandbox/**/*
