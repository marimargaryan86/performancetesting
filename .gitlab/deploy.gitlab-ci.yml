variables:
  SERVICES:
    value: ""
    description: "A comma-separated list of services to deploy. An empty list will deploy all services."

stages:
  - generate
  - deploy

generate:
  stage: generate
  script:
    - mkdir dist
    - ./generate-deploy-pipeline.sh "${CI_COMMIT_BRANCH}" "${SERVICES}" > "dist/${CI_COMMIT_BRANCH}.yml"
  needs: []
  artifacts:
    paths:
      - dist/
  tags:
    - shell

deploy:
  stage: deploy
  needs:
    - job: generate
      artifacts: true
  trigger:
    include:
      - artifact: dist/${CI_COMMIT_BRANCH}.yml
        job: generate
    strategy: depend
  resource_group: deploy-${CI_COMMIT_BRANCH}
