stages:
  - deploy

.deploy:
  stage: deploy
  resource_group: deploy
  image: git.snowfall.se:4567/junction/junction/pants:main
  script:
    - ./${CI_ENVIRONMENT_NAME}/deploy.sh "${CI_ENVIRONMENT_NAME}"
  needs: []
  variables:
    NOMAD_VAR_registry_address: "${CI_REGISTRY}"
    NOMAD_VAR_registry_password: "${NOMAD_REGISTRY_PASSWORD}"
    NOMAD_VAR_registry_username: "${NOMAD_REGISTRY_USERNAME}"
  tags:
    - docker

deploy-to-dev:
  extends: .deploy
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - junction.dev/**/*
  variables:
    NOMAD_NAMESPACE: "${CI_ENVIRONMENT_SLUG}"
