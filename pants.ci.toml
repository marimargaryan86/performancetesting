[GLOBAL]
colors = true
pantsd = false
remote_cache_read = true
remote_cache_write = true
remote_store_address = "grpc://bazel-remote-cache:9092"
remote_instance_name = "main"

[coverage-py]
report = ["xml"]

[docker]
env_vars = [
    "DOCKER_CONFIG",
    "DOCKER_HOST",
]

[python-bootstrap]
search_path = ["/usr/local/bin"]

[python-native-code]
cpp_flags = ["-I/usr/local/include/python3.9/"]

[test]
use_coverage = true
