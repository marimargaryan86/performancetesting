[GLOBAL]
colors = true
remote_cache_read = true
remote_cache_rpc_timeout_millis = 30000
remote_cache_write = true
remote_store_address = "grpc://bazel-remote:9092"

[coverage-py]
global_report = true
report = ["console", "xml"]

[docker]
env_vars = [
    "DOCKER_CONFIG",
    "DOCKER_HOST",
]

[test]
report = true
use_coverage = true
