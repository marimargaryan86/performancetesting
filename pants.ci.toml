[GLOBAL]
colors = true
pantsd = false
remote_cache_read = false
remote_cache_rpc_timeout_millis = 30000
remote_cache_write = false
remote_store_address = "grpc://bazel-remote:9092"
watch_filesystem = false

[coverage-py]
report = ["console", "xml"]

[docker]
env_vars = [
    "DOCKER_CONFIG",
    "DOCKER_HOST",
]

[test]
report = true
use_coverage = true
