[GLOBAL]
colors = true
pantsd = false
cache_content_behavior = "defer"
remote_cache_read = true
remote_cache_rpc_timeout_millis = 15000
remote_cache_write = true
remote_store_address = "grpc://bazel-remote:9092"
watch_filesystem = false

[anonymous-telemetry]
enabled = true
repo_id = "b578286c-4763-4a8e-ad9e-019c90b7b25d"

[coverage-py]
report = ["console", "xml"]

[docker]
env_vars = [
    "DOCKER_CONFIG",
    "DOCKER_HOST",
]

[test]
report = true
use_coverage = true
