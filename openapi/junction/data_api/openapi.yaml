---
openapi: 3.0.0
info:
  title: Junction Data API
  version: 1.0.0
  description: |-
    This API follows the [JSON:API][jsonapi] specification.

    [jsonapi]: https://jsonapi.org/
  contact:
    name: Snowfall
    url: https://www.snowfalltravel.com
    email: info@snowfalltravel.com
  license:
    name: Junction
    url: https://www.snowfalltravel.com
x-internal: true
x-tagGroups:
  - name: locations
    tags:
      - locations
  - name: Internal
    tags:
      - internal
tags:
  - name: internal
    description: Endpoints not for public use.
    x-displayName: Internal
  - name: locations
    description: Locations.
    x-displayName: Locations
paths:
  /health:
    get:
      summary: Health
      tags:
        - internal
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                description: ''
                type: object
                x-examples:
                  example-1:
                    meta:
                      status: ok
                properties:
                  meta:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        description: Health status
                        enum:
                          - pass
                          - fail
                          - warn
                        example: pass
                required:
                  - meta
      operationId: get-health
      description: Check the application health.
      x-internal: true
      security: []
  /locations:
    get:
      summary: List locations based on free-form text.
      tags:
        - locations
      parameters:
        - name: query[text]
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            example: london
          description: An address, name, city, or region to convert to a set of locations. For example, the string `Any Town`
        - name: query[biasPosition]
          in: query
          schema:
            type: string
            minLength: 5
            example: '-123.4567,45.6789'
          description: The position you want to search nearby. This narrows your search by searching for results closest to the given position. Defined as `longitude,latitude`
        - name: query[countries]
          in: query
          schema:
            type: array
            maxLength: 100
            items:
              type: string
            example:
              - AUS
          example:
            - AUS
          description: The country or region you want to geocode within. You can define up to 100 countries in one request using a ISO 3166 three letter country code. For example, use `AUS` for Australia.
        - name: query[language]
          in: query
          schema:
            type: string
            example: en
            default: en
          description: The preferred language used to return results. The value must be a valid BCP 47 language tag, for example, en for English. If no language is specified, or not supported for a particular result, the partner automatically chooses a language for the result. For an example, we'll use the Greek language. You search for Athens, Greece , with the language parameter set to `en`. The result found will most likely be returned as Athens. If you set the language parameter to `el`, for Greek, then the result found will more likely be returned as Αθήνα. If the data provider does not have a value for Greek, the result will be in a language that the provider does support.
        - name: page[limit]
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 50
          description: A limit on the number of objects to be returned, between 1 and 100.
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    uniqueItems: true
                    items:
                      $ref: '#/components/schemas/Locations'
                required:
                  - data
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: get-locations
      description: Geocodes free-form text, such as an address, name, city, or region to allow you to search for Places or points of interest. Optional parameters let you narrow your search results by bounding box or country, or bias your search toward a specific position on the globe. Search results are returned in order of highest to lowest relevance.
components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/vnd.api+json:
          schema:
            type: object
            properties:
              errors:
                type: array
                uniqueItems: true
                minItems: 1
                items:
                  $ref: '#/components/schemas/Error'
            required:
              - errors
  schemas:
    Locations:
      title: Locations
      type: object
      properties:
        id:
          type: string
          example: AQAAAIAADsn2T3KdrRWeaXLeVEyjNx_JfeTsMB0NVCEAnAZoJ-o3nqdlJZAdgcT2oWi1w9pS4wXXOk3O1vsKlGsPyHjV4EJxsu289i3hVO_BUPgP7SFoWAi8BW2v7LvAjQ5NfUPy7a1v9ajT3feIqcUZszWSTqKbJHFYvQqW7wdqhpQq3Wy-et39ZQDWSPLZUzgcjN-6VD2gyKkH0Po7gSm8YSJNSQ
        type:
          type: string
          enum:
            - locations
          example: locations
        attributes:
          type: object
          required:
            - latitude
            - longitude
            - name
          properties:
            addressNumber:
              type: string
              example: '11'
            street:
              type: string
              example: Kew Street
            unitNumber:
              type: string
              example: 3B
            unitType:
              type: string
              example: Apartment
            latitude:
              type: number
              format: float
              example: 59.651164062
              minimum: -90
              maximum: 90
            longitude:
              type: number
              format: float
              example: 17.917829662
              minimum: -180
              maximum: 180
            name:
              type: string
              example: Amazon, Jefferson City, MT, United States
            neighborhood:
              type: string
              example: Amazon
            municipality:
              type: string
              example: Jefferson City
            subregion:
              type: string
              example: Jefferson
            region:
              type: string
              example: Jefferson
            country:
              type: string
              example: Jefferson
            interpolated:
              type: boolean
              example: false
            timezone:
              type: object
              properties:
                name:
                  type: string
                  example: America/Denver
    Error:
      title: Error
      type: object
      description: JSON:API error
      properties:
        status:
          type: string
          pattern: ^[45][0-9]{2}$
          description: The HTTP status code applicable to this problem, expressed as a string value.
          example: '404'
        title:
          type: string
          example: Not Found
          description: A short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem. Like `title`, this field’s value can be localized.
          example: Nothing matches the given URI
        code:
          type: string
          example: required
          description: An application-specific error code, expressed as a string value.
        source:
          description: An object containing references to the source of the error.
          properties:
            pointer:
              type: string
              example: /data/attributes/title
              description: A JSON Pointer to the associated entity in the request document.
            parameter:
              type: string
              example: page[cursor]
              description: A string indicating which URI query parameter caused the error.
            header:
              type: string
              example: X-Request-Id
              description: A string indicating the name of a single request header which caused the error.
          minProperties: 1
          maxProperties: 1
          type: object
      required:
        - status
        - detail
  securitySchemes: {}
