rules:
  parameter-names:
    severity: warn
    message: "Invalid property name: {{value}} (expected: lowerCamelCase)"
    given: "$.paths.*.*.parameters.*.name"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z]+(?:\\[[a-z][A-Za-z]+\\])*$"
  property-names:
    severity: warn
    message: "Invalid property name: {{property}} (expected: lowerCamelCase)"
    given: "$..properties[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][A-Za-z]+$"
