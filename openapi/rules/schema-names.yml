---
rules:
  schema-names:
    severity: warn
    message: "Invalid schema name: {{property}} (expected: UpperCamelCase)"
    given: "$.components.schemas[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^([A-Z]{1}[a-z]{1,}){1,}$"
  schema-names-ordered-alphabetically:
    severity: warn
    description: "Schema names should be ordered alphabetically"
    message: "{{error}}"
    given: "$..components.schemas"
    then:
      function: alphabetical
