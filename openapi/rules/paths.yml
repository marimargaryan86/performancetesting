---
rules:
  redundant-path-ids:
    severity: error
    description: "Since every resource can be identified by it's unique identifier in a namespace, multiple identifiers in a path is unnecessary."
    message: "Having multiple identifiers in a path is redundant."
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "\\{.+?\\}.*\\{.+?\\}"
  paths-ordered-alphabetically:
    severity: warn
    description: "Paths should be ordered alphabetically"
    message: "{{error}}"
    given: $..paths
    then:
      function: alphabetical
