functions:
  - ensureRefs
  - ensureRequiredResourceFields
aliases:
  Resources:
    - $.paths..schema.properties.data
    - $.paths..schema.allOf[*].properties.data
  ResourceProperties:
    - "#Resources.properties"
    - "#Resources.allOf[*].properties"
  ResourceFields:
    - "#ResourceProperties[*]"
rules:
  json-api-resource-allowed-fields:
    message: "Disallowed resource field found: {{property}}"
    severity: error
    given: "#ResourceFields~"
    then:
      function: enumeration
      functionOptions:
        values:
          - id
          - type
          - attributes
          - relationships
          - links
          - meta

  json-api-resource-required-fields:
    message: "{{error}}"
    severity: error
    given: "#Resources"
    then:
      function: ensureRequiredResourceFields
      functionOptions:
        required:
          - id
          - type

  json-api-resource-refs:
    description: Resource objects must be references.
    severity: error
    given: "#Resources"
    resolved: false
    then:
      function: ensureRefs
  json-api-no-type:
    description: Field named `type` is not allowed in `attributes`.
    given: $..attributes..properties
    severity: error
    then:
      - field: "type"
        function: undefined
  json-api-no-nested-id:
    description: Identifiers are not allowed in `attributes`, they should be relationships.
    given: $..attributes..properties[?(@property.match(/(^id$|Id$|Identifier$)/))]~
    severity: error
    then:
      function: undefined
  json-api-no-nested-relationships:
    description: Field named `relationships` is not allowed in `attributes`.
    given: $..attributes..properties
    severity: error
    then:
      - field: "relationships"
        function: undefined
  json-api-no-nested-links:
    description: Field named `links` is not allowed in `attributes`.
    given: $..attributes..properties
    severity: error
    then:
      - field: "links"
        function: undefined
  json-api-no-nested-data:
    description: Field named `data` is not allowed in `attributes`.
    given: $..attributes..properties
    severity: error
    then:
      - field: "data"
        function: undefined
  json-api-no-relationships-type:
    description: Field named `type` is not allowed in `relationships`.
    given: $..relationships.properties
    severity: error
    then:
      - field: "type"
        function: undefined
  json-api-type-enum:
    description: Field named `type` should have `enum`.
    given: $..properties[type].type^
    severity: error
    then:
      - field: "enum"
        function: truthy
  json-api-no-put:
    description: "`PUT` endpoints are not allowed, use `PATCH` instead."
    documentationUrl: https://jsonapi.org/faq/#wheres-put
    given: $.paths[*].put^
    severity: error
    then:
      - field: "put"
        function: undefined
  json-api-no-required-parameters:
    description: "Required query parameters are not allowed, either make this a `POST` endpoint or make the required parameter part of the path."
    given: $.components.parameters[?(@.in=="query")]
    severity: error
    then:
      - field: "required"
        function: falsy

