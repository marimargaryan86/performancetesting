functions:
  - ensureArrayContains
  - ensureRefs
  - ensureRequiredResourceFields
aliases:
  Resources:
    - $.paths..schema.properties.data
    - $.paths..schema.allOf[*].properties.data
    - $.paths..schema.properties.data.oneOf[*]
  ResourceProperties:
    - "#Resources.properties"
    - "#Resources.allOf[*].properties"
  ResourceFields:
    - "#ResourceProperties[*]"
  ResourceIdentifiers:
    - "#ResourceProperties.relationships.properties[*].properties.data"
rules:
  json-api-resource-allowed-fields:
    message: "Disallowed resource field found: {{property}}"
    severity: error
    given: "#ResourceFields~"
    then:
      function: enumeration
      functionOptions:
        values:
          - id
          - type
          - attributes
          - relationships
          - links
          - meta
  json-api-resource-required-fields:
    message: "{{error}}"
    severity: error
    given:
      - "#Resources"
      - "#ResourceIdentifiers"
    then:
      function: ensureRequiredResourceFields
      functionOptions:
        required:
          - id
          - type
  json-api-resource-ensure-required:
    message: "{{error}}"
    severity: error
    given: "$..properties.id.type^^^.required"
    then:
      function: ensureArrayContains
      functionOptions:
        required:
          - id
          - type
  json-api-resource-refs:
    description: Resource objects must be references.
    severity: error
    given: "#Resources"
    resolved: false
    then:
      function: ensureRefs
  json-api-no-nested-id:
    description: Identifiers are not allowed in `attributes`, they should be relationships.
    given: $..attributes..properties[?(@property.match(/(^id$|Id$|Identifier$)/))]~
    severity: error
    then:
      function: undefined
  json-api-no-nested-unique-fields:
    description: Field named `attributes` is not allowed in `attributes`.
    message: "Field named `{{property}}` is not allowed in `attributes`."
    given: $..attributes..properties
    severity: error
    then:
      - field: "attributes"
        function: undefined
      - field: "data"
        function: undefined
      - field: "links"
        function: undefined
      - field: "relationships"
        function: undefined
      - field: "type"
        function: undefined
  json-api-no-relationships-type:
    description: Field named `type` is not allowed in `relationships`.
    given: $..relationships.properties
    severity: error
    then:
      - field: "type"
        function: undefined
  json-api-type-enum:
    description: Field named `type` should have `enum`.
    given: $..properties[type].type^
    severity: error
    then:
      - field: "enum"
        function: truthy
  json-api-no-put:
    description: "`PUT` endpoints are not allowed, use `PATCH` instead."
    documentationUrl: https://jsonapi.org/faq/#wheres-put
    given: $.paths[*].put^
    severity: error
    then:
      - field: "put"
        function: undefined
  json-api-no-required-parameters:
    description: "Required query parameters are not allowed, either make this a `POST` endpoint or make the required parameter part of the path."
    given: $.components.parameters[?(@.in=="query")]
    severity: error
    then:
      - field: "required"
        function: falsy
  json-api-query-parameter-names:
    description: "Query parameters should be either `sort`, `include`, `page[limit]`, `page[cursor]` or match `filter[.+]`."
    message: "`{{value}}` is an invalid query parameter name, it should be one of `sort`, `include`, `page[limit]`, `page[cursor]` or match `filter[.+]`."
    given: $.components.parameters[?(@.in=="query")].name
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^include|sort|page\\[(limit|cursor)\\]|filter\[[a-z]([A-Za-z]|\\.[a-z][A-Za-z])+\\]$"
  json-api-ensure-sort-default:
    description: "`sort` query parameters should have a default value."
    given: $.components.parameters[?(@.in=="query" && @.name=="sort")]
    severity: error
    then:
      - field: schema.default
        function: truthy
  json-api-ensure-sort-array:
    description: "`sort` query parameters should be of type `array`."
    given: $.components.parameters[?(@.in=="query" && @.name=="sort")]
    severity: error
    then:
      - field: schema.type
        function: enumeration
        functionOptions:
          values:
            - array
  json-api-ensure-sort-enum:
    description: "`sort` query parameters should specify an `enum` of possible values for its `items`."
    given: $.components.parameters[?(@.in=="query" && @.name=="sort")]
    severity: error
    then:
      - field: schema.items.enum
        function: truthy
  json-api-ensure-sort-style:
    description: "`sort` query parameters should have `form: style`."
    given: $.components.parameters[?(@.in=="query" && @.name=="sort")]
    severity: error
    then:
      - field: style
        function: truthy
      - field: style
        function: enumeration
        functionOptions:
          values:
            - form
  json-api-ensure-sort-explode:
    description: "`sort` query parameters should have `explode: false`."
    given: $.components.parameters[?(@.in=="query" && @.name=="sort")]
    severity: error
    then:
      - field: explode
        function: defined
      - field: explode
        function: falsy

