openapi:breaking:
  stage: test
  image:
    name: "node:18"
    entrypoint: [""]
  interruptible: true
  script: |
    for f in openapi/**/*.json; do
      git show "${CI_MERGE_REQUEST_DIFF_BASE_SHA}:${f}" > old.json || exit 0
      npx openapi-diff -- old.json "${f}"
    done
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:test:
  stage: test
  image:
    name: "stoplight/spectral:6"
    entrypoint: [""]
  interruptible: true
  script:
    - for f in openapi/**/*.json; do spectral lint --ruleset "openapi/.spectral.yml" --fail-severity warn "$f"; done
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:publish:
  stage: deploy
  image:
    name: "node:18"
    entrypoint: [""]
  script:
    - npx @stoplight/cli@5 push --ci-token ${STOPLIGHT_TOKEN}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - docker
