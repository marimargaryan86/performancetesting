openapi:breaking:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script: |
    set -eu
    shopt -s globstar
    shopt -s nullglob
    mkdir -p "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/openapi"
    git archive "${CI_MERGE_REQUEST_DIFF_BASE_SHA}:openapi" | tar -x -C "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/openapi"
    for f in openapi/**/openapi.json; do
      if [ ! -f "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/${f}" ]; then
        continue
      fi
      if ! oasdiff -format text -base "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/${f}" -revision "${f}" -check-breaking -fail-on-diff -include-checks request-body-enum-value-removed,response-mediatype-enum-value-removed; then
        if [ "$BREAKING" -eq "1" ]; then
          exit 2
        else
          exit 1
        fi
      fi
    done
  needs:
    - "pants:setup"
    - job: "allow-breaking-changes"
      artifacts: true
  allow_failure:
    exit_codes:
      - 2
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:test:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/stoplight/spectral:6"
    entrypoint: [""]
  interruptible: true
  script:
    - for f in openapi/**/*.json; do spectral lint --ruleset "openapi/.spectral.yml" --fail-severity warn --display-only-failures "$f"; done
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:publish:
  stage: deploy
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:18"
    entrypoint: [""]
  script:
    - find openapi/ -type f -name "*.json" -exec npx @apidevtools/swagger-cli@4.0.4 bundle \{\} -o \{\} -r \;
    - npx @stoplight/cli@6.0.1442 push --ci-token ${STOPLIGHT_TOKEN} --directory openapi/
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - docker
