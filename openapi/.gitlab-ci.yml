---
openapi:breaking:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script: |
    set -eu
    shopt -s globstar
    shopt -s nullglob
    mkdir -p "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/openapi"
    git archive "${CI_MERGE_REQUEST_DIFF_BASE_SHA}:openapi" | tar -x -C "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/openapi"
    for f in openapi/**/openapi.*; do
      if [ ! -f "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/${f}" ]; then
        continue
      fi
      if ! oasdiff breaking "/tmp/${CI_MERGE_REQUEST_DIFF_BASE_SHA}/${f}" "${f}" --fail-on=WARN --include-checks=request-body-enum-value-removed,response-mediatype-enum-value-removed; then
        if [ "$BREAKING" -eq "1" ]; then
          exit 2
        else
          exit 1
        fi
      fi
    done
  needs:
    - "pants:setup"
    - job: "allow-breaking-changes"
      artifacts: true
  allow_failure:
    exit_codes:
      - 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:test:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/stoplight/spectral:6.11.1@sha256:d55a6be334e3d50e1f3598e1fd4d51c5c1734d033aae295b69efa829420cb979"
    entrypoint: [""]
  interruptible: true
  script:
    - for f in openapi/**/openapi.*; do spectral lint --ruleset "openapi/.spectral.yml" --fail-severity warn --display-only-failures "$f"; done
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:changelog:
  stage: deploy
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script:
    - ./bash/post-openapi-changelog.sh
  needs:
    - "pants:setup"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - docker
