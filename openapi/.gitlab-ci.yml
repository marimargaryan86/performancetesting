openapi:breaking:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script: |
    set -eu
    shopt -s globstar
    shopt -s nullglob
    for f in openapi/**/openapi.json; do
      git show "${CI_MERGE_REQUEST_DIFF_BASE_SHA}:${f}" > old.json || continue
      if ! oasdiff -format text -base old.json -revision "${f}" -breaking-only -fail-on-diff; then
        if [ "$BREAKING" -eq "1" ]; then
          exit 2
        else
          exit 1
        fi
      fi
    done
  needs:
    - "pants:setup"
    - job: "allow-breaking-changes"
      artifacts: true
  allow_failure:
    exit_codes:
      - 2
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:test:
  stage: test
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/stoplight/spectral:6"
    entrypoint: [""]
  interruptible: true
  script:
    - for f in openapi/**/*.json; do spectral lint --ruleset "openapi/.spectral.yml" --fail-severity warn "$f"; done
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - openapi/**/*
  tags:
    - docker

openapi:publish:
  stage: deploy
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:18"
    entrypoint: [""]
  script:
    - npx @stoplight/cli@5 push --ci-token ${STOPLIGHT_TOKEN}
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - docker
