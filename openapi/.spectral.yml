extends:
  - [spectral:oas, all]
  - https://raw.githubusercontent.com/apisyouwonthate/style-guide/06bd2f71f676edc7ed56b8fbe1c35ba971d16665/apisyouwonthate.yml
  - https://raw.githubusercontent.com/apisyouwonthate/style-guide/06bd2f71f676edc7ed56b8fbe1c35ba971d16665/openapi.yml
  - rules/snowfall-ruleset.yml
rules:
  oas3-api-servers: off
  api-home: off
  operation-short-summary: off
overrides:
  - files:
      - "junction/mobile_api/openapi.json#/components/schemas/SegmentIdentifier/properties/legs/items"
      - "junction/mobile_api/openapi.json#/components/schemas/Trip/allOf/0/properties/attributes/properties/segments/items"
      - "junction/mobile_api/openapi.json#/components/schemas/Leg/allOf/0/properties"
    rules:
      json-api-no-nested-relationships: info
  - files:
      - "junction/mobile_api/openapi.json#/paths/~1places"
      - "junction/mobile_api/openapi.json#/paths/~1trips~1searches~1{tripSearchId}~1trips"
      - "junction/mobile_api/openapi.json#/paths/~1users~1{userId}~1orders"
    rules:
      ensure-pagination: info
  - files:
      - "junction/mobile_api/openapi.json#/components/schemas/LegTypeIdentifier"
      - "junction/mobile_api/openapi.json#/components/schemas/SegmentIdentifier/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/Trip"
      - "junction/mobile_api/openapi.json#/components/schemas/Order"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferAggregate"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferGroup/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferGroupNew/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferDetails/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferOption/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/TripOfferOptionDetails/properties"
    rules:
      json-api-no-nested-id: info
      json-api-no-type: info
  - files:
      - "junction/mobile_api/openapi.json#/components/schemas/LegTypeIdentifier"
      - "junction/mobile_api/openapi.json#/components/schemas/Trip"
      - "junction/mobile_api/openapi.json#/components/schemas/Order"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferAggregate"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferGroupNew/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/OfferOption/properties"
    rules:
      json-api-no-nested-data: info
  - files:
      - "junction/mobile_api/openapi.json#/components/schemas/Leg/allOf/0/properties"
      - "junction/mobile_api/openapi.json#/components/schemas/PaymentIntent"
      - "junction/client_api/openapi.json#/components/schemas/Order"
    rules:
      json-api-no-nested-id: info
