extends:
  - [spectral:oas, all]
  - https://raw.githubusercontent.com/openapi-contrib/style-guides/master/apisyouwonthate.yml
  - https://raw.githubusercontent.com/openapi-contrib/style-guides/master/openapi.yml
  - rules/snowfall-ruleset.yml
rules:
  oas3-api-servers: info
  api-home: info
  operation-short-summary: hint
overrides:
  - files:
      - "mobile_api/openapi.json#/components/schemas/SegmentIdentifier/properties/legs/items"
      - "mobile_api/openapi.json#/components/schemas/Trip/allOf/0/properties/attributes/properties/segments/items"
    rules:
      json-api-no-nested-relationships: info
