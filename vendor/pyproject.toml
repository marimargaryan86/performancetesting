[tool.bandit.assert_used]
skips = [
    "*_test.py",
    "*/conftest.py",
    "python/snowfall/stdlib/integration/starlette/routes/testing.py",
]

[tool.black]
line-length = 88
target-version = ["py310"]
preview = true

[tool.coverage.run]
branch = true
omit = ["*/conftest.py", "*_test.py", "*_pb2.py", "*_pb2_grpc.py"]
