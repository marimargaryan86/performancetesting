[tool.black]
line-length = 88
target-version = ["py311"]
preview = true

[tool.coverage.report]
omit = ["*_pb2.py", "*_pb2_grpc.py"]
include_namespace_packages = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.coverage.run]
branch = true
omit = ["*_pb2.py", "*_pb2_grpc.py"]
relative_files = true

[tool.flake8]
format = "wemake"
show-source = true
statistics = false
doctests = true
extend-exclude = ["gubernator_pb2*"]
max-complexity = 6
max-imports = 18
max-module-members = 12
max-line-length = 88
inline-quotes = "\""
strictness = "long"
i-control-code = true
i-dont-control-code = false
show-violation-links = true
noqa-require-code = true
forbidden-inline-ignore = ["SF20", "SF21", "SF22"]
nested-classes-whitelist = ["Config"]
select = [
  "D0",   # flake8-deprecated
  "I25",  # flake8-tidy-imports
  "KEK",  # flake8-if-expr
  "N400", # flake8-broken-line
  "NQA0", # flake8-noqa
  "NQA1", # flake8-noqa
  "P1",   # flake8-string-format
  "P2",   # flake8-string-format
  "P3",   # flake8-string-format
  "RST2", # flake8-rst-docstrings
  "RST3", # flake8-rst-docstrings
  "RST4", # flake8-rst-docstrings
  "SF",   # snowfall.plugin.flake8
  "WPS",  # wemake-python-styleguide
]
ignore = [
  "NQA101", # noqa has no violations. Disabled due to Ruff incompatibility.
  "NQA102", # noqa: X000 has no matching violations. Disabled due to Ruff incompatibility.
  "NQA103", # noqa: X000, X001 has unmatched code(s), remove X001. Disabled due to Ruff incompatibility.
  "RST303", # Unknown directive type. Disabled due to WPS incompatibility.
  "RST304", # Unknown interpreted text role. Disabled due to WPS incompatibility.
  "WPS113", # Found same alias import. Same as I250.
  "WPS226", # Found string constant over-use. Doesn't really improve the code with current workarounds.
  "WPS242", # Same as T20.
  "WPS316", # Found context manager with too many assignments. Conflicts with SIM117.
  "WPS317", # Found incorrect multi-line parameters. Disabled due to Black incompatibility.
  "WPS323", # Found `%` string formatting
  "WPS326", # Found implicit string concatenation
  "WPS437", # Forbid protected attributes and methods. Same as SLF001.
  "WPS451", # https://github.com/wemake-services/wemake-python-styleguide/issues/2712
  "WPS508", # Found incorrect `not` with compare usage. Same as SIM203.
  "WPS518", # Found implicit `enumerate()` call
]
per-file-ignores = [
  "*_test.py:WPS118,WPS202,WPS204,WPS211,WPS214,WPS432,WPS442",
  "conftest.py:WPS201,WPS202,WPS203,WPS235,WPS442",
  "main.py:WPS201,WPS202,WPS210,WPS235,WPS432",
  "python/snowfall/adapter/authentication.py:WPS202",
  "python/snowfall/project/junction/extensions/service/mobile_api/repository.py:WPS202",
  "python/snowfall/project/junction/extensions/service/mobile_api/resources.py:WPS202",
  "python/snowfall/project/junction/go/fixtures.py:WPS202,WPS204",
  "python/snowfall/project/junction/go/service/client_api/includes.py:WPS202",
  "python/snowfall/project/junction/go/service/client_api/resources.py:WPS202",
  "python/snowfall/project/junction/go/service/client_api/router.py:WPS201",
  "python/snowfall/project/junction/go/service/client_api/routes/offers.py:WPS202",
  "python/snowfall/project/junction/go/service/client_api/routes/orders.py:WPS202",
  "python/snowfall/project/junction/go/service/gateway/trips.py:WPS201",
  "python/snowfall/project/junction/hub/service/hub_api/resources.py:WPS201,WPS202",
  "python/snowfall/project/junction/plus/service/poc_api/chatbot_utils.py:WPS202",
  "python/snowfall/project/junction/provider/offers.py:WPS201",
  "python/snowfall/project/junction/service/providers/ask2go/booking.py:WPS201",
  "python/snowfall/project/junction/service/providers/benerail/adapter.py:WPS201",
  "python/snowfall/project/junction/service/providers/benerail/booking.py:WPS201",
  "python/snowfall/project/junction/service/providers/benerail/stations.py:WPS232",
  "python/snowfall/project/junction/service/providers/save_a_train/adapter.py:WPS201",
  "python/snowfall/project/pay/service/pay_api/resources.py:WPS202",
  "python/snowfall/stdlib/format/hcl2.py:WPS202",
  "python/snowfall/stdlib/persistence/filesystem.py:WPS402",
  "python/snowfall/stdlib/persistence/mongo/normalizers.py:WPS202",
  "python/snowfall/stdlib/service/application.py:WPS202",
  "python/snowfall/vendor/ask2go/models/offers.py:WPS202",
  "python/snowfall/vendor/carnect/models/*.py:SF10,WPS110,WPS114,WPS115,WPS118,WPS202,WPS420,WPS431,WPS604",
  "python/snowfall/vendor/distribusion/jsonapi_helpers.py:WPS110",
  "python/snowfall/vendor/distribusion/models/*.py:WPS202",
  "python/snowfall/vendor/save_a_train/client.py:WPS201",
]

[tool.mypy]
plugins = ["pydantic.mypy", "pydantic.v1.mypy"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = false # Can't activate because of some ignored packages.
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
follow_imports_for_stubs = true
no_implicit_reexport = true
local_partial_types = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_code_links = true
strict_optional = true
strict_equality = true
namespace_packages = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
  "snowfall.vendor.rate_limiter.gubernator_pb2",
  "snowfall.vendor.rate_limiter.gubernator_pb2_grpc",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "allure.*",            # https://github.com/allure-framework/allure-python/issues/731
  "authlib.*",           # https://github.com/lepture/authlib/issues/460
  "fsspec.*",            # https://github.com/fsspec/filesystem_spec/issues/625
  "furl.*",              # https://github.com/gruns/furl/issues/148
  "geopy.*",
  "google.rpc.*",        # https://github.com/nipunn1313/mypy-protobuf/issues/507
  "grpc.*",              # https://github.com/nipunn1313/mypy-protobuf/issues/507
  "grpc_health.*",       # https://github.com/nipunn1313/mypy-protobuf/issues/507
  "grpc_reflection.*",   # https://github.com/nipunn1313/mypy-protobuf/issues/507
  "grpc_status.*",       # https://github.com/nipunn1313/mypy-protobuf/issues/507
  "h3.*",                # https://github.com/uber/h3-py/pull/216
  "hvac.*",              # https://github.com/hvac/hvac/issues/800
  "isodate.*",
  "json_api_doc.*",
  "mongomock_motor.*",   # https://github.com/michaelkryukov/mongomock_motor/issues/29
  "pandas.*",
  "pycountry.*",         # https://github.com/flyingcircusio/pycountry/issues/135
  "qrcode.*",            # https://github.com/lincolnloop/python-qrcode/pull/321
  "rfc3339_validator.*",
  "s3fs.*",              # https://github.com/fsspec/s3fs/issues/383
  "shapefile.*",
  "shapely.*",           # https://github.com/shapely/shapely/issues/721
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true


[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:xdist.plugin",
  "ignore::DeprecationWarning:unittest.mock",
  "ignore::DeprecationWarning:mongomock.__version__:1",
  "ignore::DeprecationWarning:pkg_resources",
  "ignore::DeprecationWarning:google.rpc",
  "ignore::DeprecationWarning:openapi_core.deserializing.parameters.deserializers",
  "ignore::DeprecationWarning:openapi_core.validation.request.validators",
  "ignore::DeprecationWarning:pydantic._internal._generate_schema",
  "ignore::DeprecationWarning:pydantic._internal._model_construction",
]

addopts = "--import-mode=importlib --asyncio-mode=auto"

[tool.ruff]
external = [
  "P103",   # other string does contain unindexed parameters
  "SF10",   # All dataclasses should be frozen
  "SF20",   # Found mutable argument type
  "WPS110", # Forbid blacklisted variable names
  "WPS111", # Forbid short variable or module names
  "WPS114", # Forbid names with underscored numbers pattern
  "WPS115", # Require snake_case for naming class attributes
  "WPS117", # Found name reserved for first argument
  "WPS118", # Forbid long variable or module names
  "WPS204", # Forbid overused expressions in a module, function or method
  "WPS210", # Forbid too many local variables in the unit of code
  "WPS211", # Forbid too many arguments for a function or method
  "WPS213", # Forbid putting too many expressions in a single function
  "WPS214", # Forbid too many methods in a single class
  "WPS215", # Restrict the maximum number of base classes
  "WPS217", # Forbid placing too many await expressions in a function
  "WPS218", # Forbid placing too many assert statements into a function
  "WPS219", # Forbid consecutive expressions with too deep access level
  "WPS220", # Forbid nesting blocks too deep
  "WPS221", # Forbid complex lines
  "WPS223", # Forbid too many elif branches
  "WPS224", # Forbid too many for statements within a comprehension
  "WPS229", # Forbid try blocks with bodies that are too long
  "WPS231", # Forbid functions with too much cognitive complexity
  "WPS235", # Forbid from ... import ... with too many imported names
  "WPS238", # Forbids too many raise statements in a function
  "WPS306", # Forbid writing classes without base classes
  "WPS320", # Forbid multi-line function type annotations.
  "WPS336", # Forbid explicit string concatanation in favour of .format method
  "WPS337", # Forbid multiline conditions
  "WPS352", # Forbid multiline loops
  "WPS421", # Forbid calling some built-in functions
  "WPS430", # Forbid nested functions
  "WPS431", # Forbid nested classes
  "WPS432", # Forbid magic numbers
  "WPS436", # Forbid importing protected modules
  "WPS441", # Forbid control variables after the block body
  "WPS450", # Forbid importing protected objects from modules
  "WPS465", # Forbid comparisons between bitwise and boolean expressions
  "WPS473", # Limit empty lines in functions or methods body
  "WPS505", # Forbid nested try blocks
  "WPS601", # Forbid shadowing class level attributes with instance level attributes
  "WPS609", # Forbid directly calling certain magic attributes and methods
]
ignore = [
  "D100",    # Missing docstring in public module
  "D101",    # Missing docstring in public class
  "D102",    # Missing docstring in public method
  "D103",    # Missing docstring in public function
  "D104",    # Missing docstring in public package
  "D105",    # Missing docstring in magic method
  "D106",    # Missing docstring in public nested class
  "D107",    # Missing docstring in `__init__
  "D418",    # Function decorated with `@overload` shouldn't contain a docstring
  "ANN101",  # Missing type annotation for self in method
  "ANN102",  # Missing type annotation for cls in classmethod
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
  "E203",    # Whitespace before ':'
  "E501",    # Line too long
  "PLC1901", # can be simplified as an empty string is falsey
  "PLR0913", # Too many arguments to function call # TODO: fix
  "PLR2004", # Magic value used in comparison, consider replacing with a constant variable # TODO: fix
  "PLR6301", # Method could be a function or static method
  "PLR0904", # Too many public methods
  "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
  "TD003",   # Missing issue link on the line following this TODO
  "TRY003",  # Avoid specifying long messages outside the exception class # TODO: fix
  "UP004",   # Class inherits from `object`
  "UP030",   # Use implicit references for positional format fields
  "UP032",   # Use f-string instead of `format` call
]
select = [
  "A",   # flake8-builtins
  "AIR", # Airflow
  "ANN", # flake8-annotations
  #"ARG", # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  #"CPY", # Copyright-related rules
  "D",   # pydocstyle
  "DJ",  # flake8-django
  "DTZ", # flake8-datetimez
  "E",   # pycodestyle
  #"EM", # flake8-errmsg
  "ERA", # eradicate
  "EXE", # flake8-executable
  "F",   # Pyflakes
  "FA",  # flake8-future-annotations
  "FBT", # flake8-boolean-trap
  #"FIX", # flake8-fixme
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ISC",  # flake8-implicit-str-concat
  "ICN",  # flake8-import-conventions
  #"INP", # flake8-no-pep420
  "INT", # flake8-gettext
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "NPY", # NumPy-specific rules
  "PD",  # pandas-vet
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL",  # Pylint
  "RET", # flake8-return
  #"RSE", # flake8-raise
  "PERF", # Perflint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  #"TCH", # flake8-type-checking
  "TD",  # flake8-todos
  "TID", # flake8-tidy-imports
  "TRY", # tryceratops
  "UP",  # pyupgrade
  "W",   # pycodestyle
  "YTT", # flake8-2020
]
target-version = "py311"
preview = true
unsafe-fixes = true

[tool.ruff.flake8-annotations]
mypy-init-return = true

[tool.ruff.isort]
known-first-party = ["snowfall"]

[tool.ruff.per-file-ignores]
"*/conftest.py" = ["S101", "S105", "S106"]
"*_test.py" = ["S101", "S105", "S106"]
"python/snowfall/stdlib/integration/starlette/testing.py" = [
  "S101",
  "S105",
  "S106",
]
"python/snowfall/stdlib/testing/asserts.py" = ["S101", "S105", "S106"]
"python/snowfall/vendor/carnect/models/**/*.py" = ["A003"]
"python/snowfall/vendor/gubernator/gubernator_pb2.py" = ["E402", "ERA001"]
"python/snowfall/vendor/gubernator/gubernator_pb2_grpc.py" = [
  "ANN001",
  "ANN201",
  "ANN204",
  "ANN205",
  "N802",
]

[tool.ruff.pydocstyle]
convention = "google"
