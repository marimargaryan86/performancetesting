[tool.bandit.assert_used]
skips = ["*_test.py"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.coverage.run]
branch = true
omit = ["*/conftest.py", "*_test.py"]

[tool.poetry]
name = "Junction"
version = "1.0.0"
description = "Junction 3rd-pary dependencies."
authors = ["Snowfall Limited <info@snowfalltravel.com>"]

[tool.poetry.dependencies]
python = "3.9.9"
aiocsv = "^1.2.1"
aiofiles = "^0.8.0"
aiormq = "^6.1.1"
furl = "^2.1.3"
geopy = {extras = ["aiohttp"], version = "^2.2.0"}
grpcio = "^1.38.0"
grpcio-health-checking = "^1.38.0"
grpcio-reflection = "^1.38.0"
h3 = {extras = ["numpy"], version = "^3.7.3"}
httpx = {extras = ["http2"], version = "^0.21.1"}
lagom = "^1.7.0"
motor = "^2.5.1"
openapi-core = "^0.14.2"
phonenumbers = "^8.12.41"
protobuf = "^3.17.3"
pycountry = "^22.1.10"
pydantic = {extras = ["email"], version = "^1.8.2"}
python-dateutil = "^2.8.2"
python-rapidjson = "^1.5"
sentry-sdk = "^1.5.1"
setuptools = "^59.4.0"
starlette = "^0.17.1"
structlog = "^21.5.0"
timezonefinder = "^5.2.0"
uvicorn = {extras = ["standard"], version = "^0.15.0"}
tenacity = "^8.0.1"

[tool.poetry.group.dev.dependencies]
freezegun = "^1.1.0"
pytest = "^6.2.5"
requests = "^2.26.0"
types-aiofiles = "^0.7.0"
types-certifi = "^2021.10.8.0"
types-freezegun = "^1.1.3"
types-protobuf = "^3.18.2"
types-python-dateutil = "^2.8.3"
types-requests = "^2.26.1"
types-setuptools = "^57.4.4"
types-toml = "^0.10.1"


