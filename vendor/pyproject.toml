[tool.coverage.report]
omit = ["*_pb2.py", "*_pb2_grpc.py"]
include_namespace_packages = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
precision = 2

[tool.coverage.run]
branch = true
omit = ["*_pb2.py", "*_pb2_grpc.py"]
relative_files = true

[tool.flake8]
format = "wemake"
show-source = true
statistics = false
doctests = true
extend-exclude = ["gubernator_pb2*"]
max-line-length = 88
inline-quotes = "\""
strictness = "long"
i-control-code = true
i-dont-control-code = false
show-violation-links = true
noqa-require-code = true
forbidden-inline-ignore = ["SF21", "SF22"]
nested-classes-whitelist = ["Config"]
select = [
  "D0",     # flake8-deprecated
  "I25",    # flake8-tidy-imports
  "KEK",    # flake8-if-expr
  "N400",   # flake8-broken-line
