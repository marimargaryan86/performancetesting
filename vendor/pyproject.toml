[tool.mypy]
plugins = ["pydantic.mypy", "pydantic.v1.mypy"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = false # Can't activate because of some ignored packages.
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
follow_imports_for_stubs = true
no_implicit_reexport = true
local_partial_types = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_code_links = true
strict_optional = true
strict_equality = true
namespace_packages = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
  "snowfall.vendor.rate_limiter.gubernator_pb2",
  "snowfall.vendor.rate_limiter.gubernator_pb2_grpc",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "allure.*",                               # https://github.com/allure-framework/allure-python/issues/731
