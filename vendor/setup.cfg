        # Found too many module members. Disabled because of multiple test functions
        WPS202,
        # Found `noqa` comments overuse. Disabled because of testing private functions to reduce large monolith tests
        WPS402,
        # Found module with too many imports. Disabled because of testing involves lots of imports
        WPS201,
    python/snowfall/project/pay/service/pay_api/resources.py:
        # Found module with too many imports
        WPS201,
        # Found too many module members.
        WPS202,
ignore =
    # noqa has no violations. Disabled due to Ruff incompatibility.
    NQA101,
    # noqa: X000 has no matching violations. Disabled due to Ruff incompatibility.
    NQA102,
    # noqa: X000, X001 has unmatched code(s), remove X001. Disabled due to Ruff incompatibility.
    NQA103,
    # Unknown directive type. Disabled due to WPS incompatibility.
    RST303,
    # Unknown interpreted text role. Disabled due to WPS incompatibility.
    RST304,
    # Use 'class FooBar:' instead of 'class FooBar(object):'. Disabled due to WPS incompatibility.
    SIM120,
    # Line break occurred before a binary operator. Disabled due to Black incompatibility.
    W503,
    # Found same alias import. Same as I250.
    WPS113,
    # Found string constant over-use. Doesn't really improve the code with current workarounds.
    WPS226,
    # Same as T20.
    WPS242,
    # Found incorrect multi-line parameters. Disabled due to Black incompatibility.
    WPS317,
    # Found `%` string formatting
    WPS323,
    # Found implicit string concatenation
    WPS326,
    # Found incorrect `not` with compare usage. Same as SIM203.
    WPS508,

[flake8:local-plugins]
    extension =
        SF1 = snowfall.plugin.flake8.immutability:Plugin
        # SF3 = snowfall.plugin.flake8.imports:Plugin
        SF2 = snowfall.plugin.flake8.typing:Plugin

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true

default_section = THIRDPARTY
known_first_party = snowfall

[mypy]
plugins = pydantic.mypy
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = redundant-expr, truthy-bool, ignore-without-code, unused-awaitable
explicit_package_bases = true
follow_imports = normal
follow_imports_for_stubs = true
implicit_reexport = true
local_partial_types = true
pretty = true
show_error_codes = true
strict_optional = true
strict_equality = true
namespace_packages = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[mypy-snowfall.vendor.rate_limiter.gubernator_pb2]
ignore_errors = True

[mypy-snowfall.vendor.rate_limiter.gubernator_pb2_grpc]
ignore_errors = True

