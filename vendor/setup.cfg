[flake8]
format = wemake
show-source = True
statistics = False
doctests = True

max-complexity = 6
max-imports = 15
max-module-members = 9
max-line-length = 88
inline-quotes = "

strictness = long
docstring-style = numpy

i-control-code = True
i-dont-control-code = False
show-violation-links = True

nested-classes-whitelist = Config
select =
    # flake8-builtins
    A0,
    # flake8-annotations
    ANN,
    # flake8-bugbear
    B0,B902,B903,B904,B950,
    # flake8-comprehensions
    C4,
    # flake8-commas
    C8,
    # mccabe
    C9,
    # flake8-docstrings
    D1,D2,D3,D4,
    # pycodestyle
    E1,E2,E3,E4,E5,E7,E9,
    # flake8-eradicate
    E800,
    # flake8-executable
    EXE,
    # flake8
    F4,F5,F6,F7,F8,F9,
    # flake8-logging-format
    G0,G1,G2,
    # flake8-tidy-imports
    I25,
    # flake8-if-expr
    KEK,
    # flake8-broken-line
    N400,
    # pep8-naming
    N8,
    # flake8-noqa
    NQA0, NQA1,
    # flake8-string-format
    P1,P2,P3,
    # flake8-pie
    PIE,
    # flake8-quotes
    Q0,
    # flake8-rst-docstrings
    RST2,RST3,RST4,
    # snowfall.plugin.flake8
    SF,
    # flake8-simplify
    SIM,
    # flake8-debugger
    T100,
    # flake8-print
    T2,
    # pycodestyle
    W1,W2,W3,W5,W6,W504,
    # wemake-python-styleguide
    WPS,

per-file-ignores =
    conftest.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members. Conflicts with pytest fixtures.
        WPS202,
        # Found too many imported names from a module. Conflicts with pytest fixtures.
        WPS235,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    main.py:
        # Found module with too many imports.
        WPS201,
        # Found too many local variables. Main tends to bootstrap things.
        WPS210,
        # Found too many imported names from a module. Main tends to bootstrap things.
        WPS235,
        # Found magic number. Magic numbers are fine in the main file.
        WPS432,
    *_test.py:
        # Forbid long variable or module names. Conflicts with descriptive test names.
        WPS118,
        # Found too many module members. Conflicts with writing lots of tests.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
        # Found too many arguments. Just problematic to follow when writing tests.
        WPS211,
        # Found too many methods. Conflicts with writing lots of tests.
        WPS214,
        # Found magic number. Just problematic to follow when writing tests.
        WPS432,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    python/snowfall/fixtures.py:
        # Found too many module members.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
        # Found magic number. Just problematic to follow when writing tests.
        WPS432,
    python/snowfall/project/junction/adapter/orders.py:
        # Found overused expression.
        WPS204
        # Found too many methods.
        WPS214,
    python/snowfall/project/junction/service/client_api/includes.py:
        # Found too many module members
        WPS202,
    python/snowfall/project/junction/service/client_api/resources.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/service/client_api/routes/router.py:
        # Found too many imported names from a module
        WPS235,
    python/snowfall/project/junction/service/client_api/routes/offers.py:
        # Found too many module members.
        WPS202,
        # Found overused expression. @todo: refactor
        WPS204,
    python/snowfall/project/junction/service/client_api/routes/orders.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/service/mobile_api/repository.py:
        # Found too many module members.
        WPS202,
        # Found string literal over-use. Repeating Mongo operators
        WPS226,
    python/snowfall/project/junction/service/orders/grpc.py:
        # Found too many arguments.
        WPS211,
        # Found too many methods.
        WPS214,
    python/snowfall/project/junction/service/providers/mock/offers.py:
        # Found magic number. Magic numbers are fine in the main file.
        WPS432,
    python/snowfall/project/junction/service/providers/mock/orders.py:
        # Found magic number. Magic numbers are fine in the main file.
        WPS432,
    python/snowfall/project/junction/service/providers/save_a_train/adapter.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/project/junction/service/providers/save_a_train/main.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members
        WPS202,
        # Found magic number: 45
        WPS432,
        # Found too many await expressions: 6 > 5. @TODO: refactor
        WPS217,
        # Found too many local variables: 6 > 5. @TODO: refactor
        WPS210,
    python/snowfall/stdlib/format/gtfs/models.py:
        # Found too many module members.
        WPS202,
    python/snowfall/stdlib/integration/starlette/validation.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/stdlib/persistence/mongo/normalizers.py:
        # Found too many module members.
        WPS202,
    python/snowfall/stdlib/service.py:
        # Found too many module members.
        WPS202,
    python/snowfall/stdlib/transport/amqp.py:
        # Found too many module members.
        WPS202,
    python/snowfall/vendor/ask2go/client.py:
        # Found too many arguments.
        WPS211,
    python/snowfall/vendor/ask2go/models/offers.py:
        # Found too many module members.
        WPS202,
    python/snowfall/vendor/save_a_train/client.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/vendor/junction/client.py:
        # Found overused expression.
        WPS204,
    python/snowfall/project/junction/api_automation/conftest.py:
        # Found wrong variable name: items
        WPS110,
        # Found too many module members. Conflicts with pytest fixtures.
        WPS202,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
ignore =
    # Missing type annotation for *args. Disabled due to unnecessary clutter.
    ANN002,
    # Missing type annotation for **kwargs. Disabled due to unnecessary clutter.
    ANN003,
    # Missing type annotation for self in method. Disabled due to unnecessary clutter.
    ANN101,
    # Missing type annotation for cls in classmethod. Disabled due to unnecessary clutter.
    ANN102,
    # Missing return type annotation for special method. Disabled due to unnecessary clutter.
    ANN204,
    # Dynamically typed expressions (typing.Any) are disallowed. Disabled due to unnecessary clutter.
    ANN401,
    # Missing docstring in public module. Disabled due to unnecessary clutter.
    D100,
    # Missing docstring in public class. Disabled due to unnecessary clutter.
    D101,
    # Missing docstring in public method. Disabled due to unnecessary clutter.
    D102,
    # Missing docstring in public function. Disabled due to unnecessary clutter.
    D103,
    # Missing docstring in public package. Disabled due to unnecessary clutter.
    D104,
    # Missing docstring in magic method. Disabled due to unnecessary clutter.
    D105,
    # Missing docstring in public nested class. Disabled due to unnecessary clutter.
    D106,
    # Missing docstring in __init__. Disabled due to unnecessary clutter.
    D107,
    # Whitespace before ':'. Disabled due to Black incompatibility.
    E203,
    # Line too long. B950 provides better functionality.
    E501,
    # Inheriting from object is unnecessary in python3. Disabled due to WPS incompatibility.
    PIE792,
    # Unknown directive type. Disabled due to WPS incompatibility.
    RST303,
    # Unknown interpreted text role. Disabled due to WPS incompatibility.
    RST304,
    # Use 'class FooBar:' instead of 'class FooBar(object):'. Disabled due to WPS incompatibility.
    SIM120,
    # Line break occurred before a binary operator. Disabled due to Black incompatibility.
    W503,
    # Found string constant over-use. Doesn't really improve the code with current workarounds.
    WPS226,
    # Found incorrect multi-line parameters. Disabled due to Black incompatibility.
    WPS317,
    # Found `%` string formatting
    WPS323,

[flake8:local-plugins]
    extension =
        SF1 = snowfall.plugin.flake8.immutability:Plugin
        # SF3 = snowfall.plugin.flake8.imports:Plugin
        SF2 = snowfall.plugin.flake8.typing:Plugin

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true

default_section = THIRDPARTY
known_first_party = snowfall

[mypy]
plugins = pydantic.mypy
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
explicit_package_bases = true
follow_imports = normal
implicit_reexport = true
local_partial_types = true
show_error_codes = true
strict_optional = true
strict_equality = true
namespace_packages = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[mypy-bson.*]
ignore_missing_imports = true

[mypy-currencycloud.*]
ignore_missing_imports = true

[mypy-fakeredis.*]
ignore_missing_imports = true

[mypy-furl.*]
ignore_missing_imports = true

[mypy-geopy.*]
ignore_missing_imports = true

[mypy-grpc.*]
ignore_missing_imports = true

[mypy-grpc_health.*]
ignore_missing_imports = true

[mypy-isodate.*]
ignore_missing_imports = true

[mypy-jsonschema.*]
ignore_missing_imports = true

[mypy-grpc_reflection.*]
ignore_missing_imports = true

[mypy-grpc_status.*]
ignore_missing_imports = true

[mypy-h3.*]
ignore_missing_imports = true

[mypy-email_validator.*]
ignore_missing_imports = true

[mypy-mongomock_motor.*]
ignore_missing_imports = true

[mypy-motor.*]
ignore_missing_imports = true

[mypy-pycountry.*]
ignore_missing_imports = true

[mypy-rapidjson.*]
ignore_missing_imports = true

[mypy-shapefile.*]
ignore_missing_imports = true

[mypy-shapely.*]
ignore_missing_imports = true

[mypy-uvicorn.*]
ignore_missing_imports = true

[pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
