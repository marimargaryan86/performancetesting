[flake8]
format = wemake
show-source = True
statistics = False
doctests = True
extend-exclude = gubernator_pb2*

max-complexity = 6
max-imports = 15
max-module-members = 9
max-line-length = 88
inline-quotes = "

strictness = long
docstring-style = numpy

i-control-code = True
i-dont-control-code = False
show-violation-links = True
noqa-require-code = True

forbidden-inline-ignore =
    SF20,
    SF21,
    SF22

nested-classes-whitelist = Config
select =
    # flake8-deprecated
    D0,
    # flake8-docstrings
    D2,D3,D4,
    # flake8-tidy-imports
    I25,
    # flake8-if-expr
    KEK,
    # flake8-broken-line
    N400,
    # flake8-noqa
    NQA0, NQA1,
    # flake8-string-format
    P1,P2,P3,
    # flake8-rst-docstrings
    RST2,RST3,RST4,
    # snowfall.plugin.flake8
    SF,
    # flake8-todos
    T001,T004,T005,T006,T007,
    # wemake-python-styleguide
    WPS,

per-file-ignores =
    conftest.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members. Conflicts with pytest fixtures.
        WPS202,
        # Found too many imported names from a module. Conflicts with pytest fixtures.
        WPS235,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    main.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members.
        WPS202,
        # Found too many local variables. Main tends to bootstrap things.
        WPS210,
        # Found too many imported names from a module. Main tends to bootstrap things.
        WPS235,
        # Found magic number. Magic numbers are fine in the main file.
        WPS432,
    *_test.py:
        # Forbid long variable or module names. Conflicts with descriptive test names.
        WPS118,
        # Found too many module members. Conflicts with writing lots of tests.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
        # Found too many arguments. Just problematic to follow when writing tests.
        WPS211,
        # Found too many methods. Conflicts with writing lots of tests.
        WPS214,
        # Found magic number. Just problematic to follow when writing tests.
        WPS432,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    python/snowfall/project/junction/go/fixtures.py:
        # Found too many module members.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
        # Found magic number. Just problematic to follow when writing tests.
        WPS432,
    python/snowfall/project/junction/go/service/offers/aggregator.py:
