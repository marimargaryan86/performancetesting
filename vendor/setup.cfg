[flake8]
format = wemake
show-source = True
statistics = False
doctests = True
extend-exclude = gubernator_pb2*

max-complexity = 6
max-imports = 18
max-module-members = 12
max-line-length = 88
inline-quotes = "

strictness = long
docstring-style = numpy

i-control-code = True
i-dont-control-code = False
show-violation-links = True
noqa-require-code = True

forbidden-inline-ignore =
    SF20,
    SF21,
    SF22

nested-classes-whitelist = Config
select =
    # flake8-deprecated
    D0,
    # flake8-docstrings
    D2,D3,D4,
    # flake8-tidy-imports
    I25,
    # flake8-if-expr
    KEK,
    # flake8-broken-line
    N400,
    # flake8-noqa
    NQA0, NQA1,
    # flake8-string-format
    P1,P2,P3,
    # flake8-rst-docstrings
    RST2,RST3,RST4,
    # snowfall.plugin.flake8
    SF,
    # flake8-todos
    T001,T004,T005,T006,T007,
    # wemake-python-styleguide
    WPS,

per-file-ignores =
    conftest.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members. Conflicts with pytest fixtures.
        WPS202,
        # Found module with too many imported names
        WPS203,
        # Found too many imported names from a module. Conflicts with pytest fixtures.
        WPS235,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    main.py:
        # Found module with too many imports.
        WPS201,
        # Found too many module members.
        WPS202,
        # Found too many local variables. Main tends to bootstrap things.
        WPS210,
        # Found too many imported names from a module. Main tends to bootstrap things.
        WPS235,
        # Found magic number. Magic numbers are fine in the main file.
        WPS432,
    *_test.py:
        # Forbid long variable or module names. Conflicts with descriptive test names.
        WPS118,
        # Found too many module members. Conflicts with writing lots of tests.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
        # Found too many arguments. Just problematic to follow when writing tests.
        WPS211,
        # Found too many methods. Conflicts with writing lots of tests.
        WPS214,
        # Found magic number. Just problematic to follow when writing tests.
        WPS432,
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    python/snowfall/adapter/authentication.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/go/fixtures.py:
        # Found too many module members.
        WPS202,
        # Found overused expression. Just problematic to follow when writing tests.
        WPS204,
    python/snowfall/project/junction/plus/service/poc_api/chatbot_utils.py:
        # Found too many module members
        WPS202,
    python/snowfall/project/junction/provider/offers.py:
        # Found module with too many imports
        WPS201,
    python/snowfall/project/junction/go/service/client_api/includes.py:
        # Found too many module members
        WPS202,
    python/snowfall/project/junction/go/service/client_api/resources.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/go/service/client_api/router.py:
        # Found module with too many imports
        WPS201,
    python/snowfall/project/junction/go/service/client_api/routes/offers.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/go/service/client_api/routes/orders.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/extensions/service/mobile_api/repository.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/extensions/service/mobile_api/resources.py:
        # Found too many module members.
        WPS202,
    python/snowfall/project/junction/service/providers/benerail/stations.py:
        # Found module cognitive complexity that is too high.
        WPS232,
    python/snowfall/project/junction/service/providers/benerail/booking.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/project/junction/service/providers/ask2go/booking.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/project/junction/service/providers/save_a_train/adapter.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/project/junction/service/providers/benerail/adapter.py:
        # Found module with too many imports
        WPS201,
    python/snowfall/vendor/save_a_train/client.py:
        # Found module with too many imports.
        WPS201,
    python/snowfall/stdlib/format/hcl2.py:
        # Found too many module members.
        WPS202,
    python/snowfall/stdlib/persistence/mongo/normalizers.py:
        # Found too many module members.
        WPS202,
    python/snowfall/stdlib/service.py:
        # Found too many module members.
        WPS202,
    python/snowfall/vendor/ask2go/models/offers.py:
        # Found too many module members.
        WPS202,
    python/snowfall/vendor/distribusion/models/*.py:
        # Found too many module members
        WPS202,
    python/snowfall/vendor/carnect/models/*.py:
        # All dataclasses should be frozen
        SF10,
        # Found wrong variable name
        WPS110,
        # Found underscored number name pattern
        WPS114,
        # Found upper-case constant in a class
        WPS115,
        # Found too long name
        WPS118,
        # Found too many module members
        WPS202,
        # Found wrong keyword: pass
        WPS420,
        # Found nested class
        WPS431,
        # Found incorrect node inside `class` body
        WPS604,
    python/snowfall/vendor/distribusion/jsonapi_helpers.py:
        # Found wrong variable name
        WPS110,
    python/snowfall/project/pss/service/pss_api_v2/*:
        # Found complex default values. Disabled due to how FastAPI does Dependency Injection
        WPS404,
    python/snowfall/project/pss/service/pss_api_v2/conftest.py:
        # Found nested class. Disabled because of Model Factories using them.
        WPS431
        # Found outer scope names shadowing. Conflicts with pytest fixtures.
        WPS442,
    python/snowfall/project/pss/service/pss_api_v2/*/*_test.py:
        # Found too long name. Disabled because test names need to be descriptive
        WPS118,
        # Found too many module members. Disabled because of multiple test functions
        WPS202,
        # Found overused expression. Disabled as even extracting out will result in other overused expressions (Mocking)
        WPS204,
        # Found too many local variables. Disabled because tests require mocked objects for setup
        WPS210,
        # Found too deep access level. Disabled because of database query mocking requires this without extra verbosity
        WPS219,
    python/snowfall/project/pay/service/pay_api/resources.py:
        # Found too many module members.
        WPS202,
ignore =
    # noqa has no violations. Disabled due to Ruff incompatibility.
    NQA101,
    # noqa: X000 has no matching violations. Disabled due to Ruff incompatibility.
    NQA102,
    # noqa: X000, X001 has unmatched code(s), remove X001. Disabled due to Ruff incompatibility.
    NQA103,
    # Unknown directive type. Disabled due to WPS incompatibility.
    RST303,
    # Unknown interpreted text role. Disabled due to WPS incompatibility.
    RST304,
    # Found same alias import. Same as I250.
    WPS113,
    # Found string constant over-use. Doesn't really improve the code with current workarounds.
    WPS226,
    # Same as T20.
    WPS242,
    # Found context manager with too many assignments. Conflicts with SIM117.
    WPS316,
    # Found incorrect multi-line parameters. Disabled due to Black incompatibility.
    WPS317,
    # Found `%` string formatting
    WPS323,
    # Found implicit string concatenation
    WPS326,
    # Forbid protected attributes and methods. Same as SLF001.
    WPS437,
    # Found incorrect `not` with compare usage. Same as SIM203.
    WPS508,

[flake8:local-plugins]
    extension =
        SF1 = snowfall.plugin.flake8.immutability:Plugin
        # SF3 = snowfall.plugin.flake8.imports:Plugin
        SF2 = snowfall.plugin.flake8.typing:Plugin
