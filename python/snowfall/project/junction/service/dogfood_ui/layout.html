<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <title>Dogfood UI</title>
    <style>
        h1 { margin-top: 1em; }
        .map { height: 480px; }
        .row { margin-bottom: 1.2em; }
        .overlay {
            position:absolute;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background-color:rgba(0, 0, 0, 0.85);
            background: url(data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAAABl0RVh0U29mdHdhcmUAUGFpbnQuTkVUIHYzLjUuNUmK/OAAAAATSURBVBhXY2RgYNgHxGAAYuwDAA78AjwwRoQYAAAAAElFTkSuQmCC) repeat scroll transparent\9; /* ie fallback png background image */
            z-index:9999;
            color:white;
        }
        #loader > div {
            display: inline-block;
            position: relative;
            top: 35%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .lds-heart {
            left: 50%;
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
            transform: translate(-50%) rotate(45deg);
            transform-origin: 40px 40px;
        }
        .lds-heart div {
            top: 32px;
            left: 32px;
            position: absolute;
            width: 32px;
            height: 32px;
            background: #fcf;
            animation: lds-heart 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        .lds-heart div:after,
        .lds-heart div:before {
            content: " ";
            position: absolute;
            display: block;
            width: 32px;
            height: 32px;
            background: #fcf;
        }
        .lds-heart div:before {
            left: -24px;
            border-radius: 50% 0 0 50%;
        }
        .lds-heart div:after {
            top: -24px;
            border-radius: 50% 50% 0 0;
        }
        @keyframes lds-heart {
            0% {
                transform: scale(0.95);
            }
            5% {
                transform: scale(1.1);
            }
            39% {
                transform: scale(0.85);
            }
            45% {
                transform: scale(1);
            }
            60% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(0.9);
            }
        }

    </style>
</head>
<body>
<main class="container-fluid">
    <h1 class="text-center">Dogfood UI</h1>
    <div class="row">
        <div class="col">
            <datalist id="places"></datalist>
            <form id="search-form">
                <fieldset>
                    <legend>Trip Search</legend>
                    <div class="mb-3 form-floating">
                        <input class="form-control" list="places" id="origin" placeholder="Type to search...">
                        <label for="origin" class="form-label">Origin</label>
                    </div>
                    <div class="mb-3 form-floating">
                        <input class="form-control" list="places" id="destination" placeholder="Type to search...">
                        <label for="destination" class="form-label">Destination</label>
                    </div>
                    <div class="mb-3 form-floating">
                        <input class="form-control" id="departure-at" type="datetime-local">
                        <label for="departure-at">Departure At (origin time)</label>
                    </div>
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary mb-3">Search</button>
                    </div>
                </fieldset>
            </form>
        </div>
        <div id="result" class="col"></div>
    </div>
</main>
<div id="loader"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.2/js/bootstrap.bundle.min.js" integrity="sha512-BOsvKbLb0dB1IVplOL9ptU1EYA+LuCKEluZWRUYG73hxqNBU85JBIBhPGwhQl7O633KtkjMv8lvxZcWP+N3V3w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" integrity="sha512-RXf+QSDCUQs5uwRKaDoXt55jygZZm2V++WUZduaU/Ui/9EGp3f/2KZVahFZBKGH0s774sd3HmrhUy+SgOFQLVQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.6/dayjs.min.js" integrity="sha512-hcV6DX35BKgiTiWYrJgPbu3FxS6CsCjKgmrsPRpUPkXWbvPiKxvSVSdhWX0yXcPctOI2FJ4WP6N1zH+17B/sAA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.6/plugin/utc.min.js" integrity="sha512-z84O912dDT9nKqvpBnl1tri5IN0j/OEgMzLN1GlkpKLMscs5ZHVu+G2CYtA6dkS0YnOGi3cODt3BOPnYc8Agjg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.6/plugin/timezone.min.js" integrity="sha512-fG1tT/Wn/ZOyH6/Djm8HQBuqvztPQdK/vBgNFLx6DQVt3yYYDPN3bXnGZT4z4kAnURzGQwAnM3CspmhLJAD/5Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  dayjs.extend(window.dayjs_plugin_utc);
  dayjs.extend(window.dayjs_plugin_timezone);

  let db;
  const icons = {
      "road": "car", // Unspecified
      "air": "plane", // Air
      "rail": "train", // Rail
      "foot": "walking", // Walk
  }


  function clear_places() {
    const transaction = db.transaction('places', 'readwrite');
    const objectStore = transaction.objectStore('places');
    const clearRequest = objectStore.clear();

    clearRequest.onerror = (event) => {
      console.log(event);
    };
  }

  function count_places() {
    const transaction = db.transaction('places', 'readonly');
    const objectStore = transaction.objectStore('places');
    const countRequest = objectStore.count();

    countRequest.onerror = (event) => {
      console.log(event);
    };

    countRequest.onsuccess = (event) => {
      if (countRequest.result != 0) {
        console.log("Places already indexed, skipping.");
        inject_places();
      } else {
        console.log("No places in DB, indexing...");
        load_places();
      }
    };
  }

  function inject_places() {
    const placesList = document.getElementById('places');
    const transaction = db.transaction("places", "readonly");
    const objectStore = transaction.objectStore("places");
    const openCursorRequest = objectStore.openCursor();

    openCursorRequest.onerror = (event) => {
      console.log(event);
    };

    openCursorRequest.onsuccess = (event) => {
      const cursor = event.target.result;

      if (!cursor) {
        hide_loader();
        return;
      }

      const option = document.createElement("option");
      option.value = cursor.value.id;
      option.innerText = cursor.value.attributes.name + ", " + cursor.value.attributes.countryCode;

      placesList.append(option);
      cursor.continue();
    };
  }

  function show_loader(status_message = "") {
    const container = document.getElementById('loader');
    container.classList.add("overlay");
    container.innerHTML = '<div><div class="lds-heart"><div></div></div><br>' + status_message + '</div>';
  }

  function hide_loader() {
    const container = document.getElementById('loader');
    container.classList.remove("overlay");
    container.innerHTML = '';
  }

  function flatten(resource, included) {
    if (!resource.hasOwnProperty("relationships")) {
      return resource;
    }

    for (const key of Object.keys(resource.relationships)) {
      if (resource.relationships[key].data instanceof Array) {
        for (const [i, value] of resource.relationships[key].data.entries()) {
          resource.relationships[key].data[i] = flatten(included[value.type+value.id], included);
        }
      } else {
        resource.relationships[key].data = flatten(
          included[resource.relationships[key].data.type+resource.relationships[key].data.id],
          included
        );
      }
    }

    return resource;
  }

  function sort_legs(a, b) {
    a_date = new Date(a.attributes.departureAt);
    b_date = new Date(b.attributes.departureAt);
    a2_date = new Date(a.attributes.arrivalAt);
    b2_date = new Date(b.attributes.arrivalAt);

    if (a_date < b_date) {
      return -1;
    }

    if (a_date > b_date) {
      return 1;
    }

    if (a2_date < b2_date) {
      return -1;
    }

    if (a2_date > b2_date) {
      return 1;
    }

    return 0;
  }

  function sort_segments(a, b) {
    order = 0
    leg_idx = 0

    while(order == 0 && leg_idx < a.relationships.legs.data.length && leg_idx < b.relationships.legs.data.length) {
      order = sort_legs(a.relationships.legs.data[leg_idx], b.relationships.legs.data[leg_idx])
      leg_idx++
    }

    return order
  }

  function sort_trips(a, b) {
    order = 0
    segment_idx = 0

    while(order == 0 && segment_idx < a.relationships.segments.data.length && segment_idx < b.relationships.segments.data.length) {
      order = sort_segments(a.relationships.segments.data[segment_idx], b.relationships.segments.data[segment_idx])
      segment_idx++
    }

    return order
  }

  function nice_format_seconds(secs) {
      let hours = Math.floor(secs / 3600)
      let minutes = Math.floor((secs % 3600) / 60)
      let nice = ""

      if (hours > 0) {
          nice += hours + " hours "
      }

      if (minutes > 0) {
          if (hours > 0) {
              nice += "and "
          }

          nice += minutes + " minutes"
      }

      return nice.trim()
  }

  function getMsSinceMidnight(d) {
    var e = new Date(d);
    return d - e.setHours(0,0,0,0);
  }

  function haversine_distance(coords1, coords2) {
    function toRad(x) {
      return x * Math.PI / 180;
    }

    var lon1 = coords1[0];
    var lat1 = coords1[1];

    var lon2 = coords2[0];
    var lat2 = coords2[1];

    var R = 6371 * 1000;

    var x1 = lat2 - lat1;
    var dLat = toRad(x1);
    var x2 = lon2 - lon1;
    var dLon = toRad(x2)
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    var d = R * c;

    return d;
  }

  function inject_trips(response) {
    hide_loader();

    const container = document.getElementById('result');

    if (response.data.length == 0) {
        container.innerText = 'No possible trips found.'
        return
    }

    container.innerText = "";

    let mega = document.createElement("h2")
    mega.innerText = "Search Results: " + response.data.length + " trips found"
    container.append(mega)
    included = {}

    for (const resource of response.included) {
      included[resource.type+resource.id] = resource
    }

    let stats = {
      earliest: {trip_idx: [], time: Number.MAX_SAFE_INTEGER},
      fastest: {trip_idx: [], time: Number.MAX_SAFE_INTEGER},
      shortest: {trip_idx: [], time: Number.MAX_SAFE_INTEGER},
      environment: {trip_idx: [], time: Number.MAX_SAFE_INTEGER},
    }

    trips = []

    for (const [i, resource] of response.data.entries()) {
      trip = flatten(resource, included)

      for (const [j, segment] of trip.relationships.segments.data.entries()) {
        segment.relationships.legs.data.sort(sort_legs);
        trip.relationships.segments.data[j] = segment
      }

      trip.relationships.segments.data.sort(sort_segments);
      trips.push(trip)
    }

    trips.sort(sort_trips);

    for (let i = 0; i < trips.length; i++) {
      const trip = trips[i];
      firstSegment = trip.relationships.segments.data[0]
      lastSegment = trip.relationships.segments.data[trip.relationships.segments.data.length-1];
      departsAt = new Date(firstSegment.relationships.legs.data[0].attributes.departureAt);
      arrivesAt = new Date(lastSegment.relationships.legs.data[lastSegment.relationships.legs.data.length-1].attributes.arrivalAt);

      let total = Math.floor(arrivesAt.getTime() / 1000) - Math.floor(departsAt.getTime() / 1000);
      let totalDistance = 0
      let totalEmission = 0

      for (const segment of trip.relationships.segments.data) {
        for (const leg of segment.relationships.legs.data) {
          totalDistance += haversine_distance(
            [leg.attributes.origin.longitude, leg.attributes.origin.latitude],
            [leg.attributes.destination.longitude, leg.attributes.destination.latitude],
          );
        }
      }

      if (stats.earliest.time > arrivesAt.getTime()) {
        stats.earliest.trip_idx = [i]
        stats.earliest.time = arrivesAt.getTime()
      } else if (stats.earliest.time == arrivesAt.getTime()) {
        stats.earliest.trip_idx.push(i)
      }

      if (stats.fastest.time > total) {
        stats.fastest.trip_idx = [i]
        stats.fastest.time = total
      } else if (stats.fastest.time == total) {
        stats.fastest.trip_idx.push(i)
      }

      if (stats.shortest.time > totalDistance) {
        stats.shortest.trip_idx = [i]
        stats.shortest.time = totalDistance
      } else if (stats.shortest.time == totalDistance) {
        stats.shortest.trip_idx.push(i)
      }

      if (stats.environment.time > totalEmission) {
        stats.environment.trip_idx = [i]
        stats.environment.time = totalEmission
      } else if (stats.environment.time == totalEmission) {
        stats.environment.trip_idx.push(i)
      }

      trip.totalTime = total
      trip.totalDistance = totalDistance
      trip.totalEmission = totalEmission
      trip.direct = trip.relationships.segments.data.length == 1
      trip.earliest = false
      trip.fastest = false
      trip.shortest = false
      trip.environment = false
      response.data[i] = trip
    }

    for (const idx of stats.earliest.trip_idx) {
      response.data[idx].earliest = true
    }

    for (const idx of stats.fastest.trip_idx) {
      response.data[idx].fastest = true
    }

    for (const idx of stats.shortest.trip_idx) {
      response.data[idx].shortest = true
    }

    for (const idx of stats.environment.trip_idx) {
      response.data[idx].environment = true
    }

    for (const [i, trip] of response.data.entries()) {
      let header = document.createElement('h3');
      header.textContent = "Journey #" + (i+1)

      let subtext = document.createElement('small')

      subtext.className = "text-muted"
      subtext.textContent = " - " + (trip.relationships.segments.data.length - 1)
      subtext.textContent += " connection(s), " + nice_format_seconds(trip.totalTime)
      subtext.textContent += ", " + (Math.round((trip.totalDistance / 1000) * 10) / 10)
      subtext.textContent += "km, " + (Math.round((trip.totalEmission / 1000) * 10) / 10) + "kg CO2"

      header.append(subtext)

      const tripIdText = document.createElement('p');
      tripIdText.innerHTML = "<strong>Trip ID:</strong> " + trip.id;

      let badges = document.createElement("p")

      if (trip.direct) {
          let badge = document.createElement("span")
          badge.className = "badge bg-primary"
          badge.innerText = "Direct"
          badges.append(badge)

          badge = document.createElement("span")
          badge.innerText = " "
          badges.append(badge)
      }

      if (trip.earliest) {
          let badge = document.createElement("span")
          badge.className = "badge bg-warning"
          badge.innerText = "Earliest Arrival"
          badges.append(badge)

          badge = document.createElement("span")
          badge.innerText = " "
          badges.append(badge)
      }

      if (trip.fastest) {
          let badge = document.createElement("span")
          badge.className = "badge bg-info"
          badge.innerText = "Fastest Journey"
          badges.append(badge)

          badge = document.createElement("span")
          badge.innerText = " "
          badges.append(badge)
      }

      if (trip.shortest) {
          let badge = document.createElement("span")
          badge.className = "badge bg-secondary"
          badge.innerText = "Shortest Distance"
          badges.append(badge)

          badge = document.createElement("span")
          badge.innerText = " "
          badges.append(badge)
      }

      if (trip.environment) {
          let badge = document.createElement("span")
          badge.className = "badge bg-success"
          badge.innerText = "Smallest CO2 Footprint"
          badges.append(badge)

          badge = document.createElement("span")
          badge.innerText = " "
          badges.append(badge)
      }

      container.append(header)
      container.append(tripIdText)
      container.append(badges)

      let map = document.createElement('div');
      map.id = 'map' + i
      map.className = 'map col-sm'

      container.append(map)

      var mapItem = L.map('map' + i);

      L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}', {
          attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Imagery © <a href="https://www.mapbox.com/">Mapbox</a>',
          maxZoom: 18,
          id: 'mapbox/streets-v11',
          tileSize: 512,
          zoomOffset: -1,
          accessToken: 'pk.eyJ1IjoianlnZ2VuIiwiYSI6ImNrdDZmaGVsbDBodDMyd283dG9ucjdmejQifQ.4JXvYcrRq1FmBj3LqW5zDg'
      }).addTo(mapItem);


      let description = document.createElement('table');
      description.id = 'description' + i
      description.className = 'table table-sm table-striped'

      let head = document.createElement('thead')
      let row = document.createElement('tr');
      let cell = document.createElement('th')
      cell.textContent = '#'
      row.append(cell);

      cell = document.createElement('th')
      cell.textContent = 'Trip'
      row.append(cell);

      cell = document.createElement('th')
      cell.textContent = 'From'
      row.append(cell);

      cell = document.createElement('th')
      cell.textContent = 'To'
      row.append(cell);

      cell = document.createElement('th')
      cell.textContent = 'Departure'
      row.append(cell);

      cell = document.createElement('th')
      cell.textContent = 'Arrival'
      row.append(cell);

      head.append(row)
      description.append(head)

      let body = document.createElement('tbody')
      let latlngs = Array();
      var greenIcon = new L.Icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
      });
      var redIcon = new L.Icon({
          iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
          shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
          iconSize: [25, 41],
          iconAnchor: [12, 41],
          popupAnchor: [1, -34],
          shadowSize: [41, 41]
      });

      let marker = L.marker([trip.relationships.segments.data[0].relationships.legs.data[0].attributes.origin.latitude, trip.relationships.segments.data[0].relationships.legs.data[0].attributes.origin.longitude], {icon: greenIcon})
      marker.addTo(mapItem);
      latlngs.push(marker.getLatLng());

      trip.relationships.segments.data.forEach(function (segment, k) {
          let item = document.createElement('tr')

          if (k == 0) {
              item.className = 'table-success'
          } else if (k == trip.relationships.segments.data.length-1) {
              item.className = 'table-danger'
          }

          let cell = document.createElement('td')
          cell.textContent = k+1
          item.append(cell);

          let icon = document.createElement('i')
          icon.className = "fas fa-" + icons[segment.relationships.legs.data[0].relationships.legType.data.id]
          let text = document.createElement('span')
          text.textContent = " " + segment.attributes.name

          cell = document.createElement('td')
          cell.append(icon);
          cell.append(text);
          item.append(cell);

          cell = document.createElement('td')
          cell.textContent = segment.relationships.legs.data[0].attributes.origin.name
          item.append(cell);

          cell = document.createElement('td')
          cell.textContent = segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.name
          item.append(cell);

          cell = document.createElement('td')
          cell.textContent = (new Date(segment.relationships.legs.data[0].attributes.departureAt)).toLocaleTimeString('en-GB', { timeZone: segment.relationships.legs.data[0].attributes.origin.timeZone })
          item.append(cell);

          cell = document.createElement('td')
          cell.textContent = (new Date(segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.arrivalAt)).toLocaleTimeString('en-GB', { timeZone: segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.timeZone })
          item.append(cell);

          body.append(item)

          let marker

          if (k == trip.relationships.segments.data.length-1) {
              marker = L.marker([segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.latitude, segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.longitude], {icon: redIcon})
          } else {
              marker = L.marker([segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.latitude, segment.relationships.legs.data[segment.relationships.legs.data.length-1].attributes.destination.longitude])
          }

          marker.addTo(mapItem);

          segment.relationships.legs.data.forEach(function (leg, k) {
            if (k != segment.relationships.legs.data.length-1) {
              latlngs.push([
                leg.attributes.destination.latitude,
                leg.attributes.destination.longitude,
              ]);
            }
          });

          latlngs.push(marker.getLatLng());
      })

      let polyline = L.polyline(latlngs, {color: 'blue'}).addTo(mapItem);
      description.append(body)
      container.append(description)

      mapItem.fitBounds(polyline.getBounds());
    }
  }

  function load_places(url = null) {
    if (url == null) {
      url = "/places?page[limit]=100"
    }

    fetch(url)
    .then(res => res.json())
    .then(response => {
      for (const place of response.data) {
        const transaction = db.transaction('places', 'readwrite');
        const objectStore = transaction.objectStore('places');
        const addRequest = objectStore.add(place);
      }

      if (response.data.length > 0) {
        load_places(response.links.next);
      } else {
        inject_places();
      }
    });
  }

  function load_trips(id, polled_since) {
    fetch("/trips/searches/" + id)
    .then(res => res.json())
    .then(response => {
      if (response.data.attributes.status == "completed" || response.data.attributes.status == "failed") {
        fetch("/trips/searches/" + id + "/trips?page[limit]=100&include=segments,segments.legs,segments.legs.legType")
        .then(res => res.json())
        .then(response => {
          inject_trips(response);
        })
      } else {
        setTimeout(() => {
          load_trips(id);
        }, "2000");
      }
    });
  }

  window.onload = () => {
    show_loader("Loading places, this might take a minute or two the first time...");
    const DBOpenRequest = window.indexedDB.open('places');

    DBOpenRequest.onupgradeneeded = (event) => {
      db = event.target.result;
      const objectStore = db.createObjectStore('places', { keyPath: 'id' });

      console.log("Object store created.");
    };

    DBOpenRequest.onerror = (event) => {
      console.log(event);
    };

    DBOpenRequest.onsuccess = (event) => {
      db = DBOpenRequest.result;

      console.log("Database opened.");
      count_places();
    };

    const searchForm = document.getElementById('search-form');

    function search_trips(event) {
        event.preventDefault();
        show_loader("Searching for trips, please wait...");

        const origin = document.getElementById('origin').value;
        const destination = document.getElementById('destination').value;
        const departureAt = document.getElementById('departure-at').value;
        const transaction = db.transaction('places', 'readwrite');
        const objectStore = transaction.objectStore('places');
        const originRequest = objectStore.get(origin);

        originRequest.onsuccess = (event) => {
          const originTimeZone = originRequest.result.attributes.timeZone;
          fetch('/trips/searches', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/vnd.api+json',
            },
            body: JSON.stringify({
              data: {
                type: 'trip-searches',
                attributes: {
                  departureAfter: dayjs.tz(departureAt, originTimeZone).format(),
                },
                relationships: {
                  origin: {
                    data: {
                      id: origin,
                      type: 'places'
                    }
                  },
                  destination: {
                    data: {
                      id: destination,
                      type: 'places'
                    }
                  }
                }
              }
            }),
          })
          .then((response) => response.json())
          .then((data) => {
            load_trips(data.data.id, new Date());
          });
        };
    };

    searchForm.addEventListener('submit', search_trips);
  };
</script>
</body>
</html>
