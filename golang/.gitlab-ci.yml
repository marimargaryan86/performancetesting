.go:files: &files
  - "golang/**/*"


go:fmt:
  stage: test
  interruptible: true
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.18"
  script:
    - test -z $(gofmt -l golang/)
  needs: [ ]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *files
  tags:
    - docker


go:lint:
  stage: test
  interruptible: true
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golangci/golangci-lint:v1.45.2"
  before_script:
    - cd golang/
  script:
    - golangci-lint run --new-from-rev="${CI_MERGE_REQUEST_DIFF_BASE_SHA}" --timeout 5m
  needs: [ ]
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *files
  tags:
    - docker

go:test:
  stage: test
  interruptible: true
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.18"
  before_script:
    - go install github.com/boumenot/gocover-cobertura@latest
    - cd golang/
  script:
    - go test -bench . -coverprofile coverage.txt -covermode count ./...
    - gocover-cobertura <coverage.txt >coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: golang/coverage.xml
  needs: [ ]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *files
  tags:
    - docker
