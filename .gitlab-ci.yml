stages:
  - setup
  - test
  - package
  - deploy

variables:
  ARTIFACT_COMPRESSION_LEVEL: fastest
  CACHE_COMPRESSION_LEVEL: fastest
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch

include:
  - local: .gitlab/markdown.gitlab-ci.yml
  - local: .gitlab/nomad.gitlab-ci.yml
  - local: .gitlab/pants.gitlab-ci.yml
  - local: golang/.gitlab-ci.yml
  - local: openapi/.gitlab-ci.yml
  - local: protobuf/.gitlab-ci.yml

make-uninterruptible:
  stage: setup
  interruptible: false
  script:
    - echo "This job prevents main pipelines from interrupting each other."
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - shell

allow-breaking-changes:
  stage: setup
  interruptible: true
  before_script:
    - set -euo pipefail
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker pull "${CI_REGISTRY_IMAGE}/service/snowman:latest"
  script:
    - IS_BREAKING=$(docker run --rm "${CI_REGISTRY_IMAGE}/service/snowman:latest" parse "${CI_MERGE_REQUEST_TITLE}" 2>&1 | grep Breaking | cut -d ' ' -f2)
    - if [ "${IS_BREAKING}" == "true" ]; then echo "BREAKING=1" > variables.env; else echo "BREAKING=0" > variables.env; fi
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  artifacts:
    reports:
      dotenv: variables.env
  tags:
    - shell

editorconfig:validate:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  script:
    - editorconfig-checker -disable-max-line-length -exclude "^vendor/lock/|^pants$|yarn.lock$"
  needs:
    - "pants:setup"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  tags:
    - docker
