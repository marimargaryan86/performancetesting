stages:
  - setup
  - test
  - package
  - deploy
  - schedule

variables:
  ARTIFACT_COMPRESSION_LEVEL: fastest
  CACHE_COMPRESSION_LEVEL: fastest
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch
  E2E:
    value: 'false'
    description: "Run the schedules pipeline e2e test? then set to 'true'"
include:
  - local: .gitlab/junction/api_automation.gitlab-ci.yml
  - local: .gitlab/pants.gitlab-ci.yml
  - local: .gitlab/junction/planner.gitlab-ci.yml
  - local: openapi/.gitlab-ci.yml
  - local: protobuf/.gitlab-ci.yml
  - local: svelte/.gitlab-ci.yml


make-uninterruptible:
  stage: setup
  interruptible: false
  script:
    - echo "This job prevents main pipelines from interrupting each other."
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - shell

allow-breaking-changes:
  stage: setup
  interruptible: true
  before_script:
    - set -euo pipefail
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker pull "${CI_REGISTRY_IMAGE}/service/snowman:latest"
  script:
    - IS_BREAKING=$(docker run --rm "${CI_REGISTRY_IMAGE}/service/snowman:latest" parse "${CI_MERGE_REQUEST_TITLE}" 2>&1 | grep Breaking | cut -d ' ' -f2)
    - if [ "${IS_BREAKING}" == "true" ]; then echo "BREAKING=1" > variables.env; else echo "BREAKING=0" > variables.env; fi
  needs: []
  retry: 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  artifacts:
    reports:
      dotenv: variables.env
  tags:
    - shell

editorconfig:validate:
  stage: test
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  interruptible: true
  script:
    - editorconfig-checker -disable-max-line-length -exclude "constraints.txt$|yarn.lock$"
  needs:
    - "pants:setup"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  tags:
    - docker

misc:validate:
  extends: .pants
  stage: test
  script:
    - ./bash/custom-linters.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  variables:
    NOMAD_VAR_datacenter: "foobar"
    NOMAD_VAR_docker_image: "${CI_REGISTRY_IMAGE}"
    NOMAD_VAR_environment: "foobar"
    NOMAD_VAR_registry_address: "${CI_REGISTRY}"
    NOMAD_VAR_registry_password: "${CI_REGISTRY_PASSWORD}"
    NOMAD_VAR_registry_username: "${CI_REGISTRY_USER}"

schedule:post-git-changelog:
  stage: schedule
  image: "${CI_REGISTRY_IMAGE}/pants:${CI_COMMIT_REF_SLUG}"
  script:
    - ./bash/post-git-changelog.sh
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "post-git-changelog"'
