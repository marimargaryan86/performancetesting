syntax = "proto3";

package snowfall.common.v1alpha;

message Cursor {
  string id = 1;
  string clause = 2;
  string digest = 3;
}

message Place {
  reserved 2;
  reserved "h3_index";

  string id = 1;
  string name = 3;
  float latitude = 4;
  float longitude = 5;
  string country_code = 6;
  string time_zone = 7;
}
