syntax = "proto3";

package snowfall.junction.offers.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/common/v1alpha/models.proto";
import "snowfall/junction/providers/v1alpha/offers.proto";

service OfferSearchService {
  rpc EnqueueOfferSearch(EnqueueOfferSearchRequest) returns (EnqueueOfferSearchResponse) {}
  rpc GetOfferSearch(GetOfferSearchRequest) returns (GetOfferSearchResponse) {}
}

service OfferService {
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse) {}
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {}
}

message GetOfferRequest {
  string id = 1;
}

message GetOfferResponse {
  Offer offer = 1;
}

message EnqueueOfferSearchRequest {
  OfferSearch search = 1;
}

message EnqueueOfferSearchResponse {
  OfferSearch search = 1;
}

message GetOfferSearchRequest {
  string id = 1;
}

message GetOfferSearchResponse {
  OfferSearch search = 1;
}

message ListOffersRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string offer_search_id = 3;
    ListOfOfferIds offer_ids = 4;
  }
}

message ListOfOfferIds {
  repeated string ids = 3;
}

message ListOffersResponse {
  string next_page_token = 1;
  repeated Offer offers = 2;
}

message Offer {
  string id = 1;
  repeated snowfall.junction.providers.v1alpha.GroupedOffer results = 2;
}

message OfferAggregate {
  string id = 1;
  string offer_search_id = 2;
  repeated string offer_result_ids = 3;
}

message OfferSearch {
  string id = 1;
  google.protobuf.Timestamp expires_at = 2;
  oneof search {
    TripOfferSearch trip = 3;
  }
}

message TripOfferSearch {
  repeated snowfall.common.v1alpha.Segment segments = 1;
  repeated Passenger passengers = 2;
  LoyaltyCard loyalty_card = 3;
}

message Passenger {
  snowfall.common.v1alpha.Date date_of_birth = 1;
}

message LoyaltyCard {
  string airline_iata = 1;
  string number = 2;
  string first_name = 3;
  string last_name = 4;
}

message TripOfferSearchTask {
  string offer_search_id = 1;
  TripOfferSearch search = 2;
}
