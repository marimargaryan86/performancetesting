syntax = "proto3";

package snowfall.junction.offers.v1alpha;

import "snowfall/junction/offers/v1alpha/models.proto";

service OfferSearchService {
  rpc EnqueueOfferSearch(EnqueueOfferSearchRequest) returns (EnqueueOfferSearchResponse) {}
  rpc GetOfferSearch(GetOfferSearchRequest) returns (GetOfferSearchResponse) {}
}

service OfferService {
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse) {}
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {}
}

message GetOfferRequest {
  string id = 1;
}

message GetOfferResponse {
  OfferAggregate offer = 1;
}

message EnqueueOfferSearchRequest {
  OfferSearch search = 1;
}

message EnqueueOfferSearchResponse {
  OfferSearch search = 1;
}

message GetOfferSearchRequest {
  string id = 1;
}

message GetOfferSearchResponse {
  OfferSearch search = 1;
}

message ListOffersRequest {
  optional int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string offer_search_id = 3;
    ListOfOfferIds offer_ids = 4;
  }
}

message ListOfOfferIds {
  repeated string ids = 3;
}

message ListOffersResponse {
  string next_page_token = 1;
  repeated OfferAggregate offers = 2;
}
