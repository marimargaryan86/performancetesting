syntax = "proto3";

package snowfall.junction.orders.v1alpha;

import "snowfall/junction/offers/v1alpha/offers.proto";

service OrderService {
  rpc EnqueueOrder (EnqueueOrderRequest) returns (EnqueueOrderResponse) {}
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse) {}
}

message Order {
  string id = 1;
  repeated snowfall.junction.offers.v1alpha.Offer offers = 2;
}

message EnqueueOrderRequest {
  repeated snowfall.junction.offers.v1alpha.Offer offers = 1;
}

message EnqueueOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message OrderTask {
  string order_id = 1;
  repeated snowfall.junction.offers.v1alpha.Offer offers = 2;
}
