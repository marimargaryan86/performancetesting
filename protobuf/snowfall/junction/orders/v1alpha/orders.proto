syntax = "proto3";

package snowfall.junction.orders.v1alpha;

import "snowfall/junction/offers/v1alpha/models.proto";
import "snowfall/junction/orders/v1alpha/models.proto";

service OrderService {
  rpc AddOffersToOrder(AddOffersToOrderRequest) returns (AddOffersToOrderResponse) {}
  rpc EnqueueOrder(EnqueueOrderRequest) returns (EnqueueOrderResponse) {}
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {}
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {}
}

message AddOffersToOrderRequest {
  string order_id = 1;
  repeated snowfall.junction.offers.v1alpha.Offer offers = 2;
}

message AddOffersToOrderResponse {
  Order order = 1;
}

message EnqueueOrderRequest {
  repeated snowfall.junction.offers.v1alpha.Offer offers = 1;
}

message EnqueueOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  optional int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}
