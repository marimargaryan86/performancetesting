syntax = "proto3";

package snowfall.junction.orders.v1alpha;

import "snowfall/common/v1alpha/models.proto";
import "snowfall/common/v1alpha/phone_number.proto";
import "snowfall/common/v1alpha/postal_address.proto";

message Order {
  string id = 1;
  repeated OrderResult order_results = 2;
  string passenger_name_record = 3;
  repeated Passenger passengers = 4;
  ContactDetails contact_details = 5;
}

message OrderResult {
  string order_id = 1;
  string offer_id = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_CONFIRMED = 2;
    STATUS_REJECTED = 3;
    STATUS_NOT_TICKETED = 4;
    STATUS_ERROR = 5;
  }
  Status status = 3;
  string raw_data = 4; // json
}

message ContactDetails {
  snowfall.common.v1alpha.PostalAddress address = 1;
  snowfall.common.v1alpha.PhoneNumber phone = 2;
  string email = 3;
}

message Passenger {
  string first_name = 1;
  string last_name = 2;
  enum Title {
    TITLE_UNSPECIFIED = 0;
    TITLE_MR = 1;
    TITLE_MRS = 2;
    TITLE_MISS = 3;
    TITLE_MS = 4;
  }
  Title title = 3;
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
  }
  Gender gender = 4;
  snowfall.common.v1alpha.Date date_of_birth = 5;
}
