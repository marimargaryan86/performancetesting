syntax = "proto3";

package snowfall.junction.providers.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/common/v1alpha/models.proto";

message GroupedOffer {
  string id = 1;
  string offer_search_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  // provider info?
  // min/max prices?
  repeated Offer offers = 4;
  repeated Segment segments = 5;
}

message Offer {
  string id = 1;
  repeated OfferSegment segments = 2;
  snowfall.common.v1alpha.Price price = 3;
  // isRefundable
}

message OfferSegment {
  string id = 1;
  // baggageAllowance
  // cabin
  // meal
}

message Segment {
  string id = 1;
  repeated Leg legs = 2;
  // todo: this needs to be broken down, since operator and vendor will have different numbers
  Vehicle vehicle = 3;
  string operator = 4;
  string vendor = 5;
  string terminal = 6;
  // direction?
  // docsRequired?
}

message Vehicle {
  string number = 1;
  string equipment = 2;
}

message Leg {
  string id = 1;
  snowfall.common.v1alpha.Point origin = 2;
  snowfall.common.v1alpha.Point destination = 3;
  google.protobuf.Timestamp departure_at = 4;
  google.protobuf.Timestamp arrival_at = 5;
}
