syntax = "proto3";

package snowfall.junction.providers.save_a_train.v1alpha;

import "snowfall/common/v1alpha/datetime.proto";
import "snowfall/common/v1alpha/models.proto";

message SearchCriteriaTask {
  string offer_search_id = 1;
  repeated snowfall.common.v1alpha.Segment segments = 2;
  Criteria criteria = 3;
}

message Criteria {
  string origin_id = 1;
  string destination_id = 2;
  uint32 number_of_passengers = 3;
  snowfall.common.v1alpha.DateTime departure_date = 4;
  string cabin_class = 5;
}
