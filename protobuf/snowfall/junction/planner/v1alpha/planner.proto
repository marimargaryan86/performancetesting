syntax = "proto3";

package snowfall.junction.planner.v1alpha;

import "snowfall/common/v1alpha/datetime.proto";
import "snowfall/common/v1alpha/latlng.proto";
import "snowfall/common/v1alpha/models.proto";

service PlannerService {
  rpc SearchJourney(SearchJourneyRequest) returns (SearchJourneyResponse) {}
}

message SearchJourneyRequest {
  snowfall.common.v1alpha.LatLng origin = 1;
  snowfall.common.v1alpha.LatLng destination = 2;
  snowfall.common.v1alpha.DateTime departure_after = 3;
}

message SearchJourneyResponse {
  repeated snowfall.common.v1alpha.TripReference trips = 1;
}
