syntax = "proto3";

package snowfall.junction.passenger_name_records.v1alpha;

import "google/protobuf/timestamp.proto";

service PassengerNameRecordService {
  rpc CreatePassengerNameRecord(CreatePassengerNameRecordRequest) returns (CreatePassengerNameRecordResponse) {}
}

message PassengerNameRecord {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message CreatePassengerNameRecordRequest {}

message CreatePassengerNameRecordResponse {
  PassengerNameRecord passenger_name_record = 1;
}
