syntax = "proto3";

package snowfall.stdlib.v1alpha;

import "snowfall/stdlib/v1alpha/money.proto";

message GetSeatMapTask {
  string offer_option_id = 1;
}

message SeatMapResult {
  repeated SeatMapSegment segments = 1;
}

message SeatMapSegment {
  string segment_id = 1;
  repeated SeatMapCompartment compartments = 2;
}

message SeatMapCompartment {
  int32 deck_index = 1;
  int32 row_range_start = 2;
  int32 row_range_end = 3;
  repeated SeatMapRow rows = 4;
}

message SeatMapRow {
  int32 row_key = 1;
  repeated SeatMapSection sections = 2;
}

message SeatMapSection {
  repeated SeatMapElement elements = 1;
}

message SeatMapElement {
  string designator = 1;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SEAT = 1;
  }
  Type element_type = 2;
  optional snowfall.stdlib.v1alpha.Money price = 3;
  bool selectable = 4;
}
