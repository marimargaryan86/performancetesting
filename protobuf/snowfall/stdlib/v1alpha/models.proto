syntax = "proto3";

package snowfall.stdlib.v1alpha;

import "google/protobuf/timestamp.proto";

message Coordinates {
  double latitude = 1;
  double longitude = 2;
}

message Cursor {
  string id = 1;
  string filter = 2;
  string digest = 3;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message Point {
  string ref = 1;
  string name = 2;
  Coordinates coordinates = 3;
  string time_zone = 4;
}

message Stop {
  string id = 1;
  google.protobuf.Timestamp departure_at = 2;
  google.protobuf.Timestamp arrival_at = 3;
  Point point = 4;
  uint32 order = 5;
}

message Schedule {
  string id = 1;
  string name = 2;
  repeated Stop stops = 3;
  string agency_name = 4;
  google.protobuf.Timestamp updated_at = 5;
  string source_ref = 6;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_AIR = 1;
    TYPE_RAIL = 2;
    TYPE_FERRY = 3;
    TYPE_BUS = 4;
  }
  Type type = 7;
  repeated Leg legs = 8;
}

message Leg {
  string id = 1;
  Point origin = 2;
  Point destination = 3;
  google.protobuf.Timestamp departure_at = 4;
  google.protobuf.Timestamp arrival_at = 5;
  Schedule.Type type = 6;
  string agency_name = 7;
  bool boarding_allowed = 8;
  bool alighting_allowed = 9;
}

message Segment {
  string id = 1;
  repeated Leg legs = 2;
}

message SegmentReference {
  string id = 1;
  string schedule_id = 2;
  repeated string leg_ids = 3;
}

message Trip {
  string id = 1;
  repeated Segment segments = 2;
}

message TripReference {
  string id = 1;
  repeated SegmentReference segments = 2;
}

message CabinClass {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_ECONOMY = 1;
    TYPE_PREMIUM = 2;
    TYPE_BUSINESS = 3;
    TYPE_FIRST = 4;
  }
  Type type = 1;
  string marketing_name = 2;
}
