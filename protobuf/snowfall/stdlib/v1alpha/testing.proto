syntax = "proto3";

package snowfall.stdlib.v1alpha;

import "google/protobuf/timestamp.proto";

message Foobar {
  string id = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message NestedFoobar {
  repeated Foobar foobars = 1;
}

message PascalCaseEnum {
  enum PascalCase {
    PASCAL_CASE_UNSPECIFIED = 0;
  }
}
