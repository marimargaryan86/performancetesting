syntax = "proto3";

package snowfall.stdlib.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1alpha/options.proto";

message Foobar {
  string id = 1;
  google.protobuf.Timestamp updated_at = 2;
  string read_only = 3 [(snowfall.stdlib.v1alpha.read_only) = true];
  string write_only = 4 [(snowfall.stdlib.v1alpha.write_only) = true];
  Foobar nested_foobar = 5;
}

message RepeatedFoobar {
  repeated Foobar foobars = 1;
}

message PascalCaseEnum {
  enum PascalCase {
    PASCAL_CASE_UNSPECIFIED = 0;
  }
}
