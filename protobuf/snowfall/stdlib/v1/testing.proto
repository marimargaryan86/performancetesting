syntax = "proto3";

package snowfall.stdlib.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/options.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/stdlib/v1";

message Foobar {
  string id = 1;
  google.protobuf.Timestamp updated_at = 2;
  string read_only = 3 [(snowfall.stdlib.v1.read_only) = true];
  string write_only = 4 [(snowfall.stdlib.v1.write_only) = true];
  Foobar nested_foobar = 5;
  google.protobuf.Struct struct = 6;
  google.protobuf.Struct read_only_struct = 7 [(snowfall.stdlib.v1.read_only) = true];
}

message RepeatedFoobar {
  repeated Foobar foobars = 1;
}

message PascalCaseEnum {
  enum PascalCase {
    PASCAL_CASE_UNSPECIFIED = 0;
    PASCAL_CASE_MULTI_WORD = 1;
  }
}
