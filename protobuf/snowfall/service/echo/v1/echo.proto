syntax = "proto3";

package snowfall.service.echo.v1;

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/echo/v1";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse) {}
}

message EchoRequest {
  string echo = 1;
}

message EchoResponse {
  string echo = 1;
}
