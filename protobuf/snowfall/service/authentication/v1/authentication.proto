syntax = "proto3";

package snowfall.service.authentication.v1;

import "snowfall/service/authentication/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/authentication/v1";

service AuthenticationService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message AuthenticateRequest {
  oneof identifier {
    string id = 1;
    string email = 2;
  }
  string password = 3;
}

message AuthenticateResponse {
  string auth_token = 1;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
}

message CreateUserResponse {
  User user = 1;
}

message ChangePasswordRequest {
  oneof identifier {
    string id = 1;
    string email = 2;
  }
  string password = 3;
}

message ChangePasswordResponse {
  User user = 1;
}
