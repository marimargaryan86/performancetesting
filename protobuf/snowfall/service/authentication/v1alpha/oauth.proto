syntax = "proto3";

package snowfall.service.authentication.v1alpha;

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/authentication/v1alpha";

service OAuthService {
  rpc GetClient(GetClientRequest) returns (GetClientResponse);
  rpc GetJWKUrl(GetJWKUrlRequest) returns (GetJWKUrlResponse);
}

message GetClientRequest {
  string id = 1;
}

message GetClientResponse {
  Client client = 1;
}

message Client {
  string id = 1;
  string owner = 2;
}

message GetJWKUrlRequest {}

message GetJWKUrlResponse {
  string url = 1;
}
