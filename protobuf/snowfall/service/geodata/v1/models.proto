syntax = "proto3";

package snowfall.service.geodata.v1;

import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/geocoding/v1alpha";

message Location {
  string name = 1;
  string id = 2;
  string address_number = 3;
  string street = 4;
  string unit_number = 5;
  string unit_type = 6;
  string neighborhood = 7;
  string municipality = 8;
  string subregion = 9;
  string region = 10;
  string country = 11;
  bool interpolated = 12;
  snowfall.stdlib.v1.LatLng coordinates = 14;
  snowfall.stdlib.v1.TimeZone time_zone = 15;
  string postal_code = 16;
}
