syntax = "proto3";

package snowfall.service.geodata.v1;

import "snowfall/service/geodata/v1/models.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/geodata/v1";

service GeocodingService {
  rpc CountryCodeLookup(CountryCodeLookupRequest) returns (CountryCodeLookupResponse) {}
  rpc TimeZoneLookup(TimeZoneLookupRequest) returns (TimeZoneLookupResponse) {}
  rpc LocationLookup(LocationLookupRequest) returns (LocationLookupResponse) {}
}

message CountryCodeLookupRequest {
  snowfall.stdlib.v1.LatLng coordinates = 1;
}

message CountryCodeLookupResponse {
  string country_code = 1;
}

message TimeZoneLookupRequest {
  snowfall.stdlib.v1.LatLng coordinates = 1;
}

message TimeZoneLookupResponse {
  snowfall.stdlib.v1.TimeZone time_zone = 1;
}

message LocationLookupRequest {
  string text = 1;
  optional snowfall.stdlib.v1.LatLng bias_position = 2;
  repeated string countries = 3;
  uint32 limit = 4;
  string language = 5;
}

message LocationLookupResponse {
  repeated Location locations = 1;
}
