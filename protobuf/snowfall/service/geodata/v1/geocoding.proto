syntax = "proto3";

package snowfall.service.geodata.v1;

import "snowfall/stdlib/v1alpha/datetime.proto";
import "snowfall/stdlib/v1alpha/latlng.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/service/geocoding/v1alpha";

service GeocodingService {
  rpc CountryCodeLookup(CountryCodeLookupRequest) returns (CountryCodeLookupResponse) {}
  rpc TimeZoneLookup(TimeZoneLookupRequest) returns (TimeZoneLookupResponse) {}
}

message CountryCodeLookupRequest {
  snowfall.stdlib.v1alpha.LatLng coordinates = 1;
}

message CountryCodeLookupResponse {
  string country_code = 1;
}

message TimeZoneLookupRequest {
  snowfall.stdlib.v1alpha.LatLng coordinates = 1;
}

message TimeZoneLookupResponse {
  snowfall.stdlib.v1alpha.TimeZone time_zone = 1;
}
