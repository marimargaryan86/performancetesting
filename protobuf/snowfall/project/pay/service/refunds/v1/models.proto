syntax = "proto3";

package snowfall.project.pay.service.refunds.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/refunds/v1";

// For credit card refunds in stripe we have the following options

message Refund {
  string id = 1;
  string transaction_id = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_SUCCEEDED = 2;
    STATUS_FAILED = 3;
    STATUS_SUBMITTED = 4;
  }
  Status status = 3;
  bool refund_received = 4;
  string note = 5;
  snowfall.stdlib.v1.Money refunded_us = 6;
  snowfall.stdlib.v1.Money refunded_us_in_payer_currency = 7;
  snowfall.stdlib.v1.Money refunded_reseller = 8;
  snowfall.stdlib.v1.Money refund_position = 9;
  string invoice_reference = 10;
  string external_reference_id = 11;
  google.protobuf.Timestamp updated_at = 12;
}
