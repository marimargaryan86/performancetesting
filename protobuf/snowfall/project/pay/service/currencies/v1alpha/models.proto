syntax = "proto3";

package snowfall.project.pay.service.currencies.v1alpha;

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/currencies/v1alpha";

message Quote {
  uint32 amount = 1;
  float rate = 2;
}

message Currency {
  string code = 1;
  string name = 2;
  int32 exponent = 3;
}
