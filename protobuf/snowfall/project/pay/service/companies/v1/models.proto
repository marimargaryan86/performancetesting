syntax = "proto3";

package snowfall.project.pay.service.companies.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/money.proto";
import "snowfall/stdlib/v1/phone_number.proto";
import "snowfall/stdlib/v1/postal_address.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/companies/v1";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_TRANSACTIONAL = 1;
  PAYMENT_METHOD_INVOICE = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_CARD = 1;
  PAYMENT_TYPE_BANK_TRANSFER = 2;
}

message Company {
  string id = 1;
  string name = 2;
  snowfall.stdlib.v1.PostalAddress address = 3;
  float fx_markup = 4;
  float processing_markup = 5;
  float sales_markup = 6;
  string account_id = 7;
  repeated snowfall.stdlib.v1.Money fee_amounts = 8;
  PaymentMethod payment_method = 9;
  PaymentType payment_type = 10;
}

message Account {
  string id = 1;
  string external_reference = 2;
  string company_id = 3;
  string contact_id = 4;
  string name = 5;
  Status status = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Contact {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  snowfall.stdlib.v1.PhoneNumber phone_number = 5;
  string company_id = 6;
  google.protobuf.Timestamp created_at = 7;
  string external_reference = 8;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ENABLED = 1;
  STATUS_ENABLED_NO_TRADING = 2;
  STATUS_DISABLED = 3;
}

message BankDetails {
  string name = 1;
  string bic_swift = 2;
  string account_type = 3;
  string payment_types = 4;
  snowfall.stdlib.v1.PostalAddress address = 5;
  string account_number = 6;
  string aba = 7;
  string iban = 8;
}

message MetaData {
  string bank_account_holder_name = 1;
  string email = 2;
  snowfall.stdlib.v1.PostalAddress beneficiary_address = 3;
  BankDetails bank_details = 4;
}

message Beneficiary {
  string id = 1;
  string external_reference = 2;
  string account_id = 3;
  string created_by = 4;
  string updated_by = 5;
  string payment_type = 6;
  string currency = 7;
  MetaData meta_data = 8;
}
