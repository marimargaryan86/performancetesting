syntax = "proto3";

package snowfall.project.pay.service.companies.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/money.proto";
import "snowfall/stdlib/v1/phone_number.proto";
import "snowfall/stdlib/v1/postal_address.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/companies/v1";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_TRANSACTIONAL = 1;
  PAYMENT_METHOD_INVOICE = 2;
}

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_CARD = 1;
  PAYMENT_TYPE_BANK_TRANSFER = 2;
}

enum BillingType {
  BILLING_TYPE_UNSPECIFIED = 0;
  BILLING_TYPE_PERCENTAGE = 1;
  BILLING_TYPE_FIXED = 2;
}

enum VerticalType {
  VERTICAL_TYPE_UNSPECIFIED = 0;
  VERTICAL_TYPE_AIR = 1;
  VERTICAL_TYPE_RAIL = 2;
  VERTICAL_TYPE_FERRY = 3;
  VERTICAL_TYPE_HOTEL = 4;
  VERTICAL_TYPE_BUS = 5;
  VERTICAL_TYPE_CAR = 6;
}

message VerticalFee {
  VerticalType vertical_type = 1;
  BillingType billing_type = 2;
  float value = 3;
}

message Company {
  string id = 1;
  string name = 2;
  snowfall.stdlib.v1.PostalAddress address = 3;
  float fx_markup = 4;
  float processing_markup = 5;
  float sales_markup = 6;
  repeated snowfall.stdlib.v1.Money fee_amounts = 8;
  PaymentMethod payment_method = 9;
  PaymentType payment_type = 10;
  BillingType billing_type = 11;
  bool apply_markups = 12;
  bool create_invoice_account = 13;
  string finance_email = 14;
  string payment_reference = 15;
  int32 invoice_due_days = 16;
  int32 invoice_generation_frequency = 17;
  snowfall.stdlib.v1.Date invoice_generation_date = 18;
  repeated VerticalFee vertical_fees = 19;
}

message Contact {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  snowfall.stdlib.v1.PhoneNumber phone_number = 5;
  string company_id = 6;
  google.protobuf.Timestamp created_at = 7;
  string external_reference = 8;
}

message ListOfIds {
  repeated string ids = 1;
}
