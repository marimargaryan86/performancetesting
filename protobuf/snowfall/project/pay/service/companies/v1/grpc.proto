syntax = "proto3";

package snowfall.project.pay.service.companies.v1;

import "snowfall/project/pay/service/companies/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/companies/v1";

service CompaniesService {
  rpc CreateCompany(CreateCompanyRequest) returns (CreateCompanyResponse) {}
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse) {}
  rpc UpdateCompany(UpdateCompanyRequest) returns (UpdateCompanyResponse) {}
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse) {}
}

service ContactsService {
  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse) {}
  rpc GetContact(GetContactRequest) returns (GetContactResponse) {}
  rpc ListCompanyContacts(ListCompanyContactsRequest) returns (ListCompanyContactsResponse) {}
  rpc UpdateContactReference(UpdateContactReferenceRequest) returns (UpdateContactReferenceResponse) {}
}

message CreateContactRequest {
  Contact contact = 1;
}

message CreateContactResponse {
  Contact contact = 1;
}

message GetContactRequest {
  string id = 1;
}

message GetContactResponse {
  Contact contact = 1;
}

message ListCompanyContactsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string company_id = 3;
}

message ListCompanyContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

message UpdateContactReferenceRequest {
  string contact_id = 1;
  string external_reference = 2;
}

message UpdateContactReferenceResponse {
  Contact contact = 1;
}

message CreateCompanyRequest {
  Company company = 1;
}

message CreateCompanyResponse {
  Company company = 1;
}

message GetCompanyRequest {
  string id = 1;
}

message GetCompanyResponse {
  Company company = 1;
}

message UpdateCompanyRequest {
  Company company = 1;
}

message UpdateCompanyResponse {
  Company company = 1;
}
message ListCompaniesRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool is_accountless = 3;
  ListOfIds ids = 4;
}

message ListCompaniesResponse {
  repeated Company companies = 1;
  string next_page_token = 2;
}
