syntax = "proto3";

package snowfall.project.pay.service.companies.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/phone_number.proto";
import "snowfall/stdlib/v1/postal_address.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/companies/v1alpha";

message Company {
  string id = 1;
  string name = 2;
  snowfall.stdlib.v1.PostalAddress address = 3;
  float fx_markup = 4;
  float processing_markup = 5;
  float sales_markup = 6;
  string account_id = 7;
}

message Account {
  string id = 1;
  string external_reference = 2;
  string company_id = 3;
  string contact_id = 4;
  string name = 5;
  string status = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Contact {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  snowfall.stdlib.v1.PhoneNumber phone_number = 5;
  string company_id = 6;
  google.protobuf.Timestamp created_at = 7;
  string external_reference = 8;
}
