syntax = "proto3";

package snowfall.project.pay.service.beneficiaries.v1alpha;

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/beneficiaries/v1alpha";

message Beneficiary {
  string id = 1;
  string external_reference = 2;
  string account_id = 3;
  string created_by = 4;
  string updated_by = 5;
}
