syntax = "proto3";

package snowfall.project.pay.service.transactions.v1;

import "snowfall/project/pay/service/companies/v1/models.proto";
import "snowfall/project/pay/service/transactions/v1/models.proto";
import "snowfall/stdlib/v1/money.proto";
import "snowfall/stdlib/v1/sort.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/transactions/v1";

service TransactionsService {
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {}
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse) {}
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {}
}

service QuotationsService {
  rpc CreateQuotation(CreateQuotationRequest) returns (CreateQuotationResponse) {}
  rpc GetQuotation(GetQuotationRequest) returns (GetQuotationResponse) {}
  rpc UpdateQuotationStatus(UpdateQuotationStatusRequest) returns (UpdateQuotationStatusResponse) {}
}

service ConversionsService {
  rpc GetConversion(GetConversionRequest) returns (GetConversionResponse) {}
  rpc ListConversions(ListConversionsRequest) returns (ListConversionsResponse) {}
}

service BillsService {
  rpc CreateBill(CreateBillRequest) returns (CreateBillResponse) {}
  rpc GetBill(GetBillRequest) returns (GetBillResponse) {}
  rpc UpdateBillReconciliation(UpdateBillReconciliationRequest) returns (UpdateBillReconciliationResponse) {}
  rpc ListBills(ListBillsRequest) returns (ListBillsResponse) {}
}

message ListTransactionsRequest {
  int32 page_size = 1;
  string page_token = 2;
  snowfall.stdlib.v1.Sort sort_by = 3;
  repeated string filter_by = 4;
  repeated string filter_by_bill_ids = 5;
  repeated string filter_by_external_reference = 6;
}

message ListTransactionsResponse {
  string next_page_token = 1;
  repeated Transaction transactions = 2;
}

message GetTransactionRequest {
  string id = 1;
  string selector = 2;
}

message GetTransactionsRequest {
  repeated string ids = 1;
  string selector = 2;
}

message GetTransactionsResponse {
  repeated Transaction transactions = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message CreateTransactionRequest {
  Quotation quotation = 1;
  string external_reference = 3;
  string invoice_reference = 4;
  snowfall.project.pay.service.companies.v1.PaymentMethod payment_method = 5;
  snowfall.project.pay.service.companies.v1.PaymentType payment_type = 6;
  string order_id = 7;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message CreateQuotationRequest {
  string from_currency = 1;
  string to_currency = 2;
  int32 amount = 3;
  snowfall.project.pay.service.companies.v1.Company payer = 4;
  snowfall.project.pay.service.companies.v1.Company beneficiary_company = 5;
  string session_token = 6;
  int32 tax = 7;
  int32 fee_multiplier = 8;
}

message CreateQuotationResponse {
  Quotation quotation = 1;
}

message GetQuotationRequest {
  string id = 1;
}

message GetQuotationResponse {
  Quotation quotation = 1;
}

message UpdateQuotationStatusRequest {
  string id = 1;
  QuotationStatus status = 2;
}

message UpdateQuotationStatusResponse {
  bool is_success = 1;
}

message CreateConversionRequest {
  snowfall.stdlib.v1.Money beneficiary_amount = 1;
  snowfall.stdlib.v1.Money base_converted_amount = 2;
  string transaction_id = 3;
}

message CreateConversionResponse {
  Conversion conversion = 1;
}

message GetConversionRequest {
  string id = 1;
}

message GetConversionResponse {
  Conversion conversion = 1;
}

message ListConversionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListConversionsResponse {
  string next_page_token = 1;
  repeated Conversion conversions = 2;
}

message CreateBillRequest {
  Bill bill = 1;
}

message CreateBillResponse {
  Bill bill = 1;
}

message GetBillRequest {
  string id = 1;
}

message GetBillResponse {
  Bill bill = 1;
}

message UpdateBillReconciliationRequest {
  string id = 1;
  bool is_reconciled = 2;
}

message UpdateBillReconciliationResponse {
  Bill bill = 1;
}

message ListBillsRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string filter_by_order_ids = 3;
  snowfall.stdlib.v1.Sort sort_by = 4;
}

message ListBillsResponse {
  string next_page_token = 1;
  repeated Bill bills = 2;
}
