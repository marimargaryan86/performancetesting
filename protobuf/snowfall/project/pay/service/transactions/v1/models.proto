syntax = "proto3";

package snowfall.project.pay.service.transactions.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/project/pay/service/companies/v1/models.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/transactions/v1";

message QuotationAmounts {
  snowfall.stdlib.v1.Money beneficiary = 1;
  snowfall.stdlib.v1.Money base_converted = 2;
  snowfall.stdlib.v1.Money sales_margin = 3;
  snowfall.stdlib.v1.Money quotation = 4;
  snowfall.stdlib.v1.Money fx_margin = 5;
  snowfall.stdlib.v1.Money processing_margin = 6;
  snowfall.stdlib.v1.Money tax_converted = 7;
  snowfall.stdlib.v1.Money total_markups = 8;
  snowfall.stdlib.v1.Money total_amount = 9;
  snowfall.stdlib.v1.Money fee_amount = 10;
  snowfall.stdlib.v1.Money tax = 11;
  snowfall.stdlib.v1.Money service_markup = 12;
}

message QuotationRates {
  float fx_quote = 1;
  float fx_buffer = 2;
  float fx_markup = 3;
  float sales_markup = 4;
  float processing_markup = 5;
  int32 fee_multiplier = 6;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_SUCCEEDED = 2;
  TRANSACTION_STATUS_FAILED = 3;
}

message Transaction {
  string id = 1;
  string external_reference_id = 2;
  string invoice_reference_id = 3;
  google.protobuf.Timestamp created_at = 4;
  QuotationAmounts amounts = 5;
  QuotationRates rates = 6;
  string payer_id = 7;
  string beneficiary_id = 8;
  snowfall.project.pay.service.companies.v1.PaymentMethod payment_method = 9;
  snowfall.project.pay.service.companies.v1.PaymentType payment_type = 10;
  string bill_id = 11;
  TransactionStatus status = 12;
  string invoice_id = 13;
}

enum QuotationStatus {
  QUOTATION_STATUS_UNSPECIFIED = 0;
  QUOTATION_STATUS_QUOTED = 1;
  QUOTATION_STATUS_CONFIRMED = 2;
  QUOTATION_STATUS_INVALIDATED = 3;
  QUOTATION_STATUS_UTILIZED = 4;
}

message Quotation {
  string id = 1;
  QuotationAmounts amounts = 2;
  QuotationRates rates = 3;
  google.protobuf.Timestamp expires_at = 4;
  QuotationStatus status = 5;
  string payer_id = 6;
  string beneficiary_id = 7;
  string transaction_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Bill {
  string id = 1;
  string order_id = 2;
  optional bool is_reconciled = 3;
  snowfall.stdlib.v1.Money total_amount = 4;
  snowfall.stdlib.v1.Money reconciled_amount = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string payment_intent_id = 8;
}

message Invoice {
  string id = 1;
  string reseller_id = 2;
  string statement_path = 3;
  string external_reference_id = 4;
  repeated string transaction_ids = 5;
}
