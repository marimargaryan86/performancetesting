syntax = "proto3";

package snowfall.project.pay.service.transactions.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/pay/service/quotations/v1alpha/models.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/transactions/v1alpha";

message Transaction {
  string id = 1;
  string external_reference_id = 2;
  string invoice_reference_id = 3;
  google.protobuf.Timestamp created_at = 4;
  string conversion_id = 5;
  snowfall.project.pay.service.quotations.v1alpha.QuotationAmounts amounts = 6;
  snowfall.project.pay.service.quotations.v1alpha.QuotationRates rates = 7;
  string payer_id = 8;
  string beneficiary_id = 9;
}

message QuotationAmounts {
  snowfall.stdlib.v1.Money beneficiary = 1;
  snowfall.stdlib.v1.Money base_converted = 2;
  snowfall.stdlib.v1.Money sales_margin = 3;
  snowfall.stdlib.v1.Money quotation = 4;
  snowfall.stdlib.v1.Money fx_margin = 5;
  snowfall.stdlib.v1.Money processing_margin = 6;
}

message QuotationRates {
  float fx_quote = 1;
  float fx_buffer = 2;
  float fx_markup = 3;
  float sales_markup = 4;
  float processing_markup = 5;
}

message Quotation {
  string id = 1;
  QuotationAmounts amounts = 2;
  QuotationRates rates = 3;
  google.protobuf.Timestamp expires_at = 4;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_QUOTED = 1;
    STATUS_CONFIRMED = 2;
    STATUS_INVALIDATED = 3;
    STATUS_UTILIZED = 4;
  }
  Status status = 5;
  string payer_id = 6;
  string beneficiary_id = 7;
  string transaction_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
