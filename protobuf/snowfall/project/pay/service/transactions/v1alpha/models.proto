syntax = "proto3";

package snowfall.project.pay.service.transactions.v1alpha;

import "snowfall/stdlib/v1alpha/datetime.proto";

message Transaction {
  string id = 1;
  string external_reference_id = 2;
  string quotation_id = 3;
  string parent_external_id = 4;
  snowfall.stdlib.v1alpha.DateTime created_at = 5;
}
