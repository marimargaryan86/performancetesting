syntax = "proto3";

package snowfall.project.pay.service.transactions.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/pay/service/companies/v1alpha/models.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/transactions/v1alpha";

message QuotationAmounts {
  snowfall.stdlib.v1.Money beneficiary = 1;
  snowfall.stdlib.v1.Money base_converted = 2;
  snowfall.stdlib.v1.Money sales_margin = 3;
  snowfall.stdlib.v1.Money quotation = 4;
  snowfall.stdlib.v1.Money fx_margin = 5;
  snowfall.stdlib.v1.Money processing_margin = 6;
  snowfall.stdlib.v1.Money tax_converted = 7;
  snowfall.stdlib.v1.Money total_markups = 8;
  snowfall.stdlib.v1.Money total_amount = 9;
  snowfall.stdlib.v1.Money reseller_markup = 10;
  snowfall.stdlib.v1.Money lead_reseller_markup = 11;
  snowfall.stdlib.v1.Money tax = 12;
  snowfall.stdlib.v1.Money service_markup = 13;
}

message QuotationRates {
  float fx_quote = 1;
  float fx_buffer = 2;
  float fx_markup = 3;
  float sales_markup = 4;
  float processing_markup = 5;
}

message Transaction {
  string id = 1;
  string external_reference_id = 2;
  string invoice_reference_id = 3;
  google.protobuf.Timestamp created_at = 4;
  string conversion_id = 5;
  QuotationAmounts amounts = 6;
  QuotationRates rates = 7;
  string payer_id = 8;
  string beneficiary_id = 9;
  snowfall.project.pay.service.companies.v1alpha.PaymentMethod payment_method = 10;
  snowfall.project.pay.service.companies.v1alpha.PaymentType payment_type = 11;
  string bill_id = 12;
}

enum QuotationStatus {
  QUOTATION_STATUS_UNSPECIFIED = 0;
  QUOTATION_STATUS_QUOTED = 1;
  QUOTATION_STATUS_CONFIRMED = 2;
  QUOTATION_STATUS_INVALIDATED = 3;
  QUOTATION_STATUS_UTILIZED = 4;
}

message Quotation {
  string id = 1;
  QuotationAmounts amounts = 2;
  QuotationRates rates = 3;
  google.protobuf.Timestamp expires_at = 4;
  QuotationStatus status = 5;
  string payer_id = 6;
  string beneficiary_id = 7;
  string transaction_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Conversion {
  string id = 1;
  string external_id = 2;
  google.protobuf.Timestamp settlement_date = 3;
  google.protobuf.Timestamp created_at = 4;
  snowfall.stdlib.v1.Money buy_amount = 5;
  snowfall.stdlib.v1.Money sell_amount = 6;
  float executed_rate = 7;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_EXECUTED = 1;
    STATUS_FAILED = 2;
  }
  Status status = 8;
}

message Bill {
  string id = 1;
  string order_id = 2;
  optional bool is_reconciled = 3;
  snowfall.stdlib.v1.Money total_amount = 4;
  snowfall.stdlib.v1.Money reconciled_amount = 5;
}
