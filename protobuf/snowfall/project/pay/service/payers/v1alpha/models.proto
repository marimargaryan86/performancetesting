syntax = "proto3";

package snowfall.project.pay.service.payers.v1alpha;

import "snowfall/stdlib/v1alpha/models.proto";
import "snowfall/stdlib/v1alpha/postal_address.proto";

message Payer {
  string id = 1;
  oneof payer_details {
    CompanyTypePayer company_details = 3;
    IndividualTypePayer individual_details = 4;
  }
}

message CompanyTypePayer {
  string name = 1;
  string number = 2;
  snowfall.stdlib.v1alpha.PostalAddress address = 3;
}

message IndividualTypePayer {
  string name = 1;
  snowfall.stdlib.v1alpha.Date date_of_birth = 2;
  snowfall.stdlib.v1alpha.PostalAddress address = 3;
}
