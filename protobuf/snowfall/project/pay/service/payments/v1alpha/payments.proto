syntax = "proto3";

package snowfall.project.pay.service.payments.v1alpha;

import "snowfall/project/pay/service/payments/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/payments/v1alpha";

service PaymentsService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse) {}
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse) {}
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse) {}
}

message CreatePaymentRequest {
  Payment payment = 1;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ListPaymentsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_page_token = 2;
}
