syntax = "proto3";

package snowfall.project.pay.service.payments.v1;

import "snowfall/project/pay/service/payments/v1/credit_card_models.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/payments/v1";

service CreditCardPaymentService {
  rpc GetCreditCardPayment(GetCreditCardPaymentRequest) returns (GetCreditCardPaymentResponse) {}
  rpc CreateCreditCardPayment(CreateCreditCardPaymentRequest) returns (CreateCreditCardPaymentResponse) {}
  rpc UpdateCreditCardPayment(UpdateCreditCardPaymentRequest) returns (UpdateCreditCardPaymentResponse) {}
  rpc CancelCreditCardPayment(CancelCreditCardPaymentRequest) returns (CancelCreditCardPaymentResponse) {}
  rpc CaptureCreditCardPayment(CaptureCreditCardPaymentRequest) returns (CaptureCreditCardPaymentResponse) {}
  rpc ProcessCreditCardPayment(ProcessCreditCardPaymentRequest) returns (ProcessCreditCardPaymentResponse) {}
  rpc GetCreditCardHolder(GetCreditCardHolderRequest) returns (GetCreditCardHolderResponse) {}
  rpc CreateCreditCardHolder(CreateCreditCardHolderRequest) returns (CreateCreditCardHolderResponse) {}
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse) {}
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse) {}
  rpc CreateEphemeralKey(CreateEphemeralKeyRequest) returns (CreateEphemeralKeyResponse) {}
}

message GetCreditCardPaymentRequest {
  string payment_id = 1;
  string reseller_id = 2;
}

message GetCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message CreateCreditCardPaymentRequest {
  CreditCardPayment payment = 1;
  string reseller_id = 2;
}

message CreateCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message UpdateCreditCardPaymentRequest {
  string payment_id = 1;
  snowfall.stdlib.v1.Money amount = 2;
  PaymentMetaData metadata = 3;
  string receipt_email = 4;
  string reseller_id = 5;
}

message UpdateCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message CancelCreditCardPaymentRequest {
  string payment_id = 1;
  string reseller_id = 2;
}

message CancelCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message CaptureCreditCardPaymentRequest {
  string payment_id = 1;
  string reseller_id = 2;
}

message CaptureCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message ProcessCreditCardPaymentRequest {
  string payment_id = 1;
  string reseller_id = 3;
}

message ProcessCreditCardPaymentResponse {
  CreditCardPayment payment = 1;
}

message GetCreditCardHolderRequest {
  string credit_card_holder_id = 1;
  string reseller_id = 2;
}

message GetCreditCardHolderResponse {
  CreditCardHolder credit_card_holder = 1;
  string signature = 2;
}

message CreateCreditCardHolderRequest {
  CreditCardHolder credit_card_holder = 1;
  string user_id = 2;
  string reseller_id = 3;
}

message CreateCreditCardHolderResponse {
  CreditCardHolder credit_card_holder = 1;
  string signature = 2;
}

message GetRefundRequest {
  string refund_id = 1;
  string reseller_id = 2;
}

message GetRefundResponse {
  Refund refund = 1;
}

message CreateRefundRequest {
  int32 amount = 1;
  string credit_card_payment_id = 2;
  string reseller_id = 3;
}

message CreateRefundResponse {
  Refund refund = 1;
}

message CreateEphemeralKeyRequest {
  string customer_id = 1;
  string reseller_id = 2;
}

message CreateEphemeralKeyResponse {
  string signature = 1;
}
