syntax = "proto3";

package snowfall.project.pay.service.payments.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/payments/v1";

message CreditCardPayment {
  string id = 1;
  snowfall.stdlib.v1.Money amount = 2;
  string capture_method = 3;
  string credit_card_holder_id = 4;
  bool enable_automatic_payment_method = 5;
}

message CreditCardHolder {
  string id = 1;
  string email = 2;
  string name = 3;
  string version = 4;
}

message Refund {
  string external_reference_id = 1;
  string credit_card_payment_id = 2;
  snowfall.stdlib.v1.Money amount = 3;
}

message PaymentUser {
  string id = 1;
  string internal_user_id = 2;
  google.protobuf.Timestamp created_at = 3;
}
