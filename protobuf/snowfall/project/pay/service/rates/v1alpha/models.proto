syntax = "proto3";

package snowfall.project.pay.service.rates.v1alpha;

import "google/protobuf/timestamp.proto";

message Rate {
  string id = 1;
  string buy_currency = 2;
  string sell_currency = 3;
  float rate = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MonitoredRate {
  string buy_currency = 1;
  string sell_currency = 2;
  bool enabled = 3;
  google.protobuf.Timestamp fetched_at = 4;
}

message BackUpRate {
  string id = 1;
  string buy_currency = 2;
  string sell_currency = 3;
  float rate = 4;
}
