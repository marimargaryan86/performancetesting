syntax = "proto3";

package snowfall.project.pay.service.rates.v1alpha;

import "snowfall/project/pay/service/rates/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/pay/service/rates/v1alpha";

service RatesService {
  rpc Insert(InsertRequest) returns (InsertResponse) {}
  rpc Monitor(MonitorRequest) returns (MonitorResponse) {}
}

message InsertRequest {
  repeated Rate rates = 1;
}

message InsertResponse {
  repeated Rate rates = 2;
}

message MonitorRequest {
  MonitoredRate monitored_rate = 1;
}

message MonitorResponse {
  MonitoredRate monitored_rate = 1;
}
