syntax = "proto3";

package snowfall.project.junction.service.providers.distribusion.v1alpha;

import "snowfall/stdlib/v1alpha/date.proto";
import "snowfall/stdlib/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/service/providers/distribusion/v1alpha";

message SearchCriteriaTask {
  string offer_search_id = 1;
  repeated snowfall.stdlib.v1alpha.Segment segments = 2;
  Criteria criteria = 3;
  string session_token = 4;
}

message Criteria {
  repeated string origin_ids = 1;
  repeated string destination_ids = 2;
  snowfall.stdlib.v1alpha.Date outbound_departure = 3;
  optional snowfall.stdlib.v1alpha.Date inbound_departure = 4;
  repeated uint32 passengers_age = 5;
  optional string locale = 6;
  optional string currency = 7;
}
