syntax = "proto3";

package snowfall.project.junction.service.providers.ba_ndc.v1alpha;

import "snowfall/project/junction/go/v1alpha/models.proto";
import "snowfall/stdlib/v1alpha/datetime.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/service/providers/ba_ndc/v1alpha";

message SearchCriteriaTask {
  string offer_search_id = 1;
  repeated snowfall.project.junction.go.v1alpha.Segment segments = 2;
  Criteria criteria = 3;
  string session_token = 4;
}

message Criteria {
  string origin_iata = 1;
  string destination_iata = 2;
  snowfall.stdlib.v1alpha.DateTime outbound_departure = 3;
  optional snowfall.stdlib.v1alpha.DateTime inbound_departure = 4;
  string cabin_class = 5;
  uint32 adults = 6;
  uint32 children = 7;
  uint32 infants = 8;
}
