syntax = "proto3";

package snowfall.project.junction.service.providers.benerail.v1alpha;

import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/datetime.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/service/providers/benerail/v1alpha";

message SearchCriteriaTask {
  repeated snowfall.project.junction.go.v1.Segment segments = 1;
  Criteria criteria = 2;
}

message Criteria {
  string origin_id = 1;
  string destination_id = 2;
  repeated snowfall.stdlib.v1.Date passenger_dob = 3;
  snowfall.stdlib.v1.DateTime outbound_departure_datetime = 4;
  string cabin_class = 6;
  string br_session_token = 7;
}

message BookingNotificationTask {
  string br_booking_id = 1;
  optional string br_session_token = 2;
  string br_dnr = 3;
  string journey_id = 4;
  string order_id = 5;
  string booking_id = 6;
  string passenger_name_record = 7;
  string departure_at = 8;
  string ticket_url = 9;
}
