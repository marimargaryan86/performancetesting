syntax = "proto3";

package snowfall.project.junction.service.providers.save_a_train.v1;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/stdlib/v1/datetime.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/service/providers/save_a_train/v1";

message SearchCriteriaTask {
  reserved 1, 4;
  reserved "offer_search_id", "session_token";
  repeated snowfall.project.junction.go.v1.Segment segments = 2;
  Criteria criteria = 3;
}

message Criteria {
  string origin_id = 1;
  string destination_id = 2;
  repeated uint32 passengers_ages = 3;
  snowfall.stdlib.v1.DateTime departure_datetime = 4;
  snowfall.stdlib.v1.DateTime arrival_datetime = 6;
  string cabin_class = 5;
}

message CabinClassMapping {
  snowfall.project.junction.go.v1.CabinClass.Type type = 1;
  string mapping = 2;
}

message BookingNotificationTask {
  string journey_id = 1;
  string order_id = 2;
  string booking_id = 3;
  string passenger_name_record = 4;
  string search_identifier = 5;
  string departure_at = 6;
  string ticket_confirmation_code = 7;
  string ticket_url = 8;
  google.protobuf.Timestamp created_at = 9;
}
