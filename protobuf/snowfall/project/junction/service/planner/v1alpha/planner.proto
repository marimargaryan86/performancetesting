syntax = "proto3";

package snowfall.project.junction.service.planner.v1alpha;

import "snowfall/stdlib/v1alpha/datetime.proto";
import "snowfall/stdlib/v1alpha/latlng.proto";
import "snowfall/stdlib/v1alpha/models.proto";

service PlannerService {
  rpc SearchJourney(SearchJourneyRequest) returns (SearchJourneyResponse) {}
}

message SearchJourneyRequest {
  repeated snowfall.stdlib.v1alpha.LatLng origins = 1;
  repeated snowfall.stdlib.v1alpha.LatLng destinations = 2;
  snowfall.stdlib.v1alpha.DateTime departure_after = 3;
}

message SearchJourneyResponse {
  repeated snowfall.stdlib.v1alpha.TripReference trips = 1;
}
