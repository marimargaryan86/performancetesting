syntax = "proto3";

package snowfall.project.junction.service.passenger_name_records.v1alpha;

import "google/protobuf/timestamp.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/service/passenger_name_records/v1alpha";

service PassengerNameRecordService {
  rpc CreatePassengerNameRecord(CreatePassengerNameRecordRequest) returns (CreatePassengerNameRecordResponse) {}
}

message PassengerNameRecord {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message CreatePassengerNameRecordRequest {}

message CreatePassengerNameRecordResponse {
  PassengerNameRecord passenger_name_record = 1;
}
