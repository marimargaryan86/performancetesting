syntax = "proto3";

package snowfall.project.junction.service.orders.v1alpha;

import "snowfall/project/junction/service/offers/v1alpha/models.proto";
import "snowfall/stdlib/v1alpha/models.proto";
import "snowfall/stdlib/v1alpha/money.proto";
import "snowfall/stdlib/v1alpha/phone_number.proto";
import "snowfall/stdlib/v1alpha/postal_address.proto";

message Journey {
  string id = 1;
  repeated Order orders = 2;
  string passenger_name_record = 3;
  ContactDetails contact_details = 4;
  // reseller id
}

message Order {
  string id = 1;
  string journey_id = 2;
  repeated Booking bookings = 3;
  repeated Passenger passengers = 4;
  // reseller id
}

message Booking {
  string id = 1;
  string order_id = 2;
  oneof option {
    TripOption trip_option = 3;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_CONFIRMED = 2;
    STATUS_REJECTED = 3;
    STATUS_NOT_TICKETED = 4;
    STATUS_ERROR = 5;
  }
  Status status = 4;
  string provider_name = 5;
  snowfall.stdlib.v1alpha.Money total_price = 6;
  oneof result {
    TripBooking trip_result = 7;
  }
  string raw_data = 8; // json
}

message TripBooking {
  string record_locator = 1;
  repeated string operator_booking_references = 2;
}

message ContactDetails {
  snowfall.stdlib.v1alpha.PostalAddress address = 1;
  snowfall.stdlib.v1alpha.PhoneNumber phone = 2;
  string email = 3;
}

message Passenger {
  string first_name = 1;
  string last_name = 2;
  enum Title {
    TITLE_UNSPECIFIED = 0;
    TITLE_MR = 1;
    TITLE_MRS = 2;
    TITLE_MISS = 3;
    TITLE_MS = 4;
  }
  Title title = 3;
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
  }
  Gender gender = 4;
  snowfall.stdlib.v1alpha.Date date_of_birth = 5;
  optional DocumentDetails doc_details = 6;
}

message DocumentDetails {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PASSPORT = 1;
  }
  Type document_type = 1;
  string document_number = 2;
  string issue_county = 3;
  string nationality = 4;
  snowfall.stdlib.v1alpha.Date exp_date = 5;
}

message TripOption {
  string id = 1;
  string booking_id = 4;
  repeated TripOptionDetails details = 2;
  snowfall.stdlib.v1alpha.Money price = 3;
}

message TripOptionDetails {
  string id = 3;
  string booking_id = 4;
  snowfall.project.junction.service.offers.v1alpha.OfferSegment segment = 1;
  snowfall.stdlib.v1alpha.CabinClass cabin_class = 2;
}
