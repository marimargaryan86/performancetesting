syntax = "proto3";

package snowfall.project.junction.service.orders.v1alpha;

import "snowfall/project/junction/service/orders/v1alpha/models.proto";
import "snowfall/stdlib/v1alpha/postal_address.proto";

message PlaceOrderTask {
  Booking booking = 1;
  ContactDetails contact_details = 2;
  repeated Passenger passengers = 3;
  OrderMetadata metadata = 4;
  snowfall.stdlib.v1alpha.PostalAddress residence_address = 5;
}

message OrderMetadata {
  string journey_id = 1;
  string order_id = 2;
  string booking_id = 3;
  string passenger_name_record = 4;
}
