syntax = "proto3";

package snowfall.project.junction.go.service.trips.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/service/offers/v1/models.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/stdlib/v1/amqp.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";
import "snowfall/stdlib/v1/options.proto";
import "snowfall/stdlib/v1/sort.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/trips/v1alpha";

service TripSearchService {
  rpc EnqueueTripSearch(EnqueueTripSearchRequest) returns (EnqueueTripSearchResponse) {}
  rpc GetTripSearchDetails(GetTripSearchDetailsRequest) returns (GetTripSearchDetailsResponse) {}
}

service TripService {
  rpc GetTrip(GetTripRequest) returns (GetTripResponse) {}
  rpc ListTrips(ListTripsRequest) returns (ListTripsResponse) {}
  rpc GetSegment(GetSegmentRequest) returns (GetSegmentResponse) {}
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse) {}
}

message GetSegmentRequest {
  string id = 1;
}

message GetSegmentResponse {
  snowfall.project.junction.go.v1.SegmentReference segment = 1;
}

message GetTripRequest {
  string id = 1;
}

message GetTripResponse {
  snowfall.project.junction.go.v1.TripReference trip = 1;
}

message EnqueueTripSearchRequest {
  TripSearch trip_search = 1;
}

message EnqueueTripSearchResponse {
  TripSearch trip_search = 1;
}

message GetTripSearchDetailsRequest {
  string id = 1;
}

message GetTripSearchDetailsResponse {
  TripSearch trip_search = 1;
}

message ListSegmentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
}

message ListSegmentsResponse {
  repeated snowfall.project.junction.go.v1.SegmentReference segments = 1;
  string next_page_token = 2;
}

message ListTripsRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
}

message ListTripsResponse {
  repeated snowfall.project.junction.go.v1.TripReference trips = 1;
  string next_page_token = 2;
}

message TripSearch {
  string id = 1 [(snowfall.stdlib.v1.read_only) = true];
  google.protobuf.Timestamp expires_at = 2 [(snowfall.stdlib.v1.read_only) = true];
  repeated snowfall.project.junction.go.v1.Point origins = 3;
  repeated snowfall.project.junction.go.v1.Point destinations = 4;
  snowfall.stdlib.v1.DateTime departure_after = 5;
  repeated string trip_ids = 6 [(snowfall.stdlib.v1.read_only) = true];
  snowfall.stdlib.v1.Trackable.Status status = 7 [(snowfall.stdlib.v1.read_only) = true];
  optional uint32 maximum_connections = 8;
  repeated snowfall.project.junction.go.v1.Schedule.Type allowed_segment_types = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

service TripCandidateSearchService {
  rpc EnqueueTripCandidateSearch(EnqueueTripCandidateSearchRequest) returns (EnqueueTripCandidateSearchResponse) {}
  rpc GetTripCandidateSearchDetails(GetTripCandidateSearchDetailsRequest) returns (GetTripCandidateSearchDetailsResponse) {}
}

message EnqueueTripCandidateSearchRequest {
  TripCandidateSearch trip_candidate_search = 1;
}

message EnqueueTripCandidateSearchResponse {
  TripCandidateSearch trip_candidate_search = 1;
}

message GetTripCandidateSearchDetailsRequest {
  string id = 1;
}

message GetTripCandidateSearchDetailsResponse {
  TripCandidateSearch trip_candidate_search = 1;
}

message TripCandidateSearchCriteria {
  snowfall.stdlib.v1.LatLng origin = 1;
  snowfall.stdlib.v1.LatLng destination = 2;
  repeated snowfall.stdlib.v1.LatLng origins = 3;
  repeated snowfall.stdlib.v1.LatLng destinations = 4;
  snowfall.stdlib.v1.DateTime departure_after = 5;
  optional uint32 maximum_connections = 6;
}

message TripCandidateSearch {
  string id = 1 [(snowfall.stdlib.v1.read_only) = true];
  google.protobuf.Timestamp expires_at = 2 [(snowfall.stdlib.v1.read_only) = true];
  snowfall.stdlib.v1.Trackable.Status status = 3 [(snowfall.stdlib.v1.read_only) = true];
  repeated TripCandidateSearchCriteria criteria = 4;
  repeated snowfall.project.junction.go.service.offers.v1.Passenger passengers = 5;
  repeated snowfall.project.junction.go.v1.Schedule.Type allowed_segment_types = 6;
  repeated string offer_search_ids = 7 [(snowfall.stdlib.v1.read_only) = true];
  string reseller_id = 8;
  string currency_code = 9;
  string pay_company_id = 10;
  string session_token = 11;
}

service TripCandidateService {
  rpc ListTripCandidates(ListTripCandidatesRequest) returns (ListTripCandidatesResponse) {}
}

message ListTripCandidatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string trip_candidate_search_id = 3;
  }
  repeated snowfall.project.junction.go.v1.CabinClass.Type cabin_class_types = 4;
  snowfall.stdlib.v1.Sort sort_by = 5;
}

message ListTripCandidatesResponse {
  string next_page_token = 1;
  repeated snowfall.project.junction.go.service.offers.v1.OfferAggregate offers = 2;
}

message LegCache {
  string id = 1;
  snowfall.project.junction.go.v1.Leg leg = 2;
  google.protobuf.Timestamp expires_at = 3 [(snowfall.stdlib.v1.read_only) = true];
}
