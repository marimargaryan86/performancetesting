syntax = "proto3";

package snowfall.project.junction.go.service.planner.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/project/junction/v1/segment_type.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/planner/v1";

service PlannerService {
  rpc FindRoutes(FindRoutesRequest) returns (FindRoutesResponse) {}
  rpc SearchJourney(SearchJourneyRequest) returns (SearchJourneyResponse) {}
}

message SearchJourneyRequest {
  repeated snowfall.stdlib.v1.LatLng origins = 1;
  repeated snowfall.stdlib.v1.LatLng destinations = 2;
  snowfall.stdlib.v1.DateTime departure_after = 3;
  optional snowfall.stdlib.v1.DateTime departure_before = 6;
  optional uint32 maximum_connections = 4;
  repeated snowfall.project.junction.go.v1.Schedule.Type allowed_segment_types = 5;
}

message SearchJourneyResponse {
  repeated snowfall.project.junction.go.v1.TripReference trips = 1;
}

message FindRoutesRequest {
  repeated snowfall.stdlib.v1.LatLng origins = 1;
  repeated snowfall.stdlib.v1.LatLng destinations = 2;
  optional snowfall.stdlib.v1.DateTime departure_after = 5;
  optional snowfall.stdlib.v1.DateTime departure_before = 6;
  optional uint32 maximum_connections = 3;
  repeated snowfall.project.junction.go.v1.Schedule.Type allowed_segment_types = 4;
}

message FindRoutesResponse {
  message Segment {
    snowfall.stdlib.v1.LatLng origin = 1;
    snowfall.stdlib.v1.LatLng destination = 2;
    snowfall.project.junction.v1.SegmentType segment_type = 3;
    google.protobuf.Duration estimated_travel_time = 4;
    repeated google.protobuf.Timestamp estimated_departure_times = 5;
    uint32 estimated_daily_departures = 6;
  }

  message Route {
    repeated Segment segments = 1;
    google.protobuf.Duration estimated_travel_time = 2;
    uint32 estimated_daily_departures = 3;
  }

  repeated Route routes = 1;
}
