syntax = "proto3";

package snowfall.project.junction.go.service.planner.v1;

import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/planner/v1";

service PlannerService {
  rpc SearchJourney(SearchJourneyRequest) returns (SearchJourneyResponse) {}
}

message SearchJourneyRequest {
  repeated snowfall.stdlib.v1.LatLng origins = 1;
  repeated snowfall.stdlib.v1.LatLng destinations = 2;
  snowfall.stdlib.v1.DateTime departure_after = 3;
  optional snowfall.stdlib.v1.DateTime departure_before = 6;
  optional uint32 maximum_connections = 4;
  repeated snowfall.project.junction.go.v1.Schedule.Type allowed_segment_types = 5;
}

message SearchJourneyResponse {
  repeated snowfall.project.junction.go.v1.TripReference trips = 1;
}
