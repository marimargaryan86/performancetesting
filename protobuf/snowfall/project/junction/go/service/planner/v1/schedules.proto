syntax = "proto3";

package snowfall.project.junction.go.service.planner.v1;

import "snowfall/project/junction/go/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/planner/v1";

message Route {
  uint64 sequence = 1; // index of the route in the routes.bin
  repeated uint64 schedules = 2;
  repeated uint64 route_stops = 3;
}

message RouteStop {
  uint64 sequence = 1; // index of the route stop in route_stops.bin
  uint64 route = 2; // index of its associated route in routes.bin
  uint64 stop = 3; // index of its associated stop in stops.bin
  uint32 order = 4; // the order of the stop within the route
}

message Stop {
  uint64 sequence = 1; // index of the stop in stops.bin
  string id = 2;
  uint32 transfer_time = 3; // time to transfer to another transport on the same stop
  repeated uint64 route_stops = 4; // list of route_stops associated with this stop
  repeated uint64 schedule_stops = 5; // list of schedule_stops associated with this stop
  repeated uint64 transfers = 6; // list of transfers associated with this stop
}

message Transfer {
  uint64 sequence = 1; // index of the transfer in transfers.bin
  uint64 from_stop = 2; // index of the stop in the stops.bin
  uint64 to_stop = 3; // index of the stop in the stops.bin
  uint32 transfer_time = 4; // time to transfer from one stop to another in seconds
  snowfall.project.junction.go.v1.Schedule.Type type = 5;
}

message Schedule {
  uint64 sequence = 1; // index of the schedule in schedules.bin
  string id = 2;
  snowfall.project.junction.go.v1.Schedule.Type type = 3;
  uint64 route = 4; // index of the route in routes.bin associated with this schedule
  repeated uint64 schedule_stops = 5; // indices of schedule_stops in this schedule
}

message ScheduleStop {
  string id = 1;
  uint64 sequence = 2; // index of the schedule_stop in schedule_stops.bin
  uint64 schedule = 3; // index of the schedule in schedules.bin
  uint64 stop = 4; // index of the stop in stops.bin
  uint32 departure_at = 5; // unix timestamp
  uint32 arrival_at = 6; // unix timestamp
  uint32 order = 7; // order of the stop in the schedule
  bool boarding_allowed = 8; // whether or not boarding is allowed
  bool alighting_allowed = 9; // whether or not alighting is allowed
}
