syntax = "proto3";

package snowfall.project.junction.go.service.schedules.v1;

import "snowfall/project/junction/go/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/schedules/v1";

service ScheduleService {
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {}
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {}
  rpc GetLeg(GetLegRequest) returns (GetLegResponse) {}
  rpc ListLegs(ListLegsRequest) returns (ListLegsResponse) {}
}

message GetScheduleRequest {
  string id = 1;
}

message GetScheduleResponse {
  snowfall.project.junction.go.v1.Schedule schedule = 1;
}

message ListSchedulesRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
}

message ListSchedulesResponse {
  repeated snowfall.project.junction.go.v1.Schedule schedules = 1;
  string next_page_token = 2;
}

message GetLegRequest {
  string id = 1;
}

message GetLegResponse {
  snowfall.project.junction.go.v1.Leg leg = 1;
}

message ListLegsRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
}

message ListLegsResponse {
  repeated snowfall.project.junction.go.v1.Leg legs = 1;
  string next_page_token = 2;
}
