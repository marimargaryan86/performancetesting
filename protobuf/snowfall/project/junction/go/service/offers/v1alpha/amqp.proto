syntax = "proto3";

package snowfall.project.junction.go.service.offers.v1alpha;

import "snowfall/project/junction/go/service/offers/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/offers/v1alpha";

message TripOfferSearchTask {
  string offer_search_id = 1;
  TripOfferSearch search = 2;
  string session_token = 3;
}

message TripOfferSearchResult {
  string offer_search_id = 1;
  OfferGroup offer = 2;
  string provider_company_id = 3;
}

message TripPriceQuoteTask {
  string price_quote_container_id = 1;
  string option_id = 2;
  string session_token = 3;
}

message TripPriceQuoteResult {
  string price_quote_container_id = 1;
  string option_id = 2;
  PriceQuote price_quote = 3;
  string provider_company_id = 4;
}
