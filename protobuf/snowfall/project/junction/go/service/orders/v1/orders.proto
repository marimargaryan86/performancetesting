syntax = "proto3";

package snowfall.project.junction.go.service.orders.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/service/orders/v1/models.proto";
import "snowfall/stdlib/v1/postal_address.proto";
import "snowfall/stdlib/v1/sort.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/go/service/orders/v1";

service OrderService {
  rpc CreateJourney(CreateJourneyRequest) returns (CreateJourneyResponse) {}
  rpc GetJourney(GetJourneyRequest) returns (GetJourneyResponse) {}
  rpc ListJourneys(ListJourneysRequest) returns (ListJourneysResponse) {}
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse) {}
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {}
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {}
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse) {}
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse) {}
  rpc GetBookingDetails(GetBookingDetailsRequest) returns (GetBookingDetailsResponse) {}
  rpc ListBookingDetails(ListBookingDetailsRequest) returns (ListBookingDetailsResponse) {}
  rpc CreateCancellationRequest(CreateCancellationRequestRequest) returns (CreateCancellationRequestResponse) {}
  rpc GetCancellationRequest(GetCancellationRequestRequest) returns (GetCancellationRequestResponse) {}
  rpc GetBookingCancellation(GetBookingCancellationRequest) returns (GetBookingCancellationResponse) {}
  rpc ListBookingCancellations(ListBookingCancellationsRequest) returns (ListBookingCancellationsResponse) {}
  rpc HandleCancellationTicketCompleted(HandleCancellationTicketCompletedRequest) returns (HandleCancellationTicketCompletedResponse) {}
  rpc UpdateBookingCancellation(UpdateBookingCancellationRequest) returns (UpdateBookingCancellationResponse) {}
  rpc Sleep(SleepRequest) returns (SleepResponse) {}
}

message SleepRequest {
  sint32 duration_seconds = 1;
}

message SleepResponse {
  string text = 1;
}

message CreateJourneyRequest {
  ContactDetails contact_details = 1;
  string reseller_id = 2;
}

message CreateJourneyResponse {
  Journey journey = 1;
}

message GetJourneyRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetJourneyResponse {
  Journey journey = 1;
}

message ListJourneysRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated string ids = 3;
  snowfall.stdlib.v1.Sort sort_by = 4;
  string reseller_id = 5;
  message JourneyFilter {
    string operator = 1;
    oneof value {
      google.protobuf.Timestamp order_created_at = 2;
      google.protobuf.Timestamp departure_at = 3;
      Booking.Status booking_status = 4;
      string last_name = 5;
      string passenger_name_record = 6;
    }
  }
  repeated JourneyFilter filter_by = 6;
}

message ListJourneysResponse {
  repeated Journey journeys = 1;
  string next_page_token = 2;
}

message PlaceOrderRequest {
  string journey_id = 1;
  repeated Passenger passengers = 2;
  message Option {
    oneof option {
      TripOption trip_option = 1;
    }
  }
  repeated Option options = 3;
  snowfall.stdlib.v1.PostalAddress residence_address = 4;
}

message PlaceOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string journey_id = 3;
    ListOfIds ids = 4;
  }
  string reseller_id = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message GetBookingRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetBookingResponse {
  Booking booking = 1;
}

message ListBookingsRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string order_id = 3;
    ListOfIds ids = 4;
    ListOfIds transaction_ids = 5;
  }
  string reseller_id = 6;
  repeated string departure_dates = 7;
}

message ListBookingsResponse {
  repeated Booking bookings = 1;
  string next_page_token = 2;
}

message GetBookingDetailsRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetBookingDetailsResponse {
  TripOptionDetails details = 1;
}

message ListBookingDetailsRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string booking_id = 3;
    ListOfIds ids = 4;
  }
  string reseller_id = 5;
}

message ListBookingDetailsResponse {
  repeated TripOptionDetails details = 1;
  string next_page_token = 2;
}

message ListOfIds {
  repeated string ids = 1;
}

message CreateCancellationRequestRequest {
  CancellationRequest cancellation_request = 1;
}

message CreateCancellationRequestResponse {
  CancellationRequest cancellation_request = 1;
}

message GetCancellationRequestRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetCancellationRequestResponse {
  CancellationRequest cancellation_request = 1;
}

message ListBookingCancellationsRequest {
  oneof payload {
    ListOfIds ids = 1;
    ListOfIds booking_ids = 2;
  }
  string reseller_id = 3;
}

message ListBookingCancellationsResponse {
  repeated BookingCancellation booking_cancellations = 1;
}

message GetBookingCancellationRequest {
  string booking_id = 1;
  string reseller_id = 2;
}

message GetBookingCancellationResponse {
  BookingCancellation booking_cancellation = 1;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_REFUND_DUE = 1;
  STATUS_REJECTED = 2;
  STATUS_NO_REFUND = 3;
}

message HandleCancellationTicketCompletedRequest {
  string ticket_id = 1;
  Status status = 2;
}

message HandleCancellationTicketCompletedResponse {
  BookingCancellation booking_cancellation = 1;
}

message UpdateBookingCancellationRequest {
  BookingCancellation booking_cancellation = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateBookingCancellationResponse {
  BookingCancellation booking_cancellation = 1;
}
