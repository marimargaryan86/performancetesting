syntax = "proto3";

package snowfall.project.junction.provider.v2alpha;

import "snowfall/project/junction/v1/fare_type.proto";
import "snowfall/project/junction/v1/segment_type.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/latlng.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/provider/v2alpha";

service TripService {
  rpc SearchTrips(SearchTripsRequest) returns (SearchTripsResponse) {}
}

message Location {
  string ref = 1;
  string name = 2;
  snowfall.stdlib.v1.LatLng coordinates = 3;
  // @todo: add timezone? It's easy for us to retrieve from coordinates while
  // the provider might not have this information, complicating the API.
}

message Stop {
  Location location = 1;
  snowfall.stdlib.v1.DateTime departure_at = 3;
  snowfall.stdlib.v1.DateTime arrival_at = 4;
}

message Segment {
  Location origin = 1;
  Location destination = 2;
  snowfall.stdlib.v1.DateTime departure_at = 3;
  snowfall.stdlib.v1.DateTime arrival_at = 4;
  snowfall.project.junction.v1.SegmentType type = 5;
  repeated Stop stops = 6;
  message Company {
    string route_number = 1; // Flight/train/bus number
    string code = 2; // Carrier IATA / Train company code
    string name = 3;
  }
  Company marketed_by = 7;
  Company operated_by = 8;
  message Passenger {
    message Seating {
      snowfall.project.junction.v1.FareType type = 1;
      string marketing_name = 2;
    }
    Seating seating = 1;
  }
  repeated Passenger passengers = 9;
  message Vehicle {
    string code = 1;
    string name = 2;
  }
  Vehicle vehicle = 10;
}

message Trip {
  repeated Segment segments = 1;
  message Fare {
    snowfall.project.junction.v1.FareType type = 1;
    string marketing_name = 2;
  }
  Fare fare = 2;
}

message Result {
  repeated Trip trips = 1;
  snowfall.stdlib.v1.Money base_amount = 2;
  snowfall.stdlib.v1.Money tax_amount = 3;
  snowfall.stdlib.v1.Money total_amount = 4;
}

message SearchTripsRequest {
  message Criterion {
    oneof origin {
      string origin_identifier = 1;
      snowfall.stdlib.v1.LatLng origin_coordinates = 2;
    }
    oneof destination {
      string destination_identifier = 3;
      snowfall.stdlib.v1.LatLng destination_coordinates = 4;
    }
    snowfall.stdlib.v1.Date departure_date = 5;
  }
  message Passenger {
    oneof age {
      string type = 1;
      snowfall.stdlib.v1.Date date_of_birth = 2;
    }
  }
  message OneWay {
    Criterion criterion = 1;
  }
  message RoundTrip {
    Criterion criterion = 1;
    snowfall.stdlib.v1.Date return_date = 2;
  }
  message MultiCity {
    repeated Criterion criteria = 1;
  }
  oneof search_mode {
    OneWay one_way = 1;
    RoundTrip round_trip = 2;
    MultiCity multi_city = 3;
  }
  repeated Passenger passengers = 4;
  // @todo: add custom config data for the provider
}

message SearchTripsResponse {
  repeated Result results = 1;
}
