syntax = "proto3";

package snowfall.project.junction.rocket.service.gateway.v1;

import "snowfall/project/junction/rocket/service/offers/v1/amqp.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/gateway/v1";

service OfferService {
  rpc EnqueueOfferSearch(EnqueueOfferSearchRequest) returns (EnqueueOfferSearchResponse) {}
  rpc PopOfferSearchResults(PopOfferSearchResultsRequest) returns (PopOfferSearchResultsResponse) {}
}

message EnqueueOfferSearchRequest {
  oneof offer_search_task {
    snowfall.project.junction.rocket.service.offers.v1.TripOfferSearchTask trip_offer_search_task = 1;
    snowfall.project.junction.rocket.service.offers.v1.SimpleTripOfferSearchTask simple_offer_search_task = 2;
  }
}

message EnqueueOfferSearchResponse {
  string id = 1;
}

message PopOfferSearchResultsRequest {
  string id = 1;
}

message PopOfferSearchResultsResponse {
  bool is_in_progress = 1;
  oneof offer_search_results {
    TripOfferSearchResults trip_offer_search_results = 2;
  }
}

message TripOfferSearchResults {
  repeated snowfall.project.junction.rocket.service.offers.v1.TripOfferSearchResult results = 1;
}
