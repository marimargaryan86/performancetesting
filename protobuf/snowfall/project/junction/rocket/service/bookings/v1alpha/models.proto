syntax = "proto3";

package snowfall.project.junction.rocket.service.bookings.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/project/junction/rocket/service/searches/v1alpha/models.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/money.proto";
import "snowfall/stdlib/v1/options.proto";
import "snowfall/stdlib/v1/phone_number.proto";
import "snowfall/stdlib/v1/postal_address.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/bookings/v1alpha";

message Booking {
  string id = 1;
  string reseller_id = 2;
  string provider_id = 3;
  string provider_name = 4;
  TripOption trip_option = 5;
  ProviderBooking provider_booking = 6;
  repeated Passenger passengers = 7;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_CONFIRMED = 2;
    STATUS_REJECTED = 3;
    STATUS_NOT_TICKETED = 4;
    STATUS_ERROR = 5;
    STATUS_CANCELLED = 6;
  }
  Status status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ProviderBooking {
  string record_locator = 1;
  string booking_reference = 2;
  string raw_data = 3;
  repeated string operator_booking_references = 4;
  repeated string ticket_urls = 5;
}

message ContactDetails {
  snowfall.stdlib.v1.PostalAddress address = 1;
  snowfall.stdlib.v1.PhoneNumber phone = 2;
  string email = 3;
}

message Passenger {
  string first_name = 1;
  string last_name = 2;
  enum Title {
    TITLE_UNSPECIFIED = 0;
    TITLE_MR = 1;
    TITLE_MRS = 2;
    TITLE_MISS = 3;
    TITLE_MS = 4;
  }
  Title title = 3;
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
  }
  Gender gender = 4;
  snowfall.stdlib.v1.Date date_of_birth = 5;
  optional DocumentDetails doc_details = 6;
  string place_of_birth = 7; // only for some ferries
  ContactDetails contact_details = 8;
  bool lead_passenger = 9;
}

message DocumentDetails {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PASSPORT = 1;
  }
  Type document_type = 1;
  string document_number = 2;
  string issue_county = 3;
  string nationality = 4;
  snowfall.stdlib.v1.Date exp_date = 5;
  string residence_country_code = 6;
  snowfall.stdlib.v1.Date issue_date = 7;
}

message TripOption {
  string price_quote_id = 1;
  snowfall.stdlib.v1.Money price = 2;
  repeated TripOptionDetails details = 3;
  repeated snowfall.project.junction.rocket.service.searches.v1alpha.FareRule rules = 4;
}

message TripOptionDetails {
  snowfall.project.junction.go.v1.CabinClass cabin_class = 1;
  oneof result_detail {
    snowfall.project.junction.rocket.service.searches.v1alpha.RailResultDetail rail = 2;
    snowfall.project.junction.rocket.service.searches.v1alpha.FerryResultDetail ferry = 3;
    snowfall.project.junction.rocket.service.searches.v1alpha.CarRentalResultDetail car_rental = 4;
  }
}

message BookingCancellation {
  string id = 1;
  string booking_id = 2;
  string ticket_id = 3 [(snowfall.stdlib.v1.read_only) = true];
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_REJECTED = 2;
    STATUS_NO_REFUND = 3;
    STATUS_REFUND_DUE = 4;
    STATUS_REFUND_ISSUED = 5;
    STATUS_REFUND_FAILED = 6;
  }
  Status status = 4;
  snowfall.stdlib.v1.Money refunded_us = 5;
  google.protobuf.Timestamp created_at = 6 [(snowfall.stdlib.v1.read_only) = true];
}
