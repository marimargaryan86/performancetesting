syntax = "proto3";

package snowfall.project.junction.rocket.service.bookings.v1alpha;

import "snowfall/project/junction/rocket/service/bookings/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/bookings/v1alpha";

service BookingService {
  rpc MakeBooking(MakeBookingRequest) returns (MakeBookingResponse) {}
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse) {}
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse) {}
}

message MakeBookingRequest {
  string reseller_id = 1;
  repeated Passenger passengers = 2;
  TripOption trip_option = 3;
}

message MakeBookingResponse {
  Booking booking = 1;
}

message GetBookingRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetBookingResponse {
  Booking booking = 1;
}

message ListBookingsRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string order_id = 3;
    ListOfIds ids = 4;
    ListOfIds transaction_ids = 5;
  }
  string reseller_id = 6;
}

message ListBookingsResponse {
  repeated Booking bookings = 1;
  string next_page_token = 2;
}

message GetBookingDetailsRequest {
  string id = 1;
  string reseller_id = 2;
}

message GetBookingDetailsResponse {
  TripOptionDetails details = 1;
}

message ListBookingDetailsRequest {
  int32 page_size = 1;
  string page_token = 2;
  oneof payload {
    string booking_id = 3;
    ListOfIds ids = 4;
  }
  string reseller_id = 5;
}

message ListBookingDetailsResponse {
  repeated TripOptionDetails details = 1;
  string next_page_token = 2;
}

message ListOfIds {
  repeated string ids = 1;
}

message GetCancellationRequestRequest {
  string id = 1;
  string reseller_id = 2;
}

message ListBookingCancellationsRequest {
  oneof payload {
    ListOfIds ids = 1;
    ListOfIds booking_ids = 2;
  }
  string reseller_id = 3;
}

message GetBookingCancellationRequest {
  string booking_id = 1;
  string reseller_id = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_REFUND_DUE = 1;
  STATUS_REJECTED = 2;
  STATUS_NO_REFUND = 3;
}

message HandleCancellationTicketCompletedRequest {
  string ticket_id = 1;
  Status status = 2;
}
