syntax = "proto3";

package snowfall.project.junction.rocket.service.offers.v1;

import "snowfall/project/junction/rocket/service/offers/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/offers/v1";

message SimpleTripOfferSearchTask {
  string offer_search_id = 1;
  SimpleTripOfferSearch search = 2;
  string session_token = 3;
  string reseller_id = 4;
}

message TripOfferSearchTask {
  string offer_search_id = 1;
  TripOfferSearch search = 2;
  string session_token = 3;
  string reseller_id = 4;
}

message TripOfferSearchResult {
  string offer_search_id = 1;
  OfferGroup offer = 2;
  string provider_company_id = 3;
  string provider_name = 4;
}

message TripPriceQuoteTask {
  string price_quote_container_id = 1;
  string option_id = 2;
  string session_token = 3;
  string reseller_id = 4;
}

message TripPriceQuoteResult {
  string price_quote_container_id = 1;
  string option_id = 2;
  PriceQuote price_quote = 3;
  string provider_company_id = 4;
}
