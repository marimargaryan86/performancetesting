syntax = "proto3";

package snowfall.project.junction.rocket.service.offers.v1alpha;

import "snowfall/project/junction/rocket/service/offers/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/offers/v1alpha";

message SearchTask {
  string search_id = 1;
  Search search = 2;
  string reseller_id = 4;
}

message SearchTaskResult {
  string search_id = 1;
  SearchResult search_result = 2;
  string provider_company_id = 3;
  string provider_name = 4;
}

message PriceQuoteTask {
  string price_quote_container_id = 1;
  string offer_id = 2;
  string reseller_id = 3;
}

message PriceQuoteTaskResult {
  string price_quote_container_id = 1;
  string offer_id = 2;
  PriceQuote price_quote = 3;
  string provider_company_id = 4;
}
