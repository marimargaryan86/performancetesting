syntax = "proto3";

package snowfall.project.junction.rocket.service.offers.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/stdlib/v1/amqp.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/offers/v1alpha";

message Rail {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  google.protobuf.Timestamp departure_after = 3;
  google.protobuf.Timestamp departure_before = 4;
  google.protobuf.Timestamp return_date = 5;
  repeated Passenger passengers = 6;
  string outbound_search_id = 7;
}

message Ferry {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  google.protobuf.Timestamp departure_after = 3;
  google.protobuf.Timestamp departure_before = 4;
  google.protobuf.Timestamp return_date = 5;
  repeated Passenger passengers = 6;
  string outbound_search_id = 7;
}

message CarRental {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  google.protobuf.Timestamp pickup_at = 3;
  google.protobuf.Timestamp dropoff_at = 4;
  Passenger driver = 5;
  uint32 passengers_count = 6;
}

message Search { // old OfferSearch/TripOfferSearch/SimpleTripOfferSearch
  string id = 1;
  string reseller_id = 2;
  oneof search_criterion {
    Rail rail = 3;
    Ferry ferry = 4;
    CarRental car_rental = 5;
  }
  snowfall.stdlib.v1.Trackable.Status status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SearchResult { // old OfferGroup
  string id = 1;
  string provider_id = 2;
  repeated Offer offers = 3;
  repeated OfferSegment offer_segments = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message Offer {
  string id = 1;
  string initial_offer_id = 2;
  repeated OfferSegmentDetails offer_segment_details = 3;
  snowfall.stdlib.v1.Money price = 4;
  repeated PriceBreakdown price_breakdown = 5;
  repeated ConditionalPrice conditional_prices = 6;
}

message OfferSegmentDetails {
  string id = 1;
  string offer_segment_id = 2;
  snowfall.project.junction.go.v1.CabinClass cabin_class = 3;
}

message OfferSegment {
  string id = 1;
  snowfall.project.junction.go.v1.Point origin = 2;
  snowfall.project.junction.go.v1.Point destination = 3;
  uint32 trip_sequence = 4;
  uint32 component_sequence = 5;
}

message Passenger {
  snowfall.stdlib.v1.Date date_of_birth = 1;
}

message PriceBreakdown {
  snowfall.stdlib.v1.Money price = 1;
  enum BreakdownType {
    BREAKDOWN_TYPE_UNSPECIFIED = 0;
    BREAKDOWN_TYPE_BASE_FARE = 1;
    BREAKDOWN_TYPE_TAX = 2;
  }
  BreakdownType breakdown_type = 2;
}

message ConditionalPrice {
  snowfall.stdlib.v1.Money price = 1;
  string description = 2;
  bool included_in_total = 3;
}

message FareRule {
  string title = 1;
  string body = 2;
}

message ApplicableTo {
  optional snowfall.stdlib.v1.Date date_of_birth_before = 1;
  optional snowfall.stdlib.v1.Date date_of_birth_after = 2;
}

message Penalty {
  ApplicableTo applicable_to = 1;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_EXCHANGE = 1;
    TYPE_REFUND = 2;
  }
  Type penalty_type = 2;
  optional bool changeable = 3;
  bool refundable = 4;
  enum Applicability {
    APPLICABILITY_UNSPECIFIED = 0;
    APPLICABILITY_BEFORE = 1;
    APPLICABILITY_AFTER = 2;
  }
  Applicability applicability = 5;
  optional snowfall.stdlib.v1.Money price = 6;
  optional bool conditions_apply = 7;
}

message PriceQuote {
  string id = 1;
  string search_result_id = 2;
  string offer_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  snowfall.stdlib.v1.Money price = 5;
  enum Required {
    REQUIRED_UNSPECIFIED = 0;
    REQUIRED_DATE_OF_BIRTH = 1;
    REQUIRED_NATIONALITY = 2;
    REQUIRED_EXPIRATION_DATE = 3;
    REQUIRED_ISSUING_COUNTRY = 4;
    REQUIRED_PASSPORT_NUMBER = 5;
    REQUIRED_RESIDENCE_COUNTRY_CODE = 6;
    REQUIRED_RESIDENCE_ADDRESS = 7;
    REQUIRED_ISSUE_DATE = 8;
  }
  repeated Required required_documents = 6;
  repeated Penalty penalties = 7;
  repeated FareRule rules = 8;
  repeated PriceBreakdown price_breakdown = 9;
  repeated ConditionalPrice conditional_prices = 10;
}
