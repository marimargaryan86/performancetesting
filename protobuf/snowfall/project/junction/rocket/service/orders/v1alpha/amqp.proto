syntax = "proto3";

package snowfall.project.junction.rocket.service.orders.v1alpha;

import "snowfall/project/junction/rocket/service/orders/v1alpha/models.proto";
import "snowfall/stdlib/v1/postal_address.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/orders/v1alpha";

message PlaceOrderTask {
  Booking booking = 1;
  ContactDetails contact_details = 2;
  repeated Passenger passengers = 3;
  OrderMetadata metadata = 4;
  snowfall.stdlib.v1.PostalAddress residence_address = 5;
  string reseller_id = 6;
}

message OrderMetadata {
  string journey_id = 1;
  string order_id = 2;
  string booking_id = 3;
  string passenger_name_record = 4;
}

message HandleCancellationTask {
  string cancellation_request_id = 1;
}
