syntax = "proto3";

package snowfall.project.junction.rocket.service.searches.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/go/v1/models.proto";
import "snowfall/project/junction/rocket/service/places/v1alpha/models.proto";
import "snowfall/stdlib/v1/amqp.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/datetime.proto";
import "snowfall/stdlib/v1/money.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/searches/v1alpha";

message Rail {
  snowfall.project.junction.rocket.service.places.v1alpha.Place origin = 1;
  snowfall.project.junction.rocket.service.places.v1alpha.Place destination = 2;
  google.protobuf.Timestamp departure_after = 3;
  google.protobuf.Timestamp departure_before = 4;
  google.protobuf.Timestamp return_date = 5;
  repeated Passenger passengers = 6;
  string outbound_offer_id = 7;
}

message Ferry {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  google.protobuf.Timestamp departure_after = 3;
  google.protobuf.Timestamp return_date = 4;
  repeated Passenger passengers = 5;
  repeated Vehicle vehicles = 6;
  string outbound_offer_id = 7;
}

message CarRental {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  google.protobuf.Timestamp pickup_at = 3;
  google.protobuf.Timestamp return_at = 4;
  uint32 driver_age = 5;
}

message Search { // old SimpleTripOfferSearch
  string id = 1;
  string reseller_id = 2;
  repeated string search_result_ids = 3;
  snowfall.stdlib.v1.Trackable.Status status = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  oneof search_criterion {
    Rail rail = 8;
    Ferry ferry = 9;
    CarRental car_rental = 10;
  }
}

message SearchResult { // old OfferGroup
  string id = 1;
  string search_id = 2;
  string provider_id = 3;
  string pay_company_id = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated Offer offers = 6;
  repeated ResultDetail result_details = 7;
}

message Offer { // Old OfferOption
  string id = 1;
  snowfall.stdlib.v1.Money price = 2;
  repeated PriceBreakdown price_breakdown = 3;
  oneof offer {
    RailOffer rail = 4;
    FerryOffer ferry = 5;
    CarRentalOffer car_rental = 6;
  }
}

message CabinDetails {
  string result_id = 1;
  snowfall.project.junction.go.v1.CabinClass cabin_class = 2;
}

message RailOffer {
  repeated CabinDetails cabin_class = 1;
}

message FerryOffer {
  string ferry_result_detail_id = 1;
}

message CarRentalOffer {
  repeated ConditionalPrice conditional_prices = 1;
}

message ResultDetail { // Old OfferSegment
  string id = 1;
  oneof result_detail {
    RailResultDetail rail = 2;
    FerryResultDetail ferry = 3;
    CarRentalResultDetail car_rental = 4;
  }
}

message RailResultDetail {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  bool outbound_segment = 3;
  uint32 segment_sequence = 4;
  snowfall.stdlib.v1.DateTime departure_date = 5;
  snowfall.stdlib.v1.DateTime arrival_date = 6;
}

message FerryResultDetail {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  FerryOperator ferry_operator = 3;
  bool outbound_segment = 4;
  uint32 segment_sequence = 5;
  int32 duration_in_minutes = 6;
  snowfall.stdlib.v1.DateTime departure_date = 7;
  snowfall.stdlib.v1.DateTime arrival_date = 8;
}

message FerryOperator {
  int32 id = 1;
  string name = 2;
}

message CarRentalResultDetail {
  snowfall.project.junction.go.v1.Point origin = 1;
  snowfall.project.junction.go.v1.Point destination = 2;
  optional string image_url = 3;
  optional string model = 4;
  optional uint32 seats_count = 5;
  optional uint32 doors_count = 6;
  optional string transmission = 7;
  optional uint32 baggage_quantity = 8;
  optional string vehicle_type = 9;
  optional bool unlimited_mileage = 11;
  optional bool air_conditioner = 12;
  optional string vendor_name = 13;
  optional string vendor_code = 14;
  snowfall.stdlib.v1.DateTime pickup_at = 15;
  snowfall.stdlib.v1.DateTime return_at = 16;
}

message Vehicle {
  enum TypeId {
    TYPE_ID_UNSPECIFIED = 0;
    TYPE_ID_BICYCLE = 1;
    TYPE_ID_CAR = 2;
    TYPE_ID_CAMPER_OR_MOTORHOME = 3;
    TYPE_ID_MOTORCYCLE_AND_SIDECAR = 5;
    TYPE_ID_MOTORCYCLE = 7;
    TYPE_ID_MINIBUS = 10;
    TYPE_ID_VAN = 11;
    reserved 4, 6, 8, 9;
  }
  TypeId type_id = 1;
}

message Passenger {
  snowfall.stdlib.v1.Date date_of_birth = 1;
}

message PriceBreakdown {
  snowfall.stdlib.v1.Money price = 1;
  enum BreakdownType {
    BREAKDOWN_TYPE_UNSPECIFIED = 0;
    BREAKDOWN_TYPE_BASE_FARE = 1;
    BREAKDOWN_TYPE_TAX = 2;
  }
  BreakdownType breakdown_type = 2;
}

message ConditionalPrice {
  snowfall.stdlib.v1.Money price = 1;
  string description = 2;
  bool included_in_total = 3;
}

message FareRule {
  string title = 1;
  string body = 2;
}

message ApplicableTo {
  optional snowfall.stdlib.v1.Date date_of_birth_before = 1;
  optional snowfall.stdlib.v1.Date date_of_birth_after = 2;
}

message Penalty {
  ApplicableTo applicable_to = 1;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_EXCHANGE = 1;
    TYPE_REFUND = 2;
  }
  Type penalty_type = 2;
  optional bool changeable = 3;
  bool refundable = 4;
  enum Applicability {
    APPLICABILITY_UNSPECIFIED = 0;
    APPLICABILITY_BEFORE = 1;
    APPLICABILITY_AFTER = 2;
  }
  Applicability applicability = 5;
  optional snowfall.stdlib.v1.Money price = 6;
  optional bool conditions_apply = 7;
}

message Quote {
  string id = 1;
  string offer_id = 2;
  string pay_quote_id = 3;
  string pay_company_id = 4;
  google.protobuf.Timestamp expires_at = 5;
  snowfall.stdlib.v1.Money price = 6;
  enum Required {
    REQUIRED_UNSPECIFIED = 0;
    REQUIRED_DATE_OF_BIRTH = 1;
    REQUIRED_NATIONALITY = 2;
    REQUIRED_EXPIRATION_DATE = 3;
    REQUIRED_ISSUING_COUNTRY = 4;
    REQUIRED_PASSPORT_NUMBER = 5;
    REQUIRED_RESIDENCE_COUNTRY_CODE = 6;
    REQUIRED_RESIDENCE_ADDRESS = 7;
    REQUIRED_ISSUE_DATE = 8;
  }
  repeated Required required_documents = 7;
  repeated Penalty penalties = 8;
  repeated FareRule rules = 9;
  repeated PriceBreakdown price_breakdown = 10;
  repeated ConditionalPrice conditional_prices = 11;
}
