syntax = "proto3";

package snowfall.project.junction.rocket.service.searches.v1alpha;

import "snowfall/project/junction/rocket/service/searches/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/searches/v1alpha";

service SearchService {
  rpc EnqueueSearch(EnqueueSearchRequest) returns (EnqueueSearchResponse) {}
  rpc GetSearch(GetSearchRequest) returns (GetSearchResponse) {}
}

service SearchResultService {
  rpc GetSearchResult(GetSearchResultRequest) returns (GetSearchResultResponse) {}
  // rpc ListOfferGroups(ListOfferGroupsRequest) returns (ListOfferGroupsResponse) {}
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse) {}
  // rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {}
  rpc GetResultDetail(GetResultDetailRequest) returns (GetResultDetailResponse) {}
  // rpc ListOfferGroupDetails(ListOfferGroupDetailsRequest) returns (ListOfferGroupDetailsResponse) {}
  rpc GetOfferDetail(GetOfferDetailRequest) returns (GetOfferDetailResponse) {}
  // rpc ListOfferOptionDetails(ListOfferOptionDetailsRequest) returns (ListOfferOptionDetailsResponse) {}
}

service QuoteService {
  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse) {}
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {}
}

message EnqueueSearchRequest {
  Search search = 1;
}

message EnqueueSearchResponse {
  Search search = 1;
}

message GetSearchRequest {
  string id = 1;
}

message GetSearchResponse {
  Search search = 1;
}

message GetSearchResultRequest {
  string id = 1;
}

message GetSearchResultResponse {
  SearchResult search_result = 1;
}

message GetOfferRequest {
  string id = 1;
}

message GetOfferResponse {
  Offer offer = 1;
}

message GetResultDetailRequest {
  string id = 1;
}

message GetResultDetailResponse {
  ResultDetail result_detail = 1;
}

message GetOfferDetailRequest {
  string id = 1;
}

message GetOfferDetailResponse {
  OfferDetail offer_detail = 1;
}

message CreateQuoteRequest {
  string search_result_id = 1;
  string offer_id = 2;
  string reseller_id = 3;
}

message CreateQuoteResponse {
  Quote quote = 1;
}

message GetQuoteRequest {
  string id = 1;
}

message GetQuoteResponse {
  Quote quote = 1;
}
