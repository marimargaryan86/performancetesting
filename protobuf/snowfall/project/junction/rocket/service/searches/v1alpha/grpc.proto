syntax = "proto3";

package snowfall.project.junction.rocket.service.searches.v1alpha;

import "snowfall/project/junction/rocket/service/searches/v1alpha/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/searches/v1alpha";

service SearchService {
  rpc EnqueueSearch(EnqueueSearchRequest) returns (EnqueueSearchResponse) {}
  rpc GetSearch(GetSearchRequest) returns (GetSearchResponse) {}
}

service SearchResultService {
  rpc ListSearchResults(ListSearchResultsRequest) returns (ListSearchResultsResponse) {}
}

service OfferService {
  rpc GetOffer(GetOfferRequest) returns (GetOfferResponse) {}
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {}
}

service QuoteService {
  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse) {}
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {}
}

message EnqueueSearchRequest {
  Search search = 1;
}

message EnqueueSearchResponse {
  Search search = 1;
}

message GetSearchRequest {
  string id = 1;
}

message GetSearchResponse {
  Search search = 1;
}

message ListSearchResultsRequest {
  string search_id = 1;
}

message ListSearchResultsResponse {
  repeated SearchResult search_results = 1;
}

message GetOfferRequest {
  string id = 1;
}

message GetOfferResponse {
  Offer offer = 1;
}

message ListOffersRequest {
  int32 page_size = 1;
  string page_token = 2;
  message ListOfIds {
    repeated string ids = 1;
  }
  oneof filter {
    ListOfIds ids = 3;
  }
}

message ListOffersResponse {
  repeated Offer offers = 1;
  string next_page_token = 2;
}

message CreateQuoteRequest {
  repeated string offer_ids = 1;
  string reseller_id = 2;
  string reseller_pay_company_id = 3;
  string reseller_currency = 4;
}

message CreateQuoteResponse {
  Quote quote = 1;
}

message GetQuoteRequest {
  string id = 1;
}

message GetQuoteResponse {
  Quote quote = 1;
}
