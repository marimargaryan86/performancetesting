syntax = "proto3";

package snowfall.project.junction.rocket.service.api.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/project/junction/v1/segment_type.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/datetime.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/service/api/v1alpha";

message Suggestion {
  string id = 1;
  string suggestion_search_id = 5;
  message Offer {
    string id = 1;
    string result_id = 3;
    snowfall.project.junction.v1.SegmentType segment_type = 2;
  }
  repeated Offer offers = 6;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SuggestionSearch {
  string id = 1;
  message Criteria {
    string reseller_id = 5;
    string origin_id = 1;
    string destination_id = 2;
    snowfall.stdlib.v1.DateTime departure_after = 3;
    snowfall.stdlib.v1.DateTime return_departure_after = 6;
    message Passenger {
      snowfall.stdlib.v1.Date date_of_birth = 1;
    }
    repeated Passenger passengers = 4;
  }
  Criteria criteria = 2;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;
    STATUS_PROCESSING = 2;
    STATUS_COMPLETED = 3;
    STATUS_FAILED = 4;
  }
  Status status = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message SuggestionSearchTask {
  string suggestion_search_id = 1;
}
