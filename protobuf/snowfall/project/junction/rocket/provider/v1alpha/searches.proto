syntax = "proto3";

package snowfall.project.junction.rocket.provider.v1alpha;

import "snowfall/project/junction/rocket/service/searches/v1alpha/amqp.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/rocket/provider/v1alpha";

service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse) {}
}

message SearchRequest {
  snowfall.project.junction.rocket.service.searches.v1alpha.SearchTask search_task = 1;
}

message SearchResponse {
  SearchResults search_results = 1;
}

message SearchResults {
  repeated snowfall.project.junction.rocket.service.searches.v1alpha.SearchTaskResult results = 1;
}
