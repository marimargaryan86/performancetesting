syntax = "proto3";

package snowfall.project.junction.plus.service.orders_registration.v1alpha;

import "snowfall/project/junction/plus/service/notifications/v1/models.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/plus/service/orders_registration/v1alpha";

message IncomingOrder {
  string reseller_id = 1;
  string external_ref_id = 2;
  string booking_reference = 3;
  snowfall.project.junction.plus.service.notifications.v1.ContactDetails contact_details = 4;
  repeated snowfall.project.junction.plus.service.notifications.v1.Passenger passengers = 5;
  repeated snowfall.project.junction.plus.service.notifications.v1.Booking bookings = 6;
}
