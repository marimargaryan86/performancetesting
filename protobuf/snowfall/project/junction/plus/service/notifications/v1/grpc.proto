syntax = "proto3";

package snowfall.project.junction.plus.service.notifications.v1;

import "snowfall/project/junction/plus/service/notifications/v1/models.proto";
import "snowfall/stdlib/v1/datetime.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/plus/service/notifications/v1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {}
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {}
  rpc FindOrders(FindOrdersRequest) returns (FindOrdersResponse) {}
}

service SubscriberService {
  rpc GetSubscriber(GetSubscriberRequest) returns (GetSubscriberResponse) {}
  rpc GetSubscriberFromReseller(GetSubscriberFromResellerRequest) returns (GetSubscriberFromResellerResponse) {}
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse) {}
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse) {}
  rpc UpdatePushNotificationToken(UpdatePushNotificationTokenRequest) returns (UpdatePushNotificationTokenResponse) {}
}

service ConfigurationVectorService {
  rpc GetConfigurationVector(GetConfigurationVectorRequest) returns (GetConfigurationVectorResponse) {}
  rpc CreateConfigurationVector(CreateConfigurationVectorRequest) returns (CreateConfigurationVectorResponse) {}
  rpc UpdateConfigurationVector(UpdateConfigurationVectorRequest) returns (UpdateConfigurationVectorResponse) {}
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse) {}
  rpc UpdatePermissions(UpdatePermissionsRequest) returns (UpdatePermissionsResponse) {}
}

service MonitoringRuleService {
  rpc GetMonitoringRule(GetMonitoringRuleRequest) returns (GetMonitoringRuleResponse) {}
  rpc GetMonitoringRuleByBooking(GetMonitoringRuleByBookingRequest) returns (GetMonitoringRuleByBookingResponse) {}
  rpc CreateMonitoringRule(CreateMonitoringRuleRequest) returns (CreateMonitoringRuleResponse) {}
  rpc UpdateMonitoringRule(UpdateMonitoringRuleRequest) returns (UpdateMonitoringRuleResponse) {}
  rpc UpdateCheckinReminder(UpdateCheckinReminderRequest) returns (UpdateCheckinReminderResponse) {}
  rpc UpdateWeatherReport(UpdateWeatherReportRequest) returns (UpdateWeatherReportResponse) {}
  rpc FindMonitoringRules(FindMonitoringRulesRequest) returns (FindMonitoringRulesResponse) {}
}

service NotificationEventPublisherService {
  rpc PublishNotificationEvent(PublishNotificationEventRequest) returns (PublishNotificationEventResponse) {}
}

message CreateOrderRequest {
  string reseller_id = 1;
  string external_ref_id = 2;
  string booking_reference = 3;
  ContactDetails contact_details = 4;
  repeated Passenger passengers = 5;
  repeated Booking bookings = 6;
}

message CreateOrderResponse {
  PersistedOrder order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  PersistedOrder order = 1;
}

message FindOrdersRequest {
  string identifier = 1;
  string selector = 2;
}

message FindOrdersResponse {
  repeated PersistedOrder orders = 1;
}

message GetSubscriberRequest {
  string id = 1;
}

message GetSubscriberResponse {
  Subscriber subscriber = 1;
}

message GetSubscriberFromResellerRequest {
  string reseller_id = 1;
  string mobile_phone = 2;
}

message GetSubscriberFromResellerResponse {
  Subscriber subscriber = 1;
}

message UnsubscribeRequest {
  string identifier = 1;
}

message UnsubscribeResponse {
  bool is_success = 1;
}

message SubscribeRequest {
  string identifier = 1;
}

message SubscribeResponse {
  bool is_success = 1;
}

message UpdatePushNotificationTokenRequest {
  string reseller_id = 1;
  string mobile_phone = 2;
  string push_notification_token = 3;
}

message UpdatePushNotificationTokenResponse {
  bool is_success = 1;
}

message GetConfigurationVectorRequest {
  string identifier = 1;
  string selector = 2;
}

message GetConfigurationVectorResponse {
  ConfigurationVector configuration_vector = 1;
}

message CreateConfigurationVectorRequest {
  ConfigurationVector configuration_vector = 1;
}

message CreateConfigurationVectorResponse {
  ConfigurationVector configuration_vector = 1;
}

message UpdateConfigurationVectorRequest {
  ConfigurationVector configuration_vector = 1;
}

message UpdateConfigurationVectorResponse {
  bool is_success = 1;
}

message GetMonitoringRuleRequest {
  string monitoring_rule_id = 1;
}
message GetMonitoringRuleResponse {
  MonitoringRule monitoring_rule = 1;
}

message GetMonitoringRuleByBookingRequest {
  Booking booking = 1;
}
message GetMonitoringRuleByBookingResponse {
  MonitoringRule monitoring_rule = 1;
}
message CreateMonitoringRuleRequest {
  MonitoringRule monitoring_rule = 1;
}
message CreateMonitoringRuleResponse {
  MonitoringRule monitoring_rule = 1;
}
message UpdateMonitoringRuleRequest {
  MonitoringRule monitoring_rule = 1;
}
message UpdateMonitoringRuleResponse {
  bool is_success = 1;
}
message UpdateCheckinReminderRequest {
  string identifier = 1;
}
message UpdateCheckinReminderResponse {
  bool is_success = 1;
}
message UpdateWeatherReportRequest {
  string identifier = 1;
}
message UpdateWeatherReportResponse {
  bool is_success = 1;
}

message FindMonitoringRulesRequest {
  snowfall.stdlib.v1.DateTime departure_after = 5;
  string sent_flag = 6;
}

message FindMonitoringRulesResponse {
  repeated MonitoringRule monitoring_rules = 1;
}

message PublishNotificationEventRequest {
  NotificationEvent event = 1;
}
message PublishNotificationEventResponse {
  bool is_success = 1;
}

message GetPermissionsRequest {
  string reseller_id = 1;
}

message GetPermissionsResponse {
  repeated Permission permissions = 1;
}

message UpdatePermissionsRequest {
  string reseller_id = 1;
  repeated PermissionUpdate updates = 2;
}

message UpdatePermissionsResponse {
  bool is_success = 1;
}
