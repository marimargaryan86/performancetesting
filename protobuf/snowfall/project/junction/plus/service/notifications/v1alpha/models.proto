syntax = "proto3";

package snowfall.project.junction.plus.service.notifications.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/date.proto";
import "snowfall/stdlib/v1/phone_number.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/plus/service/notifications/v1alpha";

message PersistedOrder {
  string id = 1;
  string reseller_id = 2;
  string external_ref_id = 3;
  string booking_reference = 4;
  string subscriber_id = 5;
  repeated Passenger passengers = 6;
  repeated Booking bookings = 7;
}

message ContactDetails {
  string email = 1;
  PostalAddress address = 2;
  snowfall.stdlib.v1.PhoneNumber phone = 3;
}

message PostalAddress {
  repeated string address_lines = 1;
  string region_code = 2;
  string postal_code = 3;
  string locality = 4;
}

message Passenger {
  string first_name = 1;
  string last_name = 2;
  enum Title {
    TITLE_UNSPECIFIED = 0;
    TITLE_MR = 1;
    TITLE_MRS = 2;
    TITLE_MISS = 3;
    TITLE_MS = 4;
  }
  Title title = 3;
  enum Gender {
    GENDER_UNSPECIFIED = 0;
    GENDER_MALE = 1;
    GENDER_FEMALE = 2;
  }
  Gender gender = 4;
  snowfall.stdlib.v1.Date date_of_birth = 5;
}

message Booking {
  oneof booking {
    AirBooking value = 1;
  }
}

message AirBooking {
  string id = 1;
  google.protobuf.Timestamp departure_at = 2;
  google.protobuf.Timestamp arrival_at = 3;
  string origin = 4;
  string destination = 5;
  string origin_iata = 6;
  string destination_iata = 7;
  RouteIdentifier route_identifier = 8;
  string cabin_class = 9;
}

message RouteIdentifier {
  string carrier = 1;
  int32 flight_number = 2;
}

message Subscriber {
  string id = 1;
  string reseller_id = 2;
  string first_name = 3;
  string last_name = 4;
  snowfall.stdlib.v1.PhoneNumber phone_number = 5;
  string email = 6;
  enum SubscribedStatus {
    SUBSCRIBED_STATUS_UNSPECIFIED = 0;
    SUBSCRIBED_STATUS_SUBSCRIBED = 1;
    SUBSCRIBED_STATUS_UNSUBSCRIBED = 2;
  }
  SubscribedStatus phone_subscription_status = 7;
  SubscribedStatus email_subscription_status = 8;
}

message ConfigurationVector {
  string id = 1;
  string reseller_id = 2;
  Channel channel = 3;
  snowfall.stdlib.v1.PhoneNumber mobile_phone = 4;
  string email = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_EMAIL = 1;
  CHANNEL_WHATSAPP = 2;
}

message MonitoringRule {
  string id = 1;
  string ext_rule_id = 2;
  Booking booking = 3;
  repeated string subscriber_ids = 4;
}

message FlightStatsAlert {
  string monitoring_role_id = 1;
  string type = 2;
  string value = 3;
  Booking booking = 4;
  repeated UpdatedDateField updates = 5;
}

message UpdatedDateField {
  enum Field {
    FIELD_UNSPECIFIED = 0;
    FIELD_SGD = 1;
    FIELD_EGD = 2;
    FIELD_AGD = 3;
  }
  Field field = 1;
  google.protobuf.Timestamp original_date_local = 2;
  google.protobuf.Timestamp new_date_local = 3;
}

message NotificationEvent {
  string sender_id = 1;
  string receiver_id = 2;
  oneof event {
    PersistedOrder body = 3;
    FlightStatsAlert alert = 4;
  }
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_ORDER_CONFIRMATION = 1;
    TYPE_FLIGHT_STATS_ALERT = 2;
  }
  Type event_type = 5;
  Channel channel = 6;
}
