syntax = "proto3";
package snowfall.project.junction.plus.service.external_dependencies.v1;

import "snowfall/stdlib/v1/date.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/plus/service/external_dependencies/v1";

message FlightEmission {
  string origin = 1;
  string destination = 2;
  string operating_carrier_code = 3;
  int32 flight_number = 4;
  EmissionsPerPax emissions_per_pax = 5;
  string unit = 6;
}

message EmissionsPerPax {
  int32 first = 1;
  int32 business = 2;
  int32 premium_economy = 3;
  int32 economy = 4;
}

message Flight {
  string origin = 1;
  string destination = 2;
  string operating_carrier_code = 3;
  int32 flight_number = 4;
  snowfall.stdlib.v1.Date departure_date = 5;
}

message AirportResources {
  string departure_terminal = 1;
  string departure_gate = 2;
  string arrival_terminal = 3;
  string arrival_gate = 4;
  string baggage = 5;
}

message Delays {
  int32 departure_gate_delay_minutes = 1;
  int32 arrival_gate_delay_minutes = 2;
}

message FlightStatus {
  string status = 1;
  Delays delays = 2;
  AirportResources airport_resources = 3;
  string flight_number = 4;
  string carrier_fs_code = 5;
  int32 flight_id = 6;
}

message ServiceIntent {
  string redirect_uri = 1;
  string title = 2;
  string description = 3;
  string info = 4;
  int32 fee = 5;
  string approval_rate = 6;
  string appliers_count = 7;
  string expected_processing_time = 8;
  string stay_duration = 9;
  string stay_duration_unit = 10;
  string validity_period = 11;
  string validity_period_unit = 12;
}
