syntax = "proto3";

package snowfall.project.junction.plus.service.notification_center.v1alpha;

import "google/protobuf/timestamp.proto";
import "snowfall/stdlib/v1/phone_number.proto";

option go_package = "git.snowfall.se/junction/junction/golang/protobuf/snowfall/project/junction/plus/service/notification_center/v1alpha";

message ConfigurationVector {
  string id = 1;
  string reseller_id = 2;
  Channel channel = 3;
  snowfall.stdlib.v1.PhoneNumber mobile_phone = 4;
  string email = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_EMAIL = 1;
  CHANNEL_WHATSAPP = 2;
}
