.protobuf:files: &files
  - "protobuf/**/*"

.protobuf:buf:
  interruptible: true
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/bufbuild/buf"
    entrypoint: [""]
  variables:
    BUF_BINARY: /usr/local/bin/buf
  tags:
    - docker

.protobuf:buf-test:
  extends: .protobuf:buf
  stage: test
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes: *files

protobuf:breaking:
  extends: .protobuf:buf-test
  script: |
    if ! "${BUF_BINARY}" breaking --against "${CI_REPOSITORY_URL}#ref=${CI_MERGE_REQUEST_DIFF_BASE_SHA}"; then
      if [ "${BREAKING}" -eq "1" ]; then
        exit 2
      else
        exit 1
      fi
    fi
  needs:
    - job: "allow-breaking-changes"
      artifacts: true
  allow_failure:
    exit_codes:
      - 2
