[GLOBAL]
pants_version = "2.14.0"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
backend_packages = [
    "pants.backend.codegen.protobuf.lint.buf",
    "pants.backend.codegen.protobuf.python",
    "pants.backend.docker",
    "pants.backend.docker.lint.hadolint",
    "pants.backend.experimental.python.lint.autoflake",
    "pants.backend.project_info",
    "pants.backend.python",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[anonymous-telemetry]
enabled = false

[autoflake]
version = "autoflake==1.7.7"
lockfile = "vendor/lock/autoflake.txt"
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[bandit]
version = "bandit==1.7.4"
config = "vendor/pyproject.toml"
args = ["--silent"]
lockfile = "vendor/lock/bandit.txt"
extra_requirements = [
    "setuptools",
    "toml",
]

[black]
version = "black==22.10.0"
config = "vendor/pyproject.toml"
lockfile = "vendor/lock/black.txt"
interpreter_constraints = ["CPython==3.10.5"]

[buf]
lint_args = ["--config", "'version: v1\nlint:\n  use:\n    - DEFAULT\n    - UNARY_RPC\n    - PACKAGE_NO_IMPORT_CYCLE\n'"]

[cli.alias]
all-changed = "--changed-since=main --changed-dependees=transitive"

[coverage-py]
global_report = true
interpreter_constraints = ["CPython==3.10.5"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
version = "docformatter==1.5.0"
lockfile = "vendor/lock/docformatter.txt"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.10.5"]

[flake8]
version = "flake8==4.0.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/flake8.txt"
extra_requirements = [
    "flake8-annotations",
    "flake8-builtins",
    "flake8-executable",
    "flake8-if-expr",
    "flake8-logging-format",
    "flake8-noqa",
    "flake8-pie",
    "flake8-print",
    "flake8-simplify",
    "flake8-tidy-imports",
    "setuptools",
    "wemake-python-styleguide",
]
source_plugins = [
    "python/snowfall/plugin/flake8/immutability.py",
    "python/snowfall/plugin/flake8/imports.py",
    "python/snowfall/plugin/flake8/typing.py",
]

[isort]
version = "isort==5.10.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/isort.txt"
interpreter_constraints = ["CPython==3.10.5"]

[mypy]
version = "mypy==0.982"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/mypy.txt"
interpreter_constraints = ["CPython==3.10.5"]
extra_requirements = ["pydantic"]

[mypy-protobuf]
version = "mypy-protobuf==3.4.0"
lockfile = "vendor/lock/mypy-protobuf.txt"
extra_requirements = ["protobuf>=4.21.8"]

[poetry]
interpreter_constraints = ["CPython==3.10.5"]

[protoc]
version = "21.8"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
    "21.8|linux_arm64 |f3d8eb5839d6186392d8c7b54fbeabbb6fcdd90618a500b77cb2e24faa245cad|1579779",
    "21.8|linux_x86_64|f90d0dd59065fef94374745627336d622702b67f0319f96cee894d41a974d47a|1583986",
    "21.8|macos_arm64 |430b644f190e9def5034d641d4e1e0939d59c4bef28a73656a390c3314d44d88|1363556",
    "21.8|macos_x86_64|e1f32612386601ce703dfa10c4ec8b8187e1bf89762b3241f0caa481339cad46|1500574",
]

[pytest]
version = "pytest==7.1.3"
lockfile = "vendor/lock/pytest.txt"
args = [
    "--import-mode=importlib",
    "--asyncio-mode=auto",
    "-W ignore::DeprecationWarning:aioredis.connection:",
    "-W ignore::DeprecationWarning:jsonschema.validators:",
    "-W ignore::DeprecationWarning:openapi_core.unmarshalling.schemas.unmarshallers:",
    "-W ignore::DeprecationWarning:openapi_spec_validator.validators:",
    "-W ignore::DeprecationWarning:openapi_spec_validator.factories:",
    "-W ignore::DeprecationWarning:openapi_schema_validator.validators:",
]
extra_requirements = [
    "pytest-asyncio",
    "pytest-cov",
    "pytest-icdiff",
    "pygments",
    "allure-pytest",
]

[python]
interpreter_constraints = ["CPython==3.10.5"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = {python-default = "vendor/lock/constraints.txt"}

[python-protobuf]
mypy_plugin = true

[regex-lint]
config = "@vendor/regexes.json"

[source]
root_patterns = [
    "/bash",
    "/golang",
    "/openapi",
    "/protobuf",
    "/python",
]

[test]
report_dir = "dist/test_results"
