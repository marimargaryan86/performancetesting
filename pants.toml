[GLOBAL]
pants_version = "2.20.0.dev0"
level = "warn"
pantsd_max_memory_usage = "8GiB"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
unmatched_build_file_globs = "error"
pants_ignore = "+['/golang/', 'node_modules']"
backend_packages = [
  "pants.backend.build_files.fmt.black",
  "pants.backend.codegen.protobuf.lint.buf",
  "pants.backend.codegen.protobuf.python",
  "pants.backend.docker",
  "pants.backend.docker.lint.hadolint",
  "pants.backend.experimental.adhoc",
  "pants.backend.experimental.python.lint.add_trailing_comma",
  "pants.backend.experimental.python.lint.ruff",
  "pants.backend.experimental.tools.yamllint",
  "pants.backend.experimental.visibility",
  "pants.backend.project_info",
  "pants.backend.python",
  "pants.backend.python.lint.autoflake",
  "pants.backend.python.lint.docformatter",
  "pants.backend.python.lint.flake8",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.shell",
  "pants.backend.shell.lint.shellcheck",
  "pants.backend.shell.lint.shfmt",
  "pants.backend.tools.taplo",
]

[add-trailing-comma]
requirements = ["add-trailing-comma"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[anonymous-telemetry]
enabled = false

[autoflake]
requirements = ["autoflake"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[black]
requirements = ["black"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[buf]
config = "protobuf/buf.yaml"
version = "v1.28.0"
known_versions = [
  "v1.28.0|linux_arm64 |6a7211c3142205458f331b6fda7abd0bd78749af016beb301647aa66708c71a8|20002099",
  "v1.28.0|linux_x86_64|0e4294c688e5ee31daa9e01fdcf28946974fa4c0135c59e05dc46947e51cac1d|21808546",
  "v1.28.0|macos_arm64 |f9b862b445520df8f9b39312f1ecbdcc23b05f9edc10ea03b1d376a7eb4d3511|22421921",
  "v1.28.0|macos_x86_64|b7391309204c421b83d6696bfd581f6b9d12bdd44c24bdb40a06da77c5a3e577|23096617",
]

[cli.alias]
all-changed = "--changed-since=main --changed-dependents=transitive"

[coverage-py]
requirements = ["coverage"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
requirements = ["docformatter"]
install_from_resolve = "python-default"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.11.*"]

[flake8]
requirements = [
  "flake8",
  "flake8-deprecated",
  "flake8-if-expr",
  "flake8-noqa",
  "Flake8-pyproject",
  "setuptools",
  "snowfall.plugin.flake8",
  "wemake-python-styleguide",
]
install_from_resolve = "python-default"
extra_files = ["vendor/pyproject.toml"]
args = ["--toml-config", "vendor/pyproject.toml"]

[generate-lockfiles]
diff = true

[mypy]
requirements = ["mypy", "pydantic"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy-protobuf]
requirements = ["mypy-protobuf", "protobuf"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[pex-cli]
version = "v2.1.152"
known_versions = [
  "v2.1.152|linux_arm64 |64640336f60ec06c52ffa174f1b59b39ae1e3894d475ea0ae0abc62c0dda9fac|4205187",
  "v2.1.152|linux_x86_64|64640336f60ec06c52ffa174f1b59b39ae1e3894d475ea0ae0abc62c0dda9fac|4205187",
  "v2.1.152|macos_arm64 |64640336f60ec06c52ffa174f1b59b39ae1e3894d475ea0ae0abc62c0dda9fac|4205187",
  "v2.1.152|macos_x86_64|64640336f60ec06c52ffa174f1b59b39ae1e3894d475ea0ae0abc62c0dda9fac|4205187",
]

[protoc]
version = "25.0"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
  "25.0|linux_arm64 |fe79d0eb356422917279c9580f74d2a486a8173fd020843f3b28ea6b71fba327|3071574",
  "25.0|linux_x86_64|d26c4efe0eae3066bb560625b33b8fc427f55bd35b16f246b7932dc851554e67|3105250",
  "25.0|macos_arm64 |76a997df5dacc0608e880a8e9069acaec961828a47bde16c06116ed2e570588b|2209179",
  "25.0|macos_x86_64|15eefb30ba913e8dc4dd21d2ccb34ce04a2b33124f7d9460e5fd815a5d6459e3|2235088",
]

[pytest]
requirements = [
  "allure-pytest",
  "hvac",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-icdiff",
  "pytest-mock",
  "pytest-socket",
  "pytest-xdist",
]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
xdist_enabled = true

[python]
interpreter_constraints = ["CPython==3.11.*"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = { python-default = "vendor/constraints.txt" }
pip_version = "latest"

[python-infer]
unowned_dependency_behavior = "error"
use_rust_parser = true

[python-protobuf]
mypy_plugin = true

[python-repos]
indexes.add = [
  "https://gitlab+deploy-token-124:kNkm3XvTkUiWo86sa5EW@git.snowfall.se/api/v4/projects/677/packages/pypi/simple",
]


[regex-lint]
config = "@vendor/regexes.json"

[ruff]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"

[setuptools]
install_from_resolve = "python-default"

[shellcheck]
version = "v0.9.0"
known_versions = [
  "v0.9.0|macos_arm64 |a75b912015aaa5b2a48698b63f3619783d90abda4d32a31362209315e6c1cdf6|14423429",
  "v0.9.0|macos_x86_64|d1244da2aa5d0c2874f3a4a680c6ac79a488ff6dbf9928e12dc80ff3fdc294db|6543378",
  "v0.9.0|linux_arm64 |b5633bd195cfe61a310bd8dcff2514855afefea908942a0fd4d01fa6451cb4e6|5083502",
  "v0.9.0|linux_x86_64|0ab5711861e6fcafad5aa21587ee75bbd2b16505d56f41c9ba1191a83d314074|3600036",
]

[shfmt]
version = "v3.7.0"
known_versions = [
  "v3.7.0|macos_arm64 |ad7ff6f666adba3d801eb17365a15539f07296718d39fb62cc2fde6b527178aa|3138130",
  "v3.7.0|macos_x86_64|ae1d1ab961c113fb3dc2ff1150f33c3548983550d91da889b3171a5bcfaab14f|3101472",
  "v3.7.0|linux_arm64 |111612560d15bd53d8e8f8f85731176ce12f3b418ec473d39a40ed6bbec772de|2883584",
  "v3.7.0|linux_x86_64|0264c424278b18e22453fe523ec01a19805ce3b8ebf18eaf3aadc1edc23f42e3|2899968",
]

[source]
root_patterns = [
  "/bash",
  "/golang",
  "/nomad",
  "/openapi",
  "/ory",
  "/protobuf",
  "/python",
  "/svelte",
]

[test]
report_dir = "dist/test_results"

[tailor]
ignore_paths = ["**/node_modules/**", "bash/tests/schedule_tests/**"]

[update-build-files]
fmt = false

[yamllint]
include = "+['.yamllint']"
