[GLOBAL]
pants_version = "2.21.0dev1"
level = "warn"
pantsd_max_memory_usage = "8GiB"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
unmatched_build_file_globs = "error"
pants_ignore = "+['/golang/', 'node_modules']"
backend_packages = [
  "pants.backend.build_files.fmt.ruff",
  "pants.backend.codegen.protobuf.lint.buf",
  "pants.backend.codegen.protobuf.python",
  "pants.backend.docker",
  "pants.backend.docker.lint.hadolint",
  "pants.backend.experimental.adhoc",
  "pants.backend.experimental.python.lint.add_trailing_comma",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.tools.yamllint",
  "pants.backend.experimental.visibility",
  "pants.backend.project_info",
  "pants.backend.python",
  "pants.backend.python.lint.autoflake",
  "pants.backend.python.lint.docformatter",
  "pants.backend.python.lint.flake8",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.shell",
  "pants.backend.shell.lint.shellcheck",
  "pants.backend.shell.lint.shfmt",
  "pants.backend.tools.taplo",
]

[add-trailing-comma]
requirements = ["add-trailing-comma"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[anonymous-telemetry]
enabled = false

[autoflake]
requirements = ["autoflake"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[buf]
config = "protobuf/buf.yaml"
version = "v1.30.0"
known_versions = [
  "v1.30.0|linux_arm64 |70efa6f5379dbe44297f0efac8fdd5e4ea90389330555a23e317f968b51a307c|17688808",
  "v1.30.0|linux_x86_64|219f48fb1bb190e0f761e35cac0821dfd9c1b0dfda80d7aaf522347755d829ab|19246162",
  "v1.30.0|macos_arm64 |2787ed233e2639c833ad2485bcca3c1c9563547ee9430d3e449820458722b590|18649632",
  "v1.30.0|macos_x86_64|3d6a27b472906c4c35e5a5e8fa04305c27abfcbbe94a8eab9c17ed688fb596fa|19749518",
]

[cli.alias]
all-changed = "--changed-since=main --changed-dependents=transitive"

[coverage-py]
requirements = ["coverage"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
requirements = ["docformatter"]
install_from_resolve = "python-default"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.11.*"]

[docker]
use_buildx = true

[flake8]
requirements = [
  "flake8",
  "flake8-deprecated",
  "flake8-if-expr",
  "flake8-noqa",
  "Flake8-pyproject",
  "setuptools",
  "snowfall.plugin.flake8",
  "wemake-python-styleguide",
]
install_from_resolve = "python-default"
extra_files = ["vendor/pyproject.toml"]
args = ["--toml-config", "vendor/pyproject.toml"]

[generate-lockfiles]
diff = true

[mypy]
requirements = ["mypy", "pydantic"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy-protobuf]
requirements = ["mypy-protobuf", "protobuf"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[pex-cli]
version = "v2.2.2"
known_versions = [
  "v2.2.2|linux_arm64 |a27f9881610c5682b71104e17fea21a7bdb79b57c0c8129a6119390f216e0a02|4113902",
  "v2.2.2|linux_x86_64|a27f9881610c5682b71104e17fea21a7bdb79b57c0c8129a6119390f216e0a02|4113902",
  "v2.2.2|macos_arm64 |a27f9881610c5682b71104e17fea21a7bdb79b57c0c8129a6119390f216e0a02|4113902",
  "v2.2.2|macos_x86_64|a27f9881610c5682b71104e17fea21a7bdb79b57c0c8129a6119390f216e0a02|4113902",
]

[protoc]
version = "25.3"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
  "25.3|linux_arm64 |9eae1f20f70cccc912d1c318c3929b86aebf5afd4b0f32c196ef682c222ed5ae|3071653",
  "25.3|linux_x86_64|f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80|3105560",
  "25.3|macos_arm64 |d0fcd6d3b3ef6f22f1c47cc30a80c06727e1eccdddcaf0f4a3be47c070ffd3fe|2209081",
  "25.3|macos_x86_64|247e003b8e115405172eacc50bd19825209d85940728e766f0848eee7c80e2a1|2235056",
]

[pytest]
requirements = [
  "allure-pytest",
  "hvac",
  "pygments",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-icdiff",
  "pytest-mock",
  "pytest-socket",
  "pytest-xdist",
]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
xdist_enabled = true

[python]
interpreter_constraints = ["CPython==3.11.*"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = { python-default = "vendor/constraints.txt" }
pip_version = "24.0"

[python-infer]
unowned_dependency_behavior = "error"
use_rust_parser = true

[python-protobuf]
mypy_plugin = true

[python-repos]
indexes.add = [
  "https://gitlab+deploy-token-124:kNkm3XvTkUiWo86sa5EW@git.snowfall.se/api/v4/projects/677/packages/pypi/simple",
]

[regex-lint]
config = "@vendor/regexes.json"

[ruff]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"

[setuptools]
install_from_resolve = "python-default"

[shellcheck]
version = "v0.10.0"
known_versions = [
  "v0.10.0|linux_arm64 |7b598216ab4b60225ac0c2113d5cbcb84e56ffa3b5eb3c4ffdcb76ebaff77815|7174935",
  "v0.10.0|linux_x86_64|736d51bfeb583fbdfcafc322aab9c8064a53ce30bf00f40468ccbd7492174adf|3673174",
  "v0.10.0|macos_arm64 |dbe2e63ad23ddd83e41902d42f45006246d226f37be6e7e4abc5d6658fe27e39|11384552",
  "v0.10.0|macos_x86_64|b71fffca2886c3cf873a3022a27860a2e54c45dcac08c1355bd9b9786e1c657e|6792933",
]

[shfmt]
version = "v3.8.0"
known_versions = [
  "v3.8.0|linux_arm64 |27e1f69b0d57c584bcbf5c882b4c4f78ffcf945d0efef45c1fbfc6692213c7c3|2687128",
  "v3.8.0|linux_x86_64|27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0|2703512",
  "v3.8.0|macos_arm64 |1481240d2a90d4f0b530688d76d4f9117d17a756b6027cfa42b96f0707317f83|2736466",
  "v3.8.0|macos_x86_64|c0218b47a0301bb006f49fad85d2c08de23df303472834faf5639d04121320f8|2747696",
]

[source]
root_patterns = [
  "/bash",
  "/golang",
  "/nomad",
  "/openapi",
  "/ory",
  "/protobuf",
  "/python",
  "/svelte",
]

[test]
report_dir = "dist/test_results"

[tailor]
ignore_paths = ["**/node_modules/**", "bash/tests/schedule_tests/**"]

[update-build-files]
fmt = false

[yamllint]
args = "--strict"
include = "+['.yamllint']"
install_from_resolve = "python-default"
