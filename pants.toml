[GLOBAL]
pants_version = "2.6.0.dev2"
backend_packages = [
    "pants.backend.codegen.protobuf.python",
    "pants.backend.python",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
]

[anonymous-telemetry]
enabled = false

[coverage-py]
interpreter_constraints = [
    "CPython==3.9.5",
]

[docformatter]
args = [
    "--wrap-summaries",
    "88",
    "--wrap-descriptions",
    "81",
]
interpreter_constraints = [
    "CPython==3.9.5",
]

[isort]
config = ".isort.cfg"

[mypy]
version = "mypy==0.902"
extra_requirements = [
    "grpc-stubs==1.24.6",
    "types-protobuf==0.1.12",
]

[protoc]
version = "3.17.3"
known_versions = [
    "3.17.3|darwin|68901eb7ef5b55d7f2df3241ab0b8d97ee5192d3902c59e7adf461adc058e9f1|2617055",
    "3.17.3|linux |d4246a5136cf9cd1abc851c521a1ad6b8884df4feded8b9cbd5e2a2226d4b357|1680819",
]

[pytest]
junit_xml_dir = "dist/pytest_results"

[python-protobuf]
mypy_plugin = true
runtime_dependencies = [
    "vendor:grpcio",
    "vendor:protobuf",
]

[python-setup]
interpreter_constraints = [
    "CPython==3.9.5",
]
requirement_constraints = "vendor/requirements.txt"

[source]
root_patterns = [
    "/bash",
    "/protobuf",
    "/python",
]
