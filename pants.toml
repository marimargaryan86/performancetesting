[GLOBAL]
pants_version = "2.10.0rc4"
use_deprecated_python_macros = false
backend_packages = [
    "pants.backend.codegen.protobuf.python",
    "pants.backend.docker",
    "pants.backend.docker.lint.hadolint",
    "pants.backend.python",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[anonymous-telemetry]
enabled = false

[bandit]
version = "bandit==1.7.2"
config = "vendor/pyproject.toml"
args = ["--silent"]
lockfile = "vendor/lock/bandit.txt"
extra_requirements = [
    "setuptools",
    "toml",
]

[black]
version = "black==22.1.0"
config = "vendor/pyproject.toml"
lockfile = "vendor/lock/black.txt"
interpreter_constraints = ["CPython==3.9.10"]

[coverage-py]
interpreter_constraints = ["CPython==3.9.10"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
version = "docformatter==1.4"
lockfile = "vendor/lock/docformatter.txt"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.9.10"]

[flake8]
version = "flake8==4.0.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/flake8.txt"
extra_requirements = [
    "bandit==1.7.2", # 1.7.3 breaks flake8-bandit
    "flake8-annotations",
    "flake8-builtins",
    "flake8-executable",
    "flake8-if-expr",
    "flake8-logging-format",
    "flake8-pie",
    "flake8-print",
    "flake8-simplify",
    "flake8-tidy-imports",
    "setuptools",
    "wemake-python-styleguide",
]

[isort]
version = "isort==5.10.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/isort.txt"
interpreter_constraints = ["CPython==3.9.10"]

[mypy]
version = "mypy==0.931"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/mypy.txt"
interpreter_constraints = ["CPython==3.9.10"]
extra_requirements = ["grpc-stubs", "pydantic"]

[poetry]
interpreter_constraints = ["CPython==3.9.10"]

[protoc]
version = "3.19.4"
known_versions = [
    "3.19.4|linux_x86_64|058d29255a08f8661c8096c92961f3676218704cbd516d3916ec468e139cbd87|1699853",
    "3.19.4|macos_arm64 |d8b55cf1e887917dd43c447d77bd5bd213faff1e18ac3a176b35558d86f7ffff|2676128",
    "3.19.4|macos_x86_64|d8b55cf1e887917dd43c447d77bd5bd213faff1e18ac3a176b35558d86f7ffff|2676128",
]

[pytest]
version = "pytest==7.0.1"
lockfile = "vendor/lock/pytest.txt"
args = ["--import-mode=importlib --asyncio-mode=auto"]
extra_requirements = [
    "pytest-asyncio",
    "pytest-cov",
    "pytest-icdiff",
    "pygments",
]

[python]
interpreter_constraints = ["CPython==3.9.10"]
enable_resolves = true
resolves = {python-default = "vendor/lock/constraints.txt"}

[python-protobuf]
mypy_plugin = true

[source]
root_patterns = [
    "/bash",
    "/golang",
    "/openapi",
    "/protobuf",
    "/python",
]

[test]
xml_dir = "dist/test_results"
