[GLOBAL]
pants_version = "2.13.0"
use_deprecated_directory_cli_args_semantics = false
use_deprecated_pex_binary_run_semantics = false
backend_packages = [
    "pants.backend.codegen.protobuf.lint.buf",
    "pants.backend.codegen.protobuf.python",
    "pants.backend.docker",
    "pants.backend.docker.lint.hadolint",
    "pants.backend.experimental.python.lint.autoflake",
    "pants.backend.project_info",
    "pants.backend.python",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[anonymous-telemetry]
enabled = false

[autoflake]
version = "autoflake==1.4"
lockfile = "vendor/lock/autoflake.txt"
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[bandit]
version = "bandit==1.7.4"
config = "vendor/pyproject.toml"
args = ["--silent"]
lockfile = "vendor/lock/bandit.txt"
extra_requirements = [
    "setuptools",
    "toml",
]

[black]
version = "black==22.6.0"
config = "vendor/pyproject.toml"
lockfile = "vendor/lock/black.txt"
interpreter_constraints = ["CPython==3.10.5"]

[cli.alias]
all-changed = "--changed-since=main --changed-dependees=transitive"

[coverage-py]
global_report = true
interpreter_constraints = ["CPython==3.10.5"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
version = "docformatter==1.5.0"
lockfile = "vendor/lock/docformatter.txt"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.10.5"]

[flake8]
version = "flake8==4.0.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/flake8.txt"
extra_requirements = [
    "flake8-annotations",
    "flake8-builtins",
    "flake8-executable",
    "flake8-if-expr",
    "flake8-logging-format",
    "flake8-noqa",
    "flake8-pie",
    "flake8-print",
    "flake8-simplify",
    "flake8-tidy-imports",
    "setuptools",
    "wemake-python-styleguide",
]
source_plugins = [
    "python/snowfall/plugin/flake8/immutability.py",
    "python/snowfall/plugin/flake8/imports.py",
    "python/snowfall/plugin/flake8/typing.py",
]

[isort]
version = "isort==5.10.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/isort.txt"
interpreter_constraints = ["CPython==3.10.5"]

[mypy]
version = "mypy==0.971"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/mypy.txt"
interpreter_constraints = ["CPython==3.10.5"]
extra_requirements = ["pydantic"]

[mypy-protobuf]
version = "mypy-protobuf==3.2.0"
lockfile = "vendor/lock/mypy-protobuf.txt"

[poetry]
interpreter_constraints = ["CPython==3.10.5"]

[protoc]
version = "21.5"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
    "21.5|linux_arm64 |60744ee6be123f86921c86d83d0060a7261410e246eca9e7a5c195100a89d391|1581318",
    "21.5|linux_x86_64|92fb4f5066a6f7b870e09c73115a2c861852af8f6555d8da9955fdb80710bf7f|1585173",
    "21.5|macos_arm64 |b22aed8dce62656687c6c4a323aab4e6baf1cb81ee423e77bc671bd69679e2c3|1360448",
    "21.5|macos_x86_64|495d86aaaf5e8b536fbf04471ee9d7b21addeee5f1e949742c67bd09bb59c890|1496925",
]

[pytest]
version = "pytest==7.1.2"
lockfile = "vendor/lock/pytest.txt"
args = ["--import-mode=importlib --asyncio-mode=auto"]
extra_requirements = [
    "pytest-asyncio",
    "pytest-cov",
    "pytest-icdiff",
    "pygments",
    "allure-pytest",
]

[python]
lockfile_generator = "pex"
interpreter_constraints = ["CPython==3.10.5"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = {python-default = "vendor/lock/constraints.txt"}

[python-protobuf]
mypy_plugin = true

[regex-lint]
config = "@vendor/regexes.json"

[source]
root_patterns = [
    "/bash",
    "/golang",
    "/openapi",
    "/protobuf",
    "/python",
]

[test]
report_dir = "dist/test_results"
