[GLOBAL]
pants_version = "2.16.0"
level = "warn"
pantsd_max_memory_usage = "8GiB"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
unmatched_build_file_globs = "error"
pants_ignore = "+['/golang/']"
backend_packages = [
    "pants.backend.build_files.fmt.black",
    "pants.backend.codegen.protobuf.lint.buf",
    "pants.backend.codegen.protobuf.python",
    "pants.backend.docker",
    "pants.backend.docker.lint.hadolint",
    "pants.backend.experimental.adhoc",
    "pants.backend.experimental.python.lint.add_trailing_comma",
    "pants.backend.experimental.python.lint.ruff",
    "pants.backend.experimental.visibility",
    "pants.backend.project_info",
    "pants.backend.python",
    "pants.backend.python.lint.autoflake",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[add-trailing-comma]
requirements = ["add-trailing-comma"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[anonymous-telemetry]
enabled = false

[autoflake]
requirements = ["autoflake"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[black]
requirements = ["black"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[buf]
config = "protobuf/buf.yaml"
version = "v1.25.1"
known_versions = [
    "v1.25.1|linux_arm64 |6940331d4b7c852da959513680b2249a0754484711a14ab9e8e3c1042f463749|15823775",
    "v1.25.1|linux_x86_64|b9fe83630604dc1fecaf7d1cfdda12b581eb9601eac49308c976dcf8e71ebd6e|17393625",
    "v1.25.1|macos_arm64 |324410e35186bc2a4b5c4ac984b5c1a599040fbb7e7c7e38b35427d55d14f66a|17734187",
    "v1.25.1|macos_x86_64|18a23fd9fc5a1be2116957eca6ddddf8c15b0eb16e3b1156e43f3c9a516f5a74|18334627",
]

[cli.alias]
all-changed = "--changed-since=main --changed-dependents=transitive"

[coverage-py]
global_report = true
interpreter_constraints = ["CPython==3.11.*"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
requirements = ["docformatter"]
install_from_resolve = "python-default"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.11.*"]

[flake8]
requirements = [
    "flake8",
    "flake8-deprecated",
    "flake8-if-expr",
    "flake8-noqa",
    "flake8-todos",
    "setuptools",
    "wemake-python-styleguide",
]
config = "vendor/setup.cfg"
install_from_resolve = "python-default"
source_plugins = [
    "python/snowfall/plugin/flake8/immutability.py",
    "python/snowfall/plugin/flake8/imports.py",
    "python/snowfall/plugin/flake8/typing.py",
]

[generate-lockfiles]
diff = true

[mypy]
requirements = ["mypy", "pydantic"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy-protobuf]
requirements = ["mypy-protobuf", "protobuf"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[protoc]
version = "23.4"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
    "23.4|linux_arm64 |1c7750b6e038305b5a7fc3d0cda1ebefdf106a4f30a787bf826ed2fc47c3967d|2879347",
    "23.4|linux_x86_64|0502f286ac9ed860b629a7965a14527b1f2dd131e4283fa23c2d7f184672aa9a|2916317",
    "23.4|macos_arm64 |8c7afae8626b6811e7b5897d16d940c2dbf50b1e135ed958a01db6566bdda726|1974960",
    "23.4|macos_x86_64|07e5fdcf1b0708d3367dc5e6eb8d135de7e407d75316c93155cfd8ab362eec80|2008727",
]

[pytest]
requirements = [
    "allure-pytest",
    "hvac",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-icdiff",
    "pytest-socket",
    "pytest-xdist",
]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
xdist_enabled = true

[python]
interpreter_constraints = ["CPython==3.11.*"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = {python-default = "vendor/constraints.txt"}

[python-infer]
unowned_dependency_behavior = "error"

[python-protobuf]
mypy_plugin = true

[regex-lint]
config = "@vendor/regexes.json"

[ruff]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"

[shellcheck]
version = "v0.9.0"
known_versions = [
    "v0.9.0|macos_arm64 |7d3730694707605d6e60cec4efcb79a0632d61babc035aa16cda1b897536acf5|4204804",
    "v0.9.0|macos_x86_64|7d3730694707605d6e60cec4efcb79a0632d61babc035aa16cda1b897536acf5|4204804",
    "v0.9.0|linux_arm64 |179c579ef3481317d130adebede74a34dbbc2df961a70916dd4039ebf0735fae|3110236",
    "v0.9.0|linux_x86_64|700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f|2351560",
]

[shfmt]
version = "v3.7.0"
known_versions = [
    "v3.7.0|macos_arm64 |ad7ff6f666adba3d801eb17365a15539f07296718d39fb62cc2fde6b527178aa|3138130",
    "v3.7.0|macos_x86_64|ae1d1ab961c113fb3dc2ff1150f33c3548983550d91da889b3171a5bcfaab14f|3101472",
    "v3.7.0|linux_arm64 |111612560d15bd53d8e8f8f85731176ce12f3b418ec473d39a40ed6bbec772de|2883584",
    "v3.7.0|linux_x86_64|0264c424278b18e22453fe523ec01a19805ce3b8ebf18eaf3aadc1edc23f42e3|2899968",
]

[source]
root_patterns = [
    "/bash",
    "/golang",
    "/openapi",
    "/protobuf",
    "/python",
]

[test]
report_dir = "dist/test_results"

[tailor]
ignore_paths = [
    "bash/tests/schedule_tests/**",
]

[update-build-files]
fmt = false
