[GLOBAL]
pants_version = "2.22.0.dev1"
level = "warn"
pantsd_max_memory_usage = "8GiB"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
unmatched_build_file_globs = "error"
pants_ignore = "+['/golang/', 'node_modules']"
plugins = ["snowfall.plugin.pants==1.5.1"]
backend_packages = [
  "pants.backend.build_files.fmt.ruff",
  "pants.backend.codegen.protobuf.lint.buf",
  "pants.backend.codegen.protobuf.python",
  "pants.backend.docker",
  "pants.backend.docker.lint.hadolint",
  "pants.backend.experimental.adhoc",
  "pants.backend.experimental.python.lint.add_trailing_comma",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.tools.yamllint",
  "pants.backend.experimental.visibility",
  "pants.backend.project_info",
  "pants.backend.python",
  "pants.backend.python.lint.docformatter",
  "pants.backend.python.lint.flake8",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.shell",
  "pants.backend.shell.lint.shellcheck",
  "pants.backend.shell.lint.shfmt",
  "pants.backend.tools.taplo",
  "snowfall.plugin.pants.codegen",
  "snowfall.plugin.pants.nomad",
]

[add-trailing-comma]
requirements = ["add-trailing-comma"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[anonymous-telemetry]
enabled = false

[buf]
config = "protobuf/buf.yaml"
version = "v1.30.1"
known_versions = [
  "v1.30.1|linux_arm64 |25d9b73c364e4b07961d0d162a7727b1179bdaf554a3dc9c74fad24920e0a058|17690731",
  "v1.30.1|linux_x86_64|4d329fdd44146616325c0ad1ee7ebd34886d915131f5457bbb5e0f2a54ae7963|19247295",
  "v1.30.1|macos_arm64 |0822f59120c22ac54593186c2321d1b8e907ae61a603b7416a8a41801939beeb|18653179",
  "v1.30.1|macos_x86_64|ac84880ff5d55d3280c04c91be859c34ba27571024cba9f683bc3b3cb763f498|19753339",
]

[cli.alias]
all-changed = "--changed-since=main --changed-dependents=transitive"

[coverage-py]
requirements = ["coverage"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
requirements = ["docformatter"]
install_from_resolve = "python-default"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.11.*"]

[docker]
use_buildx = true

[flake8]
requirements = [
  "flake8",
  "flake8-deprecated",
  "flake8-if-expr",
  "flake8-noqa",
  "Flake8-pyproject",
  "setuptools",
  "snowfall.plugin.flake8",
  "wemake-python-styleguide",
]
install_from_resolve = "python-default"
extra_files = ["vendor/pyproject.toml"]
args = ["--toml-config", "vendor/pyproject.toml"]

[generate-lockfiles]
diff = true

[mypy]
requirements = ["mypy", "pydantic"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy-protobuf]
requirements = ["mypy-protobuf", "protobuf"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[pex-cli]
version = "v2.3.1"
known_versions = [
  "v2.3.1|linux_arm64 |71690e672871b55323f5d6ef9a3fe9705f1668662652c4081080e7ab27d44de3|4124530",
  "v2.3.1|linux_x86_64|71690e672871b55323f5d6ef9a3fe9705f1668662652c4081080e7ab27d44de3|4124530",
  "v2.3.1|macos_arm64 |71690e672871b55323f5d6ef9a3fe9705f1668662652c4081080e7ab27d44de3|4124530",
  "v2.3.1|macos_x86_64|71690e672871b55323f5d6ef9a3fe9705f1668662652c4081080e7ab27d44de3|4124530",
]

[protoc]
version = "26.1"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
  "26.1|linux_arm64 |64a3b3b5f7dac0c8f9cf1cb85b2b1a237eb628644f6bcb0fb8f23db6e0d66181|3141384",
  "26.1|linux_x86_64|a7be2928c0454f132c599e25b79b7ad1b57663f2337d7f7e468a1d59b98ec1b0|3173150",
  "26.1|macos_arm64 |26a29befa8891ecc48809958c909d284f2b9539a2eb47f22cadc631fe6abe8fd|2304045",
  "26.1|macos_x86_64|febd8821c3a2a23f72f4641471e0ab6486f4fb07b68111490a27a31681465b3c|2279373",
]

[pytest]
requirements = [
  "allure-pytest",
  "hvac",
  "pygments",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-icdiff",
  "pytest-mock",
  "pytest-socket",
  "pytest-xdist",
]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
xdist_enabled = true

[python]
interpreter_constraints = ["CPython==3.11.*"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = { python-default = "vendor/constraints.txt" }
pip_version = "24.0"

[python-infer]
unowned_dependency_behavior = "error"
use_rust_parser = true

[python-protobuf]
mypy_plugin = true

[python-repos]
indexes.add = [
  "https://gitlab+deploy-token-124:kNkm3XvTkUiWo86sa5EW@git.snowfall.se/api/v4/projects/677/packages/pypi/simple",
]

[regex-lint]
config = "@vendor/regexes.json"

[ruff]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"

[setuptools]
install_from_resolve = "python-default"

[shellcheck]
version = "v0.10.0"
known_versions = [
  "v0.10.0|linux_arm64 |324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb|4291764",
  "v0.10.0|linux_x86_64|6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87|2404716",
  "v0.10.0|macos_arm64 |bbd2f14826328eee7679da7221f2bc3afb011f6a928b848c80c321f6046ddf81|7205756",
  "v0.10.0|macos_x86_64|ef27684f23279d112d8ad84e0823642e43f838993bbb8c0963db9b58a90464c2|4371632",
]

[shfmt]
version = "v3.8.0"
known_versions = [
  "v3.8.0|linux_arm64 |27e1f69b0d57c584bcbf5c882b4c4f78ffcf945d0efef45c1fbfc6692213c7c3|2687128",
  "v3.8.0|linux_x86_64|27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0|2703512",
  "v3.8.0|macos_arm64 |1481240d2a90d4f0b530688d76d4f9117d17a756b6027cfa42b96f0707317f83|2736466",
  "v3.8.0|macos_x86_64|c0218b47a0301bb006f49fad85d2c08de23df303472834faf5639d04121320f8|2747696",
]

[source]
root_patterns = [
  "/bash",
  "/docs",
  "/golang",
  "/nomad",
  "/openapi",
  "/protobuf",
  "/python",
  "/svelte",
]

[test]
report_dir = "dist/test_results"

[tailor]
ignore_paths = ["**/node_modules/**", "bash/tests/schedule_tests/**"]

[update-build-files]
fmt = false

[yamllint]
args = "--strict"
include = "+['.yamllint']"
install_from_resolve = "python-default"
