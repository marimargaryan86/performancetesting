[GLOBAL]
pants_version = "2.8.1rc1"
backend_packages = [
    "pants.backend.codegen.protobuf.python",
    "pants.backend.experimental.docker",
    "pants.backend.experimental.docker.lint.hadolint",
    "pants.backend.experimental.go",
    "pants.backend.python",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[anonymous-telemetry]
enabled = false

[bandit]
version = "bandit==1.7.1"
config = "vendor/pyproject.toml"
args = ["--silent"]
lockfile = "vendor/lock/bandit.txt"
extra_requirements = [
    "setuptools",
    "toml",
]

[black]
version = "black==21.10b0"
config = "vendor/pyproject.toml"
lockfile = "vendor/lock/black.txt"
interpreter_constraints = ["CPython==3.9.9"]

[coverage-py]
interpreter_constraints = ["CPython==3.9.9"]
config = "vendor/pyproject.toml"

[docformatter]
version = "docformatter==1.4"
lockfile = "vendor/lock/docformatter.txt"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.9.9"]

[flake8]
version = "flake8==3.9.2"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/flake8.txt"
extra_requirements = [
    "flake8-annotations",
    "flake8-builtins",
    "flake8-executable",
    "flake8-if-expr",
    "flake8-logging-format",
    "flake8-pie",
    "flake8-print",
    "flake8-simplify",
    "flake8-tidy-imports",
    "setuptools",
    "wemake-python-styleguide==0.15.3",
]

[golang]
expected_version = "1.17"

[isort]
version = "isort==5.10.1"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/isort.txt"
interpreter_constraints = ["CPython==3.9.9"]

[mypy]
version = "mypy==0.910"
config = "vendor/setup.cfg"
lockfile = "vendor/lock/mypy.txt"
interpreter_constraints = ["CPython==3.9.9"]
extra_requirements = ["grpc-stubs"]

[poetry]
version = "poetry==1.1.12"
interpreter_constraints = ["CPython==3.9.9"]

[protoc]
version = "3.17.3"
known_versions = [
    "3.17.3|linux_x86_64|d4246a5136cf9cd1abc851c521a1ad6b8884df4feded8b9cbd5e2a2226d4b357|1680819",
    "3.17.3|macos_arm64 |68901eb7ef5b55d7f2df3241ab0b8d97ee5192d3902c59e7adf461adc058e9f1|2617055",
    "3.17.3|macos_x86_64|68901eb7ef5b55d7f2df3241ab0b8d97ee5192d3902c59e7adf461adc058e9f1|2617055",
]

[pytest]
version = "pytest==6.2.5"
lockfile = "vendor/lock/pytest.txt"
extra_requirements = [
    "pytest-cov",
    "pytest-icdiff",
    "pygments",
]

[python]
interpreter_constraints = ["CPython==3.9.9"]
requirement_constraints = "vendor/lock/constraints.txt"

[python-protobuf]
mypy_plugin = true
runtime_dependencies = [
    "vendor:grpcio",
    "vendor:protobuf",
]

[source]
root_patterns = [
    "/bash",
    "/protobuf",
    "/python",
]

[test]
xml_dir = "dist/test_results"
