[GLOBAL]
pants_version = "2.16.0rc3"
level = "warn"
pantsd_max_memory_usage = "8GiB"
build_file_prelude_globs = ["python/snowfall/plugin/pants/macros.py"]
unmatched_build_file_globs = "error"
backend_packages = [
    "pants.backend.build_files.fmt.black",
    "pants.backend.codegen.protobuf.lint.buf",
    "pants.backend.codegen.protobuf.python",
    "pants.backend.docker",
    "pants.backend.docker.lint.hadolint",
    "pants.backend.experimental.adhoc",
    "pants.backend.experimental.codegen.protobuf.go",
    "pants.backend.experimental.go",
    "pants.backend.experimental.python.lint.add_trailing_comma",
    "pants.backend.experimental.visibility",
    "pants.backend.project_info",
    "pants.backend.python",
    "pants.backend.python.lint.autoflake",
    "pants.backend.python.lint.bandit",
    "pants.backend.python.lint.black",
    "pants.backend.python.lint.docformatter",
    "pants.backend.python.lint.flake8",
    "pants.backend.python.lint.isort",
    "pants.backend.python.typecheck.mypy",
    "pants.backend.shell",
    "pants.backend.shell.lint.shellcheck",
    "pants.backend.shell.lint.shfmt",
]

[add-trailing-comma]
requirements = ["add-trailing-comma"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[anonymous-telemetry]
enabled = false

[autoflake]
requirements = ["autoflake"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]
args = ["--remove-all-unused-imports", "--remove-unused-variables"]

[bandit]
requirements = ["bandit"]
config = "vendor/pyproject.toml"
args = ["--silent"]
install_from_resolve = "python-default"

[black]
requirements = ["black"]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[buf]
lint_args = ["--config", "'version: v1\nlint:\n  use:\n    - DEFAULT\n    - UNARY_RPC\n    - PACKAGE_NO_IMPORT_CYCLE\n'"]
version = "v1.17.0"
known_versions = [
    "v1.17.0|linux_arm64 |7ae3d4bf6ff121172dd949bd4d25342e03a0b7f10cf8e8ccdc8f98a664b79794|15426236",
    "v1.17.0|linux_x86_64|f79670efc64d0527e0b915a272aea8262b4864ad9298e8d1cf39b7b08517607c|17022175",
    "v1.17.0|macos_arm64 |8b5d0285b11c14abd17fa8d76049e5ba90e8776784cc57aa0af77052ee335e99|17332365",
    "v1.17.0|macos_x86_64|4a9a9af802630d7547dfbd79727c462ec7acd4978b91b922957438d4aec99ac9|17959744",
]

[cli.alias]
all-changed = "--changed-since=main --changed-dependents=transitive"

[coverage-py]
global_report = true
interpreter_constraints = ["CPython==3.11.*"]
config = "vendor/pyproject.toml"
report = ["console", "html"]

[docformatter]
requirements = ["docformatter"]
install_from_resolve = "python-default"
args = ["--wrap-summaries", "87", "--wrap-descriptions", "80"]
interpreter_constraints = ["CPython==3.11.*"]

[flake8]
requirements = [
    "flake8",
    "flake8-annotations",
    "flake8-async",
    "flake8-builtins",
    "flake8-deprecated",
    "flake8-executable",
    "flake8-if-expr",
    "flake8-logging-format",
    "flake8-noqa",
    "flake8-pie",
    "flake8-print",
    "flake8-pytest-style",
    "flake8-simplify",
    "flake8-tidy-imports",
    "flake8-todos",
    "setuptools",
    "wemake-python-styleguide",
]
config = "vendor/setup.cfg"
install_from_resolve = "python-default"
source_plugins = [
    "python/snowfall/plugin/flake8/immutability.py",
    "python/snowfall/plugin/flake8/imports.py",
    "python/snowfall/plugin/flake8/typing.py",
]

[generate-lockfiles]
diff = true

[golang]
minimum_expected_version = "1.19"

[isort]
requirements = ["isort"]
config = "vendor/setup.cfg"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy]
requirements = ["mypy", "pydantic"]
config = "vendor/setup.cfg"
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[mypy-protobuf]
requirements = ["mypy-protobuf", "protobuf"]
install_from_resolve = "python-default"
interpreter_constraints = ["CPython==3.11.*"]

[protoc]
version = "22.3"
url_platform_mapping = { linux_arm64 = "linux-aarch_64", linux_x86_64 = "linux-x86_64", macos_arm64 = "osx-aarch_64", macos_x86_64 = "osx-x86_64" }
known_versions = [
    "22.3|linux_arm64 |c6068d9d151c39723bc7db920759b55737a770b0c2ec544dd0197d4078d7a956|2788488",
    "22.3|linux_x86_64|0f8070d762eb8a2f5a13a47713a553f989f9d9b556e7e3ebfa2bd6464e2ecaeb|2827739",
    "22.3|macos_arm64 |79cc15d1b528061ea0a818b0abcf3be1e0bdcb063a0cc999af27974cccdc5cce|1878576",
    "22.3|macos_x86_64|d644a65064a97fa3ed033a4a2314ab35816abbd9aed052f9b1b3374d2deaaae4|1841496",
]

[pytest]
requirements = [
    "allure-pytest",
    "hvac",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-icdiff",
    "pytest-socket",
    "pytest-xdist",
]
config = "vendor/pyproject.toml"
install_from_resolve = "python-default"
xdist_enabled = true

[python]
interpreter_constraints = ["CPython==3.11.*"]
enable_resolves = true
tailor_pex_binary_targets = false
resolves = {python-default = "vendor/constraints.txt"}

[python-infer]
unowned_dependency_behavior = "error"

[python-protobuf]
mypy_plugin = true

[regex-lint]
config = "@vendor/regexes.json"

[shellcheck]
version = "v0.9.0"
known_versions = [
    "v0.9.0|macos_arm64 |7d3730694707605d6e60cec4efcb79a0632d61babc035aa16cda1b897536acf5|4204804",
    "v0.9.0|macos_x86_64|7d3730694707605d6e60cec4efcb79a0632d61babc035aa16cda1b897536acf5|4204804",
    "v0.9.0|linux_arm64 |179c579ef3481317d130adebede74a34dbbc2df961a70916dd4039ebf0735fae|3110236",
    "v0.9.0|linux_x86_64|700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f|2351560",
]

[shfmt]
version = "v3.6.0"
known_versions = [
    "v3.6.0|macos_arm64 |633f242246ee0a866c5f5df25cbf61b6af0d5e143555aca32950059cf13d91e0|3065202",
    "v3.6.0|macos_x86_64|b8c9c025b498e2816b62f0b717f6032e9ab49e725a45b8205f52f66318f17185|3047552",
    "v3.6.0|linux_arm64 |fb1cf0af3dbe9aac7d98e38e3c7426765208ecfe23cb2da51037bb234776fd70|2818048",
    "v3.6.0|linux_x86_64|5741a02a641de7e56b8da170e71a97e58050d66a3cf485fb268d6a5a8bb74afb|2850816",
]

[source]
root_patterns = [
    "/bash",
    "/golang",
    "/openapi",
    "/protobuf",
    "/python",
]

[test]
report_dir = "dist/test_results"

[tailor]
ignore_paths = [
    "bash/tests/schedule_tests/**"
]

[update-build-files]
fmt = false
